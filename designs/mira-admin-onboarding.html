      --ground:#0a0a0a;--bg:#0a0a0a;--panel:#141414;--panel-2:#1c1c1c;--card:#0f0f0f;
      --border:#262626;--border-strong:#333333;--fg:#fafafa;--fg-strong:#ffffff;
      --muted:#a3a3a3;--muted-2:#6b6b6b;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-disabled:#333333;
      --brand:#a07fe0;--sel:#a07fe0;--sel-tint:#1e1630;--sel-fill:#8157ca;--sel-check:#ffffff;
      --allow:#a07fe0;--allow-tint:#1e1630;--block:#fafafa;
      --success:#4ade80;--success-bg:#0f2417;--success-border:#1f5132;
      --danger:#f87171;--danger-tint:#2a1414;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow:0 1px 2px rgba(0,0,0,.5);--shadow-lg:0 24px 60px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0a0a0a;--bg:#0a0a0a;--panel:#141414;--panel-2:#1c1c1c;--card:#0f0f0f;
    --border:#262626;--border-strong:#333333;--fg:#fafafa;--fg-strong:#ffffff;
    --muted:#a3a3a3;--muted-2:#6b6b6b;--btn:#fafafa;--btn-fg:#0a0a0a;--btn-disabled:#333333;
    --brand:#a07fe0;--sel:#a07fe0;--sel-tint:#1e1630;--sel-fill:#8157ca;--sel-check:#ffffff;
    --allow:#a07fe0;--allow-tint:#1e1630;--block:#fafafa;
    --success:#4ade80;--success-bg:#0f2417;--success-border:#1f5132;
    --danger:#f87171;--danger-tint:#2a1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.5);--shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--fg);font-family:'General Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  #root{min-height:100vh;display:flex;flex-direction:column}

  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 26px;height:60px}
  .brand{font-weight:600;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-strong)}
  .stepper{justify-self:center;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;white-space:nowrap;min-width:0}
  .stepper .st{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);flex:0 0 auto;white-space:nowrap;line-height:14px}
  .stepper .st.is-done,.stepper .st.cur{color:var(--fg)}
  .stepper .st .mk{width:14px;height:14px;display:grid;place-items:center;color:currentColor;flex:0 0 14px}
  .stepper .st .mk svg{width:14px;height:14px}
  .stepper .ln{width:26px;min-width:8px;height:1px;background:var(--border);flex:0 1 26px}
  @media (max-width:640px){.stepper{display:none}}

  main{flex:1;width:100%;display:flex;justify-content:center;align-items:stretch}
  .sheet{width:100%;max-width:var(--maxw);background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);padding:clamp(28px,4vw,48px) clamp(24px,4vw,44px);display:flex;flex-direction:column}
  .sheet>.fade{flex:1;display:flex;flex-direction:column;min-width:0}

  .backlink{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;padding:4px 6px;margin:-4px 0 14px -6px;border-radius:8px}
  .backlink:hover{color:var(--fg)}
  .backlink svg{width:15px;height:15px}

  .stepeyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:0 0 11px}
  h1{font-size:clamp(24px,3vw,30px);font-weight:500;letter-spacing:-.01em;color:var(--fg-strong);margin:0 0 9px;text-wrap:balance}
  .lede{margin:0 0 16px;color:var(--muted);font-size:16px;text-wrap:pretty}

  .eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px}
  .eyebrow:first-of-type{margin-top:0}

  /* search */
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius);padding:0 13px;margin-bottom:8px}
  .search:focus-within{border-color:var(--sel)}
  .search svg{width:17px;height:17px;color:var(--muted-2);flex:0 0 auto}
  .search input{border:0;outline:0;background:none;color:var(--fg);font-size:15px;font-family:inherit;padding:12px 0;width:100%}
  .minilabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 2px 10px}

  /* tool grid + rows */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  @media (max-width:700px){.grid{grid-template-columns:1fr 1fr}}
  @media (max-width:440px){.grid{grid-template-columns:1fr}}
  .tool{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;cursor:pointer;transition:border-color .12s ease,background .12s ease;text-align:left;width:100%;font-family:inherit}
  .tool:hover{border-color:var(--border-strong)}
  .tool.sel{border-color:var(--sel);background:var(--sel-tint)}
  .tool .tmeta{min-width:0;flex:1}
  .tool .tname{font-weight:500;font-size:14.5px;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool .tcat{font-size:13px;color:var(--muted);margin-top:1px}
  .tool .customize{display:inline-block;background:none;border:0;color:var(--sel);font-weight:500;font-size:12px;font-family:inherit;cursor:pointer;padding:1px 0;margin-top:2px}
  .tool .customize:hover{text-decoration:underline}
  .tool .pillinfo{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);flex:0 0 auto;white-space:nowrap}

  .selected-wrap{display:flex;flex-direction:column;gap:10px}

  /* icon */
  .ic{width:36px;height:36px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden}
  .ic.logo{background:#fff;box-shadow:inset 0 0 0 1px rgba(16,18,22,.07)}
  .ic.mono{color:#fff;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .ic.mono .g{width:20px;height:20px}

  /* checkbox */
  .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--card);display:grid;place-items:center;flex:0 0 auto;transition:background .12s,border-color .12s}
  .cb svg{width:13px;height:13px;color:var(--sel-check);opacity:0}
  .tool.sel .cb{background:var(--sel-fill);border-color:var(--sel-fill)}
  .tool.sel .cb svg,.cb.on svg{opacity:1}

  .reassure{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin:20px 0 0;color:var(--muted);font-size:13.5px}
  .reassure svg{width:16px;height:16px;flex:0 0 auto;color:var(--sel)}
  .linkbtn{background:none;border:0;padding:0;color:var(--sel);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .infodot{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:7px;vertical-align:-3px;color:var(--muted-2);cursor:help;flex:0 0 auto}
  .infodot>svg{width:15px;height:15px}
  .infodot:hover,.infodot:focus-visible{color:var(--sel);outline:none}
  .infotip{position:absolute;bottom:calc(100% + 9px);left:-6px;width:258px;background:var(--card);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-lg);padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--fg);z-index:30;display:none;cursor:default;font-weight:400;white-space:normal}
  .infodot:hover .infotip,.infodot:focus .infotip,.infodot:focus-within .infotip{display:block}
  .infotip .ig{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 1px}
  .infotip .ig:first-child{margin-top:0}
  .infotip .ir{color:var(--fg)}

  /* footer nav */
  .nav{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:auto;padding-top:32px}
  .nav .hint{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:auto}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;font-family:inherit;cursor:pointer;border-radius:9999px;padding:11px 20px;border:1px solid transparent;white-space:nowrap;transition:transform .08s,background .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:16px;height:16px}
  .btn-dark{background:var(--btn);color:var(--btn-fg)}
  .btn-dark:hover{opacity:.9}
  .btn-dark:disabled{background:var(--btn-disabled);color:#fff;cursor:not-allowed;opacity:1}
  .btn-ghost{background:var(--card);color:var(--fg);border-color:var(--border-strong)}
  .btn-ghost:hover{background:var(--panel)}

  /* step 2 channel cards */
  .channel{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px}
  .channel + .channel{margin-top:12px}
  .channel.slim{align-items:center}
  /* step 3 cards sit in a 2-column grid like the tools in step 1; one column on narrow screens */
  .cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cgrid .channel + .channel{margin-top:0}
  .cgrid .channel{gap:12px;padding-inline:14px}
  .cgrid .btn{padding:9px 14px}
  .cgrid .ch-title{white-space:nowrap}
  @media (max-width:780px){.cgrid{grid-template-columns:1fr}}
  .channel.on{border-color:var(--success-border);background:var(--success-bg)}
  .channel.pick{cursor:pointer}
  .channel.pick.sel{border-color:var(--sel);background:var(--sel-tint)}
  .ch-body{flex:1;min-width:0}
  .ch-title{font-weight:600;font-size:15.5px;color:var(--fg-strong)}
  .ch-desc{color:var(--muted);font-size:14px;margin-top:3px;max-width:56ch}
  .ch-right{flex:0 0 auto;display:flex;align-items:center}
  .connected{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .connected svg{width:14px;height:14px}

  /* step 3 invite */
  .chipbox{border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--card);padding:9px 10px;display:flex;flex-wrap:wrap;gap:7px;min-height:92px;align-content:flex-start;cursor:text}
  .chipbox:focus-within{border-color:var(--sel)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:7px;padding:4px 7px 4px 9px;font-size:13.5px;color:var(--fg)}
  .chip.bad{background:var(--danger-tint);color:var(--danger)}
  .chip button{background:none;border:0;cursor:pointer;color:inherit;opacity:.6;display:grid;place-items:center;padding:0}
  .chip button:hover{opacity:1}
  .chip button svg{width:13px;height:13px}
  .chipbox input{border:0;outline:0;background:none;font-family:inherit;font-size:14.5px;color:var(--fg);flex:1;min-width:140px;padding:5px 4px}
  .fieldlabel{font-weight:600;font-size:14.5px;color:var(--fg-strong);margin-bottom:8px}
  .fieldhint{color:var(--muted-2);font-size:13px;margin-top:8px}
  .connectchips{display:flex;flex-wrap:wrap;gap:8px}
  .cchip{background:var(--panel-2);border-radius:8px;padding:6px 11px;font-size:13.5px;color:var(--fg);display:inline-flex;align-items:center;gap:7px}
  .preview{border:1px dashed var(--border-strong);border-radius:12px;padding:15px 16px;margin-top:18px;background:var(--panel)}
  .preview .pv-label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .preview .pv-body{font-size:14.5px;color:var(--fg);line-height:1.55}

  /* permissions modal */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(18,20,24,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px 20px;overflow:auto}
  .modal{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:88vh}
  .modal-head{display:flex;gap:13px;align-items:flex-start;padding:20px 20px 16px}
  .modal-head .mh-body{flex:1;min-width:0}
  .modal-head h2{font-size:17px;font-weight:500;color:var(--fg-strong);margin:0 0 3px;letter-spacing:-.01em}
  .modal-head p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
  .modal-head .x{background:none;border:0;cursor:pointer;color:var(--muted-2);padding:4px;border-radius:7px;flex:0 0 auto}
  .modal-head .x:hover{color:var(--fg);background:var(--panel)}
  .modal-head .x svg{width:18px;height:18px}
  .modal-body{overflow:auto;padding:4px 20px 8px;flex:1}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
  @media (max-width:520px){.presets{grid-template-columns:1fr}}
  .preset{text-align:left;background:var(--card);border:1px solid var(--border-strong);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px;transition:border-color .12s,background .12s}
  .preset:hover{border-color:var(--muted-2)}
  .preset.sel{border-color:var(--sel);background:var(--sel-tint)}
  .preset.off{border-style:dashed;cursor:not-allowed;opacity:.55}
  .preset.off:hover{border-color:var(--border-strong)}
  .preset .pt{font-weight:600;font-size:14.5px;color:var(--fg-strong)}
  .preset .pd{font-size:11.5px;color:var(--muted);line-height:1.35}
  .customnote{font-size:12.5px;color:var(--muted);margin:-8px 0 14px}
  .permgroup{margin-bottom:18px}
  .permgroup .gl{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding-bottom:9px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .permrow{display:flex;align-items:center;gap:12px;padding:9px 0}
  .permrow .pl{flex:1;min-width:0;font-size:14.5px;color:var(--fg)}
  .seg{display:flex;gap:6px;flex:0 0 auto}
  .seg button{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;border-radius:8px;padding:6px 10px;border:1px solid var(--border-strong);background:var(--card);color:var(--muted);transition:all .12s;white-space:nowrap}
  @media (max-width:480px){.permrow{flex-wrap:wrap}.permrow .seg{width:100%;margin-top:6px}.permrow .seg button{flex:1;justify-content:center}}
  .seg .radio{width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
  .seg .radio::after{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
  .seg button.on{background:var(--allow-tint);border-color:var(--allow);color:var(--allow)}
  .seg button.on .radio::after{background:var(--allow)}
  .seg button:disabled{opacity:.4;cursor:not-allowed}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:15px 20px;border-top:1px solid var(--border);background:var(--panel)}
  .modal-foot .cnt{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

  /* done */
  .done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;gap:18px;padding:14vh 20px}
  .done .burst{width:64px;height:64px;border-radius:50%;background:var(--success-bg);border:1px solid var(--success-border);display:grid;place-items:center;color:var(--success)}
  .done .burst svg{width:30px;height:30px}
  .done h1{margin:0}
  .done p{color:var(--muted);font-size:15.5px;margin:0;max-width:44ch}

  .themebtn{position:fixed;right:16px;bottom:16px;z-index:60;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted-2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);opacity:.75}
  .themebtn:hover{color:var(--fg);opacity:1}
  .themebtn svg{width:16px;height:16px}

  .fade{animation:fade .34s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
</style>

const BY_ID = Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const GROUPS = [["reading","Reading"],["creating","Creating"],["sending","Sending and approving"]];

function rowsOf(tool){
  const out=[];
  GROUPS.forEach(([g])=> (tool.perms[g]||[]).forEach((item,i)=>{
    const label=typeof item==="string"?item:item.l;
    out.push({group:g, label, key:g+"|"+i+"|"+label, ext:(typeof item==="object"&&!!item.ext)});
  }));
  return out;
}
const PRESETS=[
  {id:"observer", title:"Observer", desc:"Mira reads and tells you what she notices."},
  {id:"assistant", title:"Assistant", desc:"Mira drafts. You approve before anything goes out."},
  {id:"operator", title:"Operator", desc:"Mira acts inside the company. External messages still need your OK."},
];
function presetValue(id,row){
  if(id==="observer") return row.group==="reading" ? "allowed" : "blocked";
  if(id==="assistant") return (row.group==="reading"||row.group==="creating") ? "allowed" : "ask";
  if(row.group==="reading"||row.group==="creating") return "allowed";
  return row.ext ? "ask" : "allowed"; // operator: internal sending allowed, external stays ask
}
function presetPerms(tool,id){ const o={}; rowsOf(tool).forEach(r=> o[r.key]=presetValue(id,r)); return o; }
function defaultPerms(tool){ return presetPerms(tool,"assistant"); }
function presetAvailable(tool,id){
  const order=["observer","assistant","operator"], idx=order.indexOf(id), rows=rowsOf(tool), mine=presetPerms(tool,id);
  for(let i=0;i<idx;i++){ const o=presetPerms(tool,order[i]); if(rows.every(r=>mine[r.key]===o[r.key])) return false; }
  return true;
}
function matchedPreset(tool,work){
  const rows=rowsOf(tool);
  for(const id of ["observer","assistant","operator"]){
    if(!presetAvailable(tool,id)) continue;
    if(rows.every(r=> work[r.key]===presetValue(id,r))) return id;
  }
  return null;
}

function Icon({icon}){
  if(icon.imgBleed) return h("div",{className:"ic"}, h("img",{src:icon.imgBleed,alt:"",draggable:false,style:{width:"100%",height:"100%",objectFit:"cover"}}));
  if(icon.img) return h("div",{className:"ic logo"}, h("img",{src:icon.img,alt:"",draggable:false,style:{width:"100%",height:"100%",objectFit:"contain",padding:"3px"}}));
  if(icon.bleed) return h("div",{className:"ic"}, icon.bleed);
  if(icon.logo) return h("div",{className:"ic logo"}, icon.logo);
  if(icon.glyph) return h("div",{className:"ic mono",style:{background:icon.bg}}, h("span",{className:"g",style:{display:"grid",placeItems:"center"}}, icon.glyph));
  return h("div",{className:"ic mono",style:{background:icon.bg}}, h("span",{style:{fontSize:icon.fs||14}}, icon.letter));
}

/* ======================= STEP 1 — TOOLS ======================= */
function StepTools({selected,setSelected,perms,setPerms,openCustomize,onContinue}){
  const [q,setQ] = useState("");
  const ql=q.trim().toLowerCase();
  const toggle=(id)=> setSelected(s=> s.includes(id)? s.filter(x=>x!==id) : [...s,id]);
  const labelFor=(id)=>{ const tool=BY_ID[id]; const p=matchedPreset(tool, perms[id]||defaultPerms(tool));
    return p==="observer" ? "Read only"
      : p==="operator" ? ("Acts inside "+(COMPANY||"your company"))
      : p==="assistant" ? "Customize" : "Custom"; };

  const selectedTools = selected.map(id=>BY_ID[id]).filter(Boolean);
  const suggested = (ql
    ? TOOLS.filter(t=> t.name.toLowerCase().includes(ql)||t.cat.toLowerCase().includes(ql))
    : TOOLS.filter(t=> t.pop)
  ).filter(t=> !selected.includes(t.id));

  const tile=(t)=>{ const sel=selected.includes(t.id);
    return h("button",{className:"tool"+(sel?" sel":""),key:t.id,"aria-pressed":sel,onClick:()=>toggle(t.id)},
      h(Icon,{icon:t.icon}),
      h("div",{className:"tmeta"},
        h("div",{className:"tname"},t.name),
        sel && h("span",{className:"customize",role:"button",tabIndex:0,
          onClick:(e)=>{e.stopPropagation();openCustomize(t.id);},
          onKeyDown:(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();openCustomize(t.id);}}},labelFor(t.id))),
      h("span",{className:"cb"}, I.check));
  };

  return h("div",{className:"fade"},
    h("div",{className:"stepeyebrow"},"Step 1 of 3"),
    h("h1",null,"What can Mira use at ",(COMPANY||"your company"),"?"),
    h("p",{className:"lede"},"Choose the tools people may connect, and the most Mira can do in each. Each person still decides how much Mira does on their own account, within these limits."),

    selectedTools.length>0 && h(React.Fragment,null,
      h("div",{className:"minilabel",style:{marginTop:"2px"}},"Selected"),
      h("div",{className:"grid",style:{marginBottom:"18px"}}, selectedTools.map(tile))),

    h("div",{className:"search"}, I.search,
      h("input",{placeholder:"Search 500+ tools, e.g. FreeAgent",value:q,onChange:e=>setQ(e.target.value)})),
    ql
      ? h(React.Fragment,null,
          h("div",{className:"minilabel"}, suggested.length+" result"+(suggested.length!==1?"s":"")),
          suggested.length===0
            ? h("div",{className:"reassure"}, "No tools match that search.")
            : h("div",{className:"grid"}, suggested.map(tile)))
      : (suggested.length>0 && h(React.Fragment,null,
          h("div",{className:"minilabel"}, "Suggested"),
          h("div",{className:"grid"}, suggested.map(tile)))),

    h("div",{className:"reassure"}, I.shield, "By default, Mira reads and drafts. Nothing leaves ",(COMPANY||"your company")," without your approval."),

    h("div",{className:"nav"},
      selected.length===0 && h("span",{className:"hint"},"Choose at least one tool to continue"),
      h("button",{className:"btn btn-dark",disabled:selected.length===0,onClick:onContinue},"Continue")));
}

/* ======================= PERMISSIONS MODAL ======================= */
function PermModal({toolId,perms,onSave,onClose}){
  const tool=BY_ID[toolId];
  const [work,setWork] = useState(()=> ({...defaultPerms(tool), ...(perms[toolId]||{})}));
  const rows=rowsOf(tool);
  const sel=matchedPreset(tool,work);
  const set=(key,val)=> setWork(w=>({...w,[key]:val}));

  return h("div",{className:"overlay",onClick:onClose},
    h("div",{className:"modal",onClick:e=>e.stopPropagation(),role:"dialog","aria-modal":"true"},
      h("div",{className:"modal-head"},
        h(Icon,{icon:tool.icon}),
        h("div",{className:"mh-body"},
          h("h2",null,"What Mira can do in ",tool.name),
          h("p",null,"Applies to everyone at ",(COMPANY||"your company"),".")),
        h("button",{className:"x","aria-label":"Close",onClick:onClose}, I.x)),
      h("div",{className:"modal-body"},
        h("div",{className:"presets",role:"radiogroup","aria-label":"Permission level"},
          PRESETS.map(p=>{ const avail=presetAvailable(tool,p.id); const on=sel===p.id;
            return h("button",{className:"preset"+(on?" sel":"")+(avail?"":" off"),key:p.id,
              role:"radio","aria-checked":on?"true":"false","aria-disabled":avail?undefined:"true",disabled:!avail,
              onClick:avail?()=>setWork(presetPerms(tool,p.id)):undefined},
              h("div",{className:"pt"},p.title),
              h("div",{className:"pd"}, avail ? p.desc : ("Not available in "+tool.name+". Assistant already covers everything Mira can do here.")));
          })),
        sel==null && h("div",{className:"customnote"},"Custom settings. Pick a level to reset."),
        GROUPS.map(([g,label])=>{
          const grows=rows.filter(r=>r.group===g); if(!grows.length) return null;
          return h("div",{className:"permgroup",key:g},
            h("div",{className:"gl"},label),
            grows.map(r=>{ const v=work[r.key]||"allowed";
              return h("div",{className:"permrow",key:r.key},
                h("span",{className:"pl"},r.label),
                h("div",{className:"seg"},
                  h("button",{className:(v==="blocked"?"on":""),onClick:()=>set(r.key,"blocked")},
                    h("span",{className:"radio"}),"Blocked"),
                  h("button",{className:(v==="ask"?"on":""),onClick:()=>set(r.key,"ask")},
                    h("span",{className:"radio"}),"Ask first"),
                  h("button",{className:(v==="allowed"?"on":""),disabled:r.ext,
                    title:r.ext?"Goes outside the company, so it always needs approval.":undefined,
                    "aria-disabled":r.ext?"true":undefined,
                    onClick:r.ext?undefined:()=>set(r.key,"allowed")},
                    h("span",{className:"radio"}),"Allowed")));
            }));
        })),
      h("div",{className:"modal-foot"},
        h("button",{className:"btn btn-ghost",onClick:onClose},"Cancel"),
        h("button",{className:"btn btn-dark",onClick:()=>onSave(toolId,work)},"Save"))));
}

/* ======================= STEP 2 — CHANNELS ======================= */
function StepChannels({channels,setChannels,onBack,onContinue}){
  return h("div",{className:"fade"},
    h("div",{className:"stepeyebrow"},"Step 2 of 3"),
    h("h1",null,"Where should your team talk to Mira?"),
    h("p",{className:"lede"},"In-app chat always works. You can add the channels your team uses every day."),

    h("div",{className:"channel"+(channels.slack?" on":"")},
      h(Icon,{icon:{logo:SLACK}}),
      h("div",{className:"ch-body"},
        h("div",{className:"ch-title"},"Slack — company channel"),
        h("div",{className:"ch-desc"},"Mira will message your team on Slack. You install it once for the whole company; nobody else has to connect anything.")),
      h("div",{className:"ch-right"},
        channels.slack
          ? h("span",{className:"connected"}, I.checkc, "Installed")
          : h("button",{className:"btn btn-ghost",onClick:()=>setChannels(c=>({...c,slack:true}))},"Install in Slack"))),

    h("div",{className:"channel pick"+(channels.personal?" sel":""),role:"checkbox","aria-checked":channels.personal,tabIndex:0,
      onClick:()=>setChannels(c=>({...c,personal:!c.personal})),
      onKeyDown:e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();setChannels(c=>({...c,personal:!c.personal}));}}},
      h("span",{className:"cb"+(channels.personal?" on":""),style:channels.personal?{background:"var(--sel-fill)",borderColor:"var(--sel-fill)"}:null}, channels.personal && I.check),
      h("div",{className:"ch-body"},
        h("div",{className:"ch-title"},"Let your team talk to Mira on WhatsApp and Telegram"),
        h("div",{className:"ch-desc"},"Each person connects their own WhatsApp or Telegram \u2014 you\u2019ll connect yours in the next step. Company information then reaches personal messengers."))),

    h("div",{className:"nav"},
      h("button",{className:"btn btn-ghost",style:{marginRight:"auto"},onClick:onBack}, I.back, "Back"),
      h("button",{className:"btn btn-ghost",onClick:onContinue},"In-app chat only"),
      h("button",{className:"btn btn-dark",onClick:onContinue},"Continue")));
}

const MAIL_IDS=["gmail","gcal","outlook"];
function permTip(tool){
  const groups=[["reading","Reads"],["creating","Creates"],["sending","Sends"]];
  return h("span",{className:"infotip"},
    groups.map(([g,lab])=>{
      const items=(tool.perms[g]||[]).map(it=> typeof it==="string"?it:(it.l+" (needs approval)"));
      if(!items.length) return null;
      return h(React.Fragment,{key:g},
        h("div",{className:"ig"},lab),
        h("div",{className:"ir"},items.join(", ")));
    }));
}
function permDot(tool){
  return h("span",{className:"infodot",tabIndex:0,role:"button","aria-label":"What Mira can access in "+tool.name},
    I.info, permTip(tool));
}
function StepAccount({selected,channels,acct,setAcct,onBack,onAddTools,onFinish,onSkip}){
  const chanOpts=[];
  if(channels.personal){
    chanOpts.push({id:"whatsapp",name:"WhatsApp",icon:{glyph:I.wa,bg:"#25D366"}});
    chanOpts.push({id:"telegram",name:"Telegram",icon:{glyph:I.tg,bg:"#229ED9"}});
  }

  const mailTools=selected.map(id=>BY_ID[id]).filter(t=>t&&MAIL_IDS.includes(t.id));
  const hasMail=acct.mail.length>0;
  // WhatsApp / Telegram need a real pairing, so the admin can connect either, both, or neither
  const pickChannel=(id)=> setAcct(a=>({...a,channels:a.channels.includes(id)?a.channels.filter(x=>x!==id):[...a.channels,id]}));
  const toggleMail=(id)=> setAcct(a=>({...a,mail:a.mail.includes(id)?a.mail.filter(x=>x!==id):[...a.mail,id]}));

  const chanRow=(c)=>{ const on=acct.channels.includes(c.id);
    return h("div",{className:"channel slim"+(on?" on":""),key:c.id},
      h(Icon,{icon:c.icon}),
      h("div",{className:"ch-body"},
        h("div",{className:"ch-title"},c.name)),
      h("div",{className:"ch-right"},
        on ? h("span",{className:"connected"}, I.checkc, "Connected")
           : h("button",{className:"btn btn-ghost",onClick:()=>pickChannel(c.id)}, "Connect")));
  };
  const mailRow=(t)=>{ const on=acct.mail.includes(t.id);
    return h("div",{className:"channel slim"+(on?" on":""),key:t.id},
      h(Icon,{icon:t.icon}),
      h("div",{className:"ch-body"},
        h("div",{className:"ch-title"},t.name,permDot(t))),
      h("div",{className:"ch-right"},
        on ? h("span",{className:"connected"}, I.checkc, "Connected")
           : h("button",{className:"btn btn-ghost",onClick:()=>toggleMail(t.id)}, "Connect")));
  };

  return h("div",{className:"fade"},
    h("div",{className:"stepeyebrow"},"Step 3 of 3"),
    h("h1",null,"Set up your Mira"),
    h("p",{className:"lede"},"Mira reads your recent email and meetings to learn ",(COMPANY||"your company")," and prepare your first briefing, then sends it on the channel you pick."),

    h("div",{className:"minilabel",style:{marginTop:"2px"}},"Where Mira reaches you"),
    h("div",{className:"cgrid"},
      // in-app chat is Mira herself, so it gets her orb; nothing to connect, so no button
      h("div",{className:"channel slim"},
        h(Icon,{icon:{logo:h("img",{src:MIRA_ORB,alt:"",draggable:false,style:{width:"22px",height:"22px",display:"block"}})}}),
        h("div",{className:"ch-body"}, h("div",{className:"ch-title"},"In-app chat")),
        h("div",{className:"ch-right"}, h("span",{className:"connected"}, I.checkc, "Always on"))),
      // Slack was installed once for the whole company in step 2; the bot DMs people by email, so nothing to connect here
      channels.slack && h("div",{className:"channel slim"},
        h(Icon,{icon:{logo:SLACK}}),
        h("div",{className:"ch-body"}, h("div",{className:"ch-title"},"Slack")),
        h("div",{className:"ch-right"}, h("span",{className:"connected"}, I.checkc, "Always on"))),
      chanOpts.map(chanRow)),

    h("div",{className:"minilabel",style:{marginTop:"18px"}},"What Mira learns from"),
    mailTools.length>0
      ? h("div",{className:"cgrid"}, mailTools.map(mailRow))
      : h("div",{className:"reassure"}, I.shield, "No email in your company tools yet. ",
          h("button",{className:"linkbtn",onClick:onAddTools},"Add Gmail or Outlook")),

    h("div",{className:"nav"},
      h("button",{className:"btn btn-ghost",style:{marginRight:"auto"},onClick:onBack}, I.back, "Back"),
      h("button",{className:"btn btn-ghost",onClick:onSkip},"Skip for now"),
      h("button",{className:"btn btn-dark",disabled:!hasMail,onClick:()=>onFinish({mail:true,channels:[...(channels.slack?["slack"]:[]),...acct.channels]})},
        "See my first briefing")));
}

/* ======================= DONE ======================= */
function Done({result,onRestart}){
  const CH={whatsapp:"WhatsApp",telegram:"Telegram",slack:"Slack"};
  const done = !!(result && result.mail);
  const names = result && result.channels ? result.channels.map(c=>CH[c]) : [];
  const chName = names.length ? (names.length>1 ? names.slice(0,-1).join(", ")+" and "+names[names.length-1] : names[0]) : null;
  const body = !done
    ? "Setup saved. Connect your email whenever you\u2019re ready and Mira will prepare your first briefing."
    : (chName
        ? ("Mira is reading your inbox to learn "+(COMPANY||"your company")+". Your first briefing lands on "+chName+" in a moment.")
        : ("Mira is reading your inbox to learn "+(COMPANY||"your company")+". Your first briefing is waiting in chat."));
  return h("div",{className:"done fade"},
    h("div",{className:"burst"}, I.checkc),
    h("h1",null, done ? "Mira is on it" : "You\u2019re all set"),
    h("p",null, body),
    // hands off to the app itself (prototype: mira-app.html next to this file)
    h("a",{className:"btn btn-dark",href:"mira-app.html",style:{textDecoration:"none"}},"Open Binome"));
}

/* ======================= SHELL ======================= */
const STEPS=["Tools","Channels","Your account"];
function Stepper({step}){
  return h("div",{className:"stepper"},
    STEPS.map((s,i)=> h(React.Fragment,{key:s},
      i>0 && h("span",{className:"ln"}),
      h("span",{className:"st "+(i<step?"is-done":i===step?"cur":"")},
        h("span",{className:"mk"}, i<step ? I.check : (i===step ? I.dot : I.dote)),
        s))));
}
function App(){
  const [step,setStep]=useState(0);
  const [selected,setSelected]=useState([]);
  const [perms,setPerms]=useState({});
  const [channels,setChannels]=useState({slack:false,personal:false});
  const [acct,setAcct]=useState({channels:[],mail:[]});
  const [modalTool,setModalTool]=useState(null);
  const [done,setDone]=useState(null);
  const [theme,setTheme]=useState(null);

  React.useEffect(()=>{ const r=document.documentElement; theme?r.setAttribute("data-theme",theme):r.removeAttribute("data-theme"); },[theme]);
  const go=(n)=>{ setStep(n); window.scrollTo({top:0,behavior:"smooth"}); };
  const restart=()=>{ setDone(null); setStep(0); setSelected([]); setPerms({}); setChannels({slack:false,personal:false}); setAcct({channels:[],mail:[]}); };

  const stepLabel = done!=null ? "Done" : "Step "+(step+1)+" of 3";

  return h(React.Fragment,null,
    h("div",{className:"topbar"},
      h("div",{className:"brand"}, "Binome"),
      done==null ? h(Stepper,{step}) : h("span",null),
      h("span",null)),

    h("main",null,
      done!=null
        ? h(Done,{result:done,onRestart:restart})
        : h("div",{className:"sheet"},
            step===0 && h(StepTools,{selected,setSelected,perms,setPerms,
              openCustomize:(id)=>setModalTool(id), onContinue:()=>go(1)}),
            step===1 && h(StepChannels,{channels,setChannels,onBack:()=>go(0),onContinue:()=>go(2)}),
            step===2 && h(StepAccount,{selected,channels,acct,setAcct,
              onBack:()=>go(1), onAddTools:()=>go(0),
              onFinish:(r)=>setDone(r), onSkip:()=>setDone({mail:false,channels:[]})}))),

    modalTool && h(PermModal,{toolId:modalTool,perms,
      onSave:(id,p)=>{ setPerms(prev=>({...prev,[id]:p})); setModalTool(null); },
      onClose:()=>setModalTool(null)}),

    h("button",{className:"themebtn","aria-label":"Toggle theme",title:"Toggle theme",
      onClick:()=>setTheme(t=> t==="dark"?"light": t==="light"?null : "dark")},
      theme==="dark"?I.sun:I.moon));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
