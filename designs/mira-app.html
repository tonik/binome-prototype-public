          <path d="M14.3735 11.6571C14.3735 14.4 12.2016 16 8.04187 16H0.000488281V-6.60658e-07H7.5797C11.462 -6.60658e-07 13.5415 1.62286 13.5415 4.16C13.5415 5.80549 12.7095 7.01714 11.462 7.68C13.1948 8.22857 14.3735 9.57714 14.3735 11.6571ZM3.00437 2.33143V6.74309H7.25604C9.33558 6.74309 10.5139 6.01166 10.5139 4.5488C10.5139 3.08594 9.33558 2.33211 7.25604 2.33211H3.00437V2.33143ZM11.3466 11.36C11.3466 9.76 10.1219 9.05143 7.85719 9.05143H3.00437V13.6686H7.85719C10.1219 13.6686 11.3466 12.96 11.3466 11.3598V11.36ZM24.0745 16H27.0784V-6.60658e-07H24.0745V16ZM51.1733 -6.60658e-07V16H48.7006L39.7811 5.16571V16H36.8003V-6.60658e-07H39.2727L48.1923 10.8343V-6.60658e-07H51.1733ZM60.9456 8C60.9456 3.4 64.5399 -6.60658e-07 69.4153 -6.60658e-07C74.2905 -6.60658e-07 77.8848 3.3776 77.8848 8C77.8848 12.6224 74.2905 16 69.4153 16C64.5399 16 60.9456 12.6 60.9456 8ZM74.9415 8C74.9415 4.82217 72.5827 2.53349 69.4149 2.53349C66.2469 2.53349 63.8885 4.82263 63.8885 8C63.8885 11.1774 66.2473 13.4665 69.4149 13.4665C72.5822 13.4665 74.9415 11.1774 74.9415 8ZM127.315 13.5086V16H115.183V-6.60658e-07H126.991V2.49143H118.187V6.65143H125.998V9.09714H118.187V13.5086H127.315Z"/>
          <path d="M105.49 16H102.486V5.10195H105.49V16Z"/>
          <path d="M98.0761 16H95.0722V0H98.0761V16Z"/>
          <path d="M90.6631 16H87.6592V3.37623H90.6631V16Z"/>
        </svg>
      </span>
      <!-- Team name + dropdown replaces the Binome logo (see refreshNavVariant / wireTeamSwitcher). -->
      <div class="teamsw" id="teamSw">
        <button type="button" class="teamsw__btn" id="teamSwBtn" aria-haspopup="menu" aria-expanded="false">
          <span class="teamsw__name" id="teamSwName">Sales</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="teamsw__menu" id="teamSwMenu" hidden role="menu" aria-label="Workspace"></div>
      </div>
      <div class="sidebar__top-actions">
        <button class="icon-btn icon-btn--bell" aria-label="Notifications" title="Notifications" data-notif-bell>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Collapse sidebar" title="Collapse sidebar" data-sidebar-toggle aria-expanded="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mira section: persistent so it can animate open/closed -->
    <div class="nav" id="navTop"></div>

    <nav class="nav nav--work" id="nav">
      <!-- links injected by renderNav() -->
    </nav>

    <div class="nav__spacer"></div>

    <div class="sidebar__footer">
      <nav class="nav" id="navFooter"><!-- Notifications injected here --></nav>

      <!-- Account switcher: the profile button opens a popover (above it) for
           switching workspace, plus Settings and Log out. Wired in
           wireAccountMenu(). The popover's workspace rows are filled from
           WORKSPACES so the checkmark + profile label stay in sync. -->
      <div class="account" id="account">
        <div class="account-menu" id="accountMenu" hidden role="menu" aria-label="Account">
          <div class="account-menu__id">
            <span class="account-menu__name">Agata</span>
            <span class="account-menu__email">at@tonik.com</span>
          </div>
          <div class="account-menu__sep"></div>
          <div class="account-menu__label">Workspace</div>
          <div class="account-menu__ws" id="accountWs"><!-- workspace rows injected --></div>
          <div class="account-menu__sep"></div>
          <button type="button" class="account-menu__item" data-act="settings" role="menuitem"></button>
          <button type="button" class="account-menu__item" data-act="logout" role="menuitem"></button>
        </div>

        <button class="profile" type="button" id="profileBtn" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar">A</span>
          <span class="profile__meta">
            <span class="profile__name">Agata</span>
            <span class="profile__sub" id="profileSub">Sales Team</span>
          </span>
          <span class="profile__switch" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 9l4-4 4 4"/><path d="M16 15l-4 4-4-4"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============ SECONDARY MENU (per-section, e.g. Chat) ============ -->
  <aside class="submenu-panel" id="submenu" hidden></aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main">
    <!-- right pane: intentionally empty — content goes here -->
    <section class="content" id="content" aria-label="Content"></section>
  </main>

  <!-- Routine chat side panel: a full-height segment on the right edge (like the
       side nav, wider). Shown/filled by updateRtPanel() on a card click. -->
  <aside class="rt-panel" id="rtPanel" hidden aria-label="Routine chat"></aside>

</div>

/* ---- Reusable link component ---- */
function makeLink({ id, label, icon, active=false, badge=null, avatar=false, mock=false, chevron=null }){
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'navlink' + (active ? ' is-active' : '') + (avatar ? ' navlink--avatar' : '');
  el.dataset.id = id;
  const iconHTML = avatar
    ? '<img class="navlink__avatar" src="'+MIRA_AVATAR+'" alt="">'
    : svg(icon);
  el.innerHTML =
    '<span class="navlink__icon">'+iconHTML+'</span>'+

/* Date range options. "Custom range…" (below a divider) opens a two-date calendar. */
const INS_CUSTOM = 'Custom range…';
const insShort = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
/* "26 Oct – 1 Nov", or "1–31 Oct" when both ends are in the same month */
function insFmtRange(a, b){
  return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()
    ? a.getDate()+'–'+insShort(b)
    : insShort(a)+' – '+insShort(b);
}
function insPeriodOptions(){
  return [ { label:'Today' }, { label:'This week' }, { label:'Last week' }, { label:'This month' }, { label:'This quarter' }, { label:'This year' }, { label:INS_CUSTOM } ];
}

/* the dd menu rows: label + muted date hint (data-val stays the plain label, which becomes the pill text) */
function insPeriodItemsHTML(){
  return insPeriodOptions().map(o => {
    const on = o.label === insPeriod;
    return (o.label === INS_CUSTOM ? '<div class="wl-ddmenu__sep" role="separator"></div>' : '')+
      '<button type="button" class="wl-ddmenu__item'+(on ? ' is-active' : '')+'" role="menuitemradio" aria-checked="'+on+'" data-val="'+o.label+'">'+
      '<span class="wl-ddmenu__check">'+svg('check',2.25)+'</span>'+o.label+
    '</button>';
  }).join('');

/* ---- Custom range calendar: one month grid, click a start date then an end date ---- */
const insCal = { month:null, from:null, to:null };
function insCalHTML(){
  const m = insCal.month, y = m.getFullYear(), mo = m.getMonth();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7;            // blanks before the 1st (Monday first)
  const days = new Date(y, mo + 1, 0).getDate();
  const same = (a, b) => a && b && a.getTime() === b.getTime();
  let cells = '';
  for(let i = 0; i < lead; i++) cells += '<span class="ins-cal__blank"></span>';
  for(let d = 1; d <= days; d++){
    const dt = new Date(y, mo, d);
    const edge = same(dt, insCal.from) || same(dt, insCal.to);
    const inside = insCal.from && insCal.to && dt > insCal.from && dt < insCal.to;
    cells += '<button type="button" class="ins-cal__day'+(edge ? ' is-edge' : inside ? ' is-in' : '')+'" data-cal-day="'+dt.getTime()+'">'+d+'</button>';
  }
  // Make it obvious this picks a RANGE: a title, plus Start / End boxes (the one being picked is outlined).
  const step = !insCal.from ? 'from' : insCal.to ? '' : 'to';
  const box = (k, name, d) => '<div class="ins-cal__field'+(step === k ? ' is-next' : '')+'"><span>'+name+'</span><b>'+(d ? insShort(d) : '—')+'</b></div>';
  return (
    '<div class="ins-cal__title">Select a date range</div>'+
    '<div class="ins-cal__fields">'+box('from','Start date',insCal.from)+'<span class="ins-cal__dash">–</span>'+box('to','End date',insCal.to)+'</div>'+
    '<div class="ins-cal__head">'+
      '<button type="button" class="ins-cal__nav" data-cal-nav="-1" aria-label="Previous month">'+svg('chevdown',2)+'</button>'+
      '<span class="ins-cal__month">'+m.toLocaleDateString('en-GB', { month:'long', year:'numeric' })+'</span>'+
      '<button type="button" class="ins-cal__nav ins-cal__nav--next" data-cal-nav="1" aria-label="Next month">'+svg('chevdown',2)+'</button>'+
    '</div>'+
    '<div class="ins-cal__grid">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map(w => '<span class="ins-cal__wd">'+w+'</span>').join('')+cells+'</div>'+
    '<div class="ins-cal__foot"><span class="ins-cal__range">'+(insCal.to ? '' : 'Pick '+(insCal.from ? 'an end' : 'a start')+' date')+'</span>'+
      '<button type="button" class="home-btn" data-cal-cancel>Cancel</button>'+
      '<button type="button" class="home-btn home-btn--primary" data-cal-apply'+(insCal.to ? '' : ' disabled')+'>Apply</button></div>'
  );
}
/* Opens the calendar popover under the date pill. Apply stores the range as the pill text; Cancel / click
   outside restores the previous choice. */
function insOpenCalendar(c){
  const dd = c.querySelector('.wl-dd[data-dd="dperiod"]');
  c.querySelectorAll('.ins-cal').forEach(x => x.remove());
  const pop = document.createElement('div'); pop.className = 'ins-cal';
  insCal.month = new Date(); insCal.month.setDate(1); insCal.from = null; insCal.to = null;
  dd.appendChild(pop);
  const paint = () => { pop.innerHTML = insCalHTML(); };
  const close = (keep) => { document.removeEventListener('mousedown', onOutside); if(!keep){ render(); } };
  const onOutside = e => { if(!pop.contains(e.target)) close(false); };
  pop.addEventListener('click', e => {
    const day = e.target.closest('[data-cal-day]'), nav = e.target.closest('[data-cal-nav]');
    if(nav){ insCal.month = new Date(insCal.month.getFullYear(), insCal.month.getMonth() + +nav.dataset.calNav, 1); paint(); return; }
    if(day){
      const dt = new Date(+day.dataset.calDay);
      // first click (or a click after a finished range) starts a range; the second click ends it (order-free)
      if(!insCal.from || insCal.to){ insCal.from = dt; insCal.to = null; }
      else if(dt < insCal.from){ insCal.to = insCal.from; insCal.from = dt; }
      else insCal.to = dt;
      paint(); return;
    }
    if(e.target.closest('[data-cal-cancel]')) close(false);
    if(e.target.closest('[data-cal-apply]') && insCal.to){ insPeriod = insFmtRange(insCal.from, insCal.to); close(true); render(); }
  });
  paint();
  setTimeout(() => document.addEventListener('mousedown', onOutside), 0);
}

  if(activeMode && HIDE_MODE_CONTENT){ c.className = 'content'; c.innerHTML = ''; return; }

  } else if(activeId === 'mira'){
    if(activeChat && activeChat.startsWith('rt:') && RT_ROWS.indexOf((CHATS.find(x => x.id === activeChat) || {}).row) >= 0){

      c.className = 'content content--nr';
      c.innerHTML = rtChatHTML(RT_ROWS.indexOf(CHATS.find(x => x.id === activeChat).row));
      wireRtChat(c);
    } else if(CHATS.some(x => x.id === activeChat && x.conv)){
      // A conversation started from the Ask Mira hero (see cvStart): messages with insight cards in them, no side panel.
      c.className = 'content content--nr';
      const conv = CHATS.find(x => x.id === activeChat).conv;
      c.innerHTML = cvHTML(conv);
      wireCv(c, conv);
    } else {
      c.className = 'content content--chat';
      c.innerHTML =
        '<div class="chat-hero chat-hero--ask">'+
          '<h1 class="chat-hero__title">What can I handle for you?</h1>'+
          '<form class="composer composer--hero" onsubmit="return false">'+
            '<button type="button" class="composer__btn" aria-label="Add">'+svg('plus',1.6)+'</button>'+
            '<input class="composer__input" type="text" placeholder="Ask Mira">'+
            '<button type="button" class="composer__btn" aria-label="Voice">'+svg('mic',1.6)+'</button>'+
            '<button type="button" class="composer__send" aria-label="Send">'+svg('arrowup',2)+'</button>'+
          '</form>'+
          '<div class="chat-sugg">'+
            ['Plan my week','What\u2019s slipping?','Create a routine','Prep for tomorrow\u2019s call','Chart my daily sales','How did sales go this month?','How many invoices did we issue on 3 March?']
              .map(t => '<button type="button" class="chat-sugg__pill">'+t+'</button>').join('')+
          '</div>'+
        '</div>';
      // Clicking a suggestion fills the input and focuses it (nothing is sent yet).
      const sugInput = c.querySelector('.composer__input');
      // Sending turns the hero into a conversation (see cvStart).
      const heroSend = () => { const t = sugInput.value.trim(); if(t) cvStart(t); };
      c.querySelector('.composer--hero').addEventListener('submit', heroSend);
      c.querySelector('.composer--hero .composer__send').addEventListener('click', heroSend);
      c.querySelectorAll('.chat-sugg__pill').forEach(b => b.addEventListener('click', () => {
        sugInput.value = b.textContent; sugInput.focus();
      }));
    }
  } else if(activeId === 'tasks'){
    c.className = 'content';
    c.innerHTML = renderTasks();
    wireTasks();
  } else if(activeId === 'routines' && rtLibOpen){
    // Routine library: a full-width view inside Routines (opened by "Browse library").
    c.className = 'content';
    c.innerHTML = renderRoutineLibrary();
    rtViewEnter = false;
    wireRoutineLibrary(c);
  } else if(activeId === 'routines'){
    c.className = 'content';
    c.innerHTML = renderRoutines();
    rtViewEnter = false;
    // Collapsible search + "Show:" scope dropdown (shared with Tasks). The
    // dropdown's onPick maps the chosen label to rtShow and re-renders so the
    // filtered row list and the dropdown's own state both update.
    wireCollapsibleSearch(c);
    // "Show:" is multi-select: "All" clears the selection, any other option toggles.
    const keepOpen = rtKeepOpen; rtKeepOpen = null;
    wireMultiDropdown(c, 'show', val => {
      if(val === '__clear__') rtShow.clear();
      else {
        const id = rtShowOptions().find(o => o.label === val).id;
        rtShow.has(id) ? rtShow.delete(id) : rtShow.add(id);
      }
      rtKeepOpen = 'show';
      render();
    }, keepOpen === 'show');
    // "Tool:" is multi-select too: a routine matches when it touches ANY of the picked tools.
    wireMultiDropdown(c, 'tool', val => {
      if(val === '__clear__') rtTool.clear();
      else {
        const id = rtToolIds().find(id => RT_TOOLS[id].name === val);
        rtTool.has(id) ? rtTool.delete(id) : rtTool.add(id);
      }
      rtKeepOpen = 'tool';
      render();
    }, keepOpen === 'tool');
    // "Status:" works the same way over Active / Paused / Failing.
    wireMultiDropdown(c, 'status', val => {
      if(val === '__clear__') rtStatus.clear();
      else {
        const id = RT_STATUSES.find(o => o.label === val).id;
        rtStatus.has(id) ? rtStatus.delete(id) : rtStatus.add(id);
      }
      rtKeepOpen = 'status';
      render();
    }, keepOpen === 'status');
    const nr = c.querySelector('[data-newroutine]');
    if(nr) nr.addEventListener('click', () => openNewRoutine());
    const browse = c.querySelector('[data-rt-browse]');
    if(browse) browse.addEventListener('click', rtlOpen);
    // Card interactions (open panel, status toggle, Play). A function over `root` so the
    // search box can re-wire just the results after swapping them while typing.
    const wireRtCards = root => {
    // Whole card opens that routine's chat side panel. Controls inside the card
    // (toggle, Play) stopPropagation so they don't also trigger this. (The panel's
    // close button is wired in updateRtPanel, since the panel lives in the shell.)
    root.querySelectorAll('[data-rt-card]').forEach(card => {
      card.addEventListener('click', () => {
        rtOpenRoutine = Number(card.dataset.rtCard);
        rtFindQuery = null;
        rtNewOpen = false;   // a draft in progress is dropped when another card is opened
        rtBundle = null;
        render();
        rtRevealCard(rtOpenRoutine);
      });
    });
    // Status toggles: flip the addressed routine between live/paused in place,
    // then re-render so the label, colour and knob position all update.
    root.querySelectorAll('[data-rt-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();   // don't open the card panel
        const row = RT_ROWS[Number(btn.dataset.rtToggle)];
        // Pausing a shared or team routine affects other people too, so ask first. Turning one
        // back on, and pausing a personal routine, go straight through.
        const ctx = rtShareCtx(row);
        if(row.workflow.status === 'live' && ctx.kind !== 'personal'){
          const team = ctx.kind === 'team';
          rtConfirm({
            title: team ? 'Pause for the '+ctx.team+'?' : 'Pause for you and '+ctx.who+'?',
            text: team ? 'It won’t run for anyone on the team until it’s turned back on.'
                       : 'It won’t run for either of you until someone turns it back on.',
            confirm: team ? 'Pause for team' : 'Pause'
          }, () => rtApplyToggle(btn, row));
          return;
        }
        rtApplyToggle(btn, row);
      });
    });
    function rtApplyToggle(btn, row){
        row.workflow.status = row.workflow.status === 'live' ? 'paused' : 'live';
        // Update the clicked card IN PLACE first so the track colour, knob and label can transition
        // (a render() right away would rebuild the button and skip the animation); then re-render once
        // it has played, so filters (e.g. Status: Active) and everything else catch up.
        const on = row.workflow.status === 'live';
        const status = rtStatusOf(row);
        const wrap = btn.closest('.rt-card__status');
        wrap.classList.toggle('rt-card__status--on', on);
        wrap.classList.toggle('rt-card__status--fail', status === 'failing');
        wrap.querySelector('.rt-card__status-label').textContent = status === 'failing' ? 'Failing' : on ? 'Active' : 'Paused';
        btn.setAttribute('aria-pressed', on);
        clearTimeout(rtToggleTimer);
        rtToggleTimer = setTimeout(render, 360);
    }
    // "…" menus: the button opens/closes its own menu (closing any other open one);
    // an outside press or Escape closes it. Edit with Mira opens the routine's chat panel; Make a copy starts a draft
    // copy (see openCopyRoutine); Delete removes the routine. Both stopPropagation so the card's
    // own click (open side panel) doesn't fire, then re-render to refresh indexes.
    const closeRtMenus = () => document.querySelectorAll('.rt-more.is-open').forEach(m => {
      m.classList.remove('is-open');
      m.querySelector('.wl-ddmenu').hidden = true;
      m.querySelector('.rt-more__btn').setAttribute('aria-expanded','false');
    });
    root.querySelectorAll('.rt-more').forEach(more => {
      const btn = more.querySelector('.rt-more__btn');
      const menu = more.querySelector('.wl-ddmenu');
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const willOpen = menu.hidden;
        closeRtMenus();
        if(!willOpen) return;
        menu.hidden = false;
        more.classList.add('is-open');
        btn.setAttribute('aria-expanded','true');
        const onDown = ev => { if(!ev.target.closest('.rt-more')) { closeRtMenus(); cleanup(); } };
        const onKey = ev => { if(ev.key === 'Escape') { closeRtMenus(); cleanup(); } };
        const cleanup = () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
      });
      menu.querySelectorAll('[data-rt-act]').forEach(item => item.addEventListener('click', e => {
        e.stopPropagation();
        const i = Number(item.dataset.rtMore);
        if(item.dataset.rtAct === 'edit'){
          rtOpenRoutine = i;
          rtFindQuery = null;
          rtNewOpen = false;
          rtBundle = null;
        } else if(item.dataset.rtAct === 'duplicate'){
          // "Make a copy": opens a draft prefilled from this routine + Mira's "what would you like to change?"
          openCopyRoutine(i);
          return;
        } else if(item.dataset.rtAct === 'share'){
          closeRtMenus();
          openRoutineShare(i);
          return;
        } else if(item.dataset.rtAct === 'delete'){
          // Deleting always asks first; the wording says who else loses the routine.
          closeRtMenus();
          const r = RT_ROWS[i], ctx = rtShareCtx(r), name = r.workflow.title;
          const cfg = ctx.kind === 'team'
            ? { text:'It’ll be removed for the whole '+ctx.team+'. This can’t be undone.', confirm:'Delete for team' }
            : ctx.kind === 'individual'
              ? { text:'It’ll be removed for you and '+ctx.who+'. This can’t be undone.', confirm:'Delete for everyone' }
              : { text:'This can’t be undone.', confirm:'Delete' };
          rtConfirm({ title:'Delete '+name+'?', text:cfg.text, confirm:cfg.confirm, danger:true }, () => {
            const k = RT_ROWS.indexOf(r);
            if(k < 0) return;
            RT_ROWS.splice(k, 1);
            if(rtOpenRoutine === k) rtOpenRoutine = null;
            else if(rtOpenRoutine !== null && rtOpenRoutine > k) rtOpenRoutine--;
            render();
          });
          return;
        } else {
          // "Remove from my routines" (a routine shared with me): takes it off my list only.
          RT_ROWS.splice(i, 1);
          if(rtOpenRoutine === i) rtOpenRoutine = null;
          else if(rtOpenRoutine !== null && rtOpenRoutine > i) rtOpenRoutine--;
        }
        render();
        if(item.dataset.rtAct === 'edit') rtRevealCard(i);
      }));
    });
    // Play buttons run a short fake lifecycle: Play → Running… → Done → Play.
    // State is driven by mutating the button in place (NOT render(), which would
    // rebuild the cards and wipe a run in progress). dataset.running guards
    // against re-clicks mid-run.
    root.querySelectorAll('.rt-play').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();   // don't open the card panel
        if(btn.dataset.running) return;
        btn.dataset.running = '1';
        btn.classList.add('rt-play--running');
        btn.innerHTML = svg('refresh',1.8)+'Running…';
        setTimeout(() => {
          btn.classList.replace('rt-play--running','rt-play--done');
          btn.innerHTML = svg('check',2.2)+'Done';
          setTimeout(() => {
            btn.classList.remove('rt-play--done');
            btn.innerHTML = svg('play',1.8)+'Play';
            delete btn.dataset.running;
          }, 1800);
        }, 1400);
      });
    });
    };
    const results = c.querySelector('[data-rt-results]');
    wireRtCards(results);
    // Search: filters by name + description as you type, swapping only the results (the
    // input keeps focus). rtQuery survives full re-renders, so the box is reopened with its
    // text after a toggle/filter change. The × in the box clears it.
    const sBox = c.querySelector('[data-search]');
    const sInput = sBox && sBox.querySelector('.wl-search__input');
    const refreshResults = () => { results.innerHTML = rtPairsHTML(); wireRtCards(results); wireEmpty(); };
    const wireEmpty = () => {
      const ask = results.querySelector('[data-rt-ask-mira]');
      // Opens the side panel (same one used to edit a routine) with the query pre-typed, so
      // Mira can look for a routine by what it does rather than by the words in its name.
      if(ask) ask.addEventListener('click', () => { rtFindQuery = rtQuery.trim(); rtOpenRoutine = null; rtNewOpen = false; rtBundle = null; render(); });
      const nw = results.querySelector('[data-rt-empty-new]');
      if(nw) nw.addEventListener('click', () => openNewRoutine(rtQuery.trim()));
    };
    if(sInput){
      if(rtQuery){
        sInput.value = rtQuery;
        sBox.classList.add('is-open');
        sBox.querySelector('.wl-search__btn').setAttribute('aria-expanded','true');
        sInput.removeAttribute('tabindex');
        sBox.classList.add('has-value');
      }
      sInput.addEventListener('input', () => { rtQuery = sInput.value; refreshResults(); });
      wireEmpty();
    }
  } else if(activeId === 'insights' && insPin){
    // Pin from chat: live preview here, Mira's chat in the right panel (see updateRtPanel / insPinPanelHTML).
    c.className = 'content content--in';
    c.innerHTML = insPinPreviewHTML();
    wireInsPinPreview(c);
  } else if(activeId === 'insights' && insNav){
    // Dashboard opened from the nav. Placeholder until dashboards get their own view.
    c.className = 'content content--in';
    const draft = insDraft && insNav === insDraft.dash.id ? insDraft : null;   // the dashboard being built with Mira (see insOpenDraft)
    const d = draft ? { id:draft.dash.id, label:draft.name } : INS_NAV_DASHBOARDS.find(x => x.id === insNav);
    c.innerHTML = renderInsightsDashboard(d, draft && draft.dash);
    const dash = draft ? draft.dash : IN_DASHBOARDS.find(x => x.id === insNav);
    wireDropdownPills(c, (key, val) => {
      // Single-choice filter chips ("flt:…") and card view switches ("sw:…") re-render the dashboard with the new values.
      if(insPickPill(dash, key, val)){ render(); return; }
      if(key !== 'dperiod') return;
      if(val === INS_CUSTOM) insOpenCalendar(c);   // the range is only applied once both dates are picked
      else insPeriod = val;
    });
    if(dash && !draft) wireInsFilters(c, dash);
    if(dash && !draft) insLastDash[dash.ws] = dash.id;   // the default place for "Pin to …" in chat
    if(dash) wireDashboard(c, dash);
  } else if(activeId === 'insights'){
    c.className = 'content content--in';
    if(inOpenId && IN_DETAILS[inOpenId]){ c.innerHTML = renderInsightDetail(); wireInsightDetail(c); }
    else if(!INS_NAV_DASHBOARDS.some(d => d.ws === activeWorkspace)){ inOpenId = null; c.innerHTML = insEmptyHTML(); wireInsEmpty(c); }   // no dashboards in this workspace
    else { inOpenId = null; c.innerHTML = renderInsights(); wireInsights(c); }
  } else if(activeId === 'adv-people'){
    c.className = 'content';
    c.innerHTML = renderAdmPeople();
    wireAdmPeople(c);
  } else if(activeId === 'adv-tools'){
    c.className = 'content';
    c.innerHTML = renderAdmTools();
    wireAdmTools(c);
  } else if(activeId === 'adv-monitoring'){
    c.className = 'content';
    c.innerHTML = renderAdmMonitoring();
    wireAdmMonitoring(c);
  } else if(activeId === 'adv-mira'){
    // No wireframe yet for these two tabs: simple empty state (same .rt-empty as elsewhere).
    c.className = 'content';
    c.innerHTML = renderAdmSoon('Mira');
  } else if(activeId === 'set-mira'){
    c.className = 'content';
    c.innerHTML = renderMiraSettings();
    wireMiraTabs(c);
  } else {
    c.className = 'content';
    c.innerHTML = '';
  }
}

/* Keeps the two body-level pieces in sync with the app state. Called from renderContent():
   - inside the Admin Panel mode: the floating switch exists (and the sitemap while admArch is on);
   - anywhere else: both are removed and admArch resets, so leaving the Admin Panel never strands the overlay. */
function admSyncFloat(){
  const inAdmin = activeMode === 'advanced';
  if(!inAdmin) admArch = false;
  document.querySelectorAll('.adm-float,.adm-arch').forEach(n => n.remove());
  if(!inAdmin) return;
  if(admArch){
    const ov = document.createElement('div');
    ov.className = 'adm-arch'; ov.innerHTML = renderAdmArch();
    document.body.appendChild(ov);
  }
  const sw = document.createElement('div');
  sw.className = 'adm-float';
  sw.innerHTML = '<div class="wl-view">'+
    '<button type="button" class="wl-view__item'+(admArch?'':' is-active')+'" data-adm-arch="0">Panel</button>'+
    '<button type="button" class="wl-view__item'+(admArch?' is-active':'')+'" data-adm-arch="1">Architecture</button></div>';
  sw.querySelectorAll('[data-adm-arch]').forEach(b => b.addEventListener('click', () => {
    const on = b.dataset.admArch === '1';
    if(on !== admArch){ admArch = on; admSyncFloat(); }
  }));
  document.body.appendChild(sw);
}

/* ---- Routines filter ----
   The category chips were replaced (2026-10-16) by a single "Show:" dropdown in
   the toolbar (so the Tasks and Routines toolbars match). It is now multi-select —
   see rtShow below. */
const RT_CATS = [
  { id:'personal',   label:'Private'    },
  { id:'sales',      label:'Sales'      },
  { id:'leadership', label:'Leadership' },
];
let rtShow = new Set();
/* "Show:" is now a MULTI-select: rtShow holds the chosen option ids (RT_CATS ids plus
   'system'); an empty set means no filter, i.e. show everything. A row's option is its
   category, except platform routines (system:true) which belong only to 'system'. */
const rtShowKey = r => r.system ? 'system' : r.sharedWithMe ? 'shared' : r.cat;
/* A routine another person shared with the user carries `sharedWithMe:true` and is listed only
   under "Shared with me" (no such rows in the mock data yet, so that option shows the empty state). */
/* Options offered in the current workspace: categories that actually have a visible
   routine (so we never offer a filter that returns nothing), plus "System", which
   exists only in Personal — platform routines aren't shown in team workspaces. */
function rtShowOptions(){
  const keys = new Set(RT_ROWS.filter(rtInWorkspace).map(rtShowKey));
  const opts = RT_CATS.filter(c => keys.has(c.id));
  // Personal: "Shared with me" sits right below "Private" (the user's own routines).
  if(activeWorkspace === 'personal'){
    const at = opts.findIndex(o => o.id === 'personal');
    opts.splice(at + 1, 0, { id:'shared', label:'Shared with me' });
  }
  // Personal also lists the Ops team (a workspace in the switcher) even though no routine
  // belongs to it yet — selecting it just shows the empty state — and "System".
  if(activeWorkspace === 'personal') opts.push({ id:'ops', label:'Ops' }, { id:'system', label:'System' });
  return opts;
}
/* Pending re-render after a routine toggle has finished animating (see the data-rt-toggle handler). */
let rtToggleTimer = null;
/* Set just before render() when a Show:/Status:/Tool: toggle should leave its menu open afterwards
   (render rebuilds the toolbar, which would otherwise close it after every click). */
let rtKeepOpen = null;   // 'show' | 'status' | 'tool' | null — which multi menu to reopen after render
/* Status filter (multi-select, empty = all). A routine's status is derived:
   not live → 'paused'; live and its last run failed (row.failing) → 'failing';
   otherwise 'active'. "Failing" is a health state of an active routine, so it only
   applies while the routine is switched on. */
const RT_STATUSES = [
  { id:'active',  label:'Active'  },
  { id:'paused',  label:'Paused'  },
  { id:'failing', label:'Failing' },
];
let rtStatus = new Set();
const rtStatusOf = r => r.workflow.status !== 'live' ? 'paused' : r.failing ? 'failing' : 'active';
/* Tool filter (second toolbar dropdown): 'all' or a RT_TOOLS id. A routine matches
   when the tool is its destination (`dest`) OR one of the tools it `uses` — i.e.
   "everything that touches Gmail", whichever side of the card it appears on. */
let rtTool = new Set();
/* Index into RT_ROWS of the routine whose chat side panel is open, or null when
   closed. Drives both the panel render and the single-column grid layout. */
let rtOpenRoutine = null;
/* When not null, the side panel is in "find a routine" mode instead of editing one:
   it holds the search text that had no matches (opened by "Ask Mira" in the search
   empty state). Mutually exclusive with rtOpenRoutine — only one panel at a time. */
let rtFindQuery = null;
/* Logo helpers for the card. rtLogo renders one tool mark (with a tooltip name);
   rtUsesHTML renders the "Uses" strip: ALWAYS every tool the routine touches (no "+N" overflow chip).
   A routine with many tools wraps onto a second line (.rt-logos is flex-wrap) instead of blowing out the card. */
const rtLogo = id => RT_TOOLS[id]
  ? '<span class="rt-logo" title="'+RT_TOOLS[id].name+'">'+RT_TOOLS[id].logo+'</span>' : '';
function rtUsesHTML(ids, r){
  // System (platform) routines don't touch third-party tools: show a plain description
  // of what they read (the "System" badge itself is rendered next to the card title).
  // A routine from the library whose apps have no logo here (HubSpot, ERP…) also shows its plain text.
  if(r && (r.system || (r.usesText && !(ids && ids.length)))){
    return '<span class="rt-card__value">'+rtEsc(r.usesText || '')+'</span>';
  }
  if(!ids || !ids.length) return '<span class="rt-card__value">Nothing else</span>';
  // A failing routine with a known cause: the tool that isn't connected gets a red dot
  // on its logo (same red as the "Failing" label), so the cause is visible at a glance.
  const bad = r && r.failing && r.failReason ? r.failReason.tool : null;
  return '<span class="rt-logos">'+ids.map(id => id === bad ? rtLogo(id).replace('<span class="rt-logo"','<span class="rt-logo rt-logo--alert"') : rtLogo(id)).join('')+'</span>';
}
/* Routine cards grid. (Previously this rendered trigger→workflow pairs plus a
   helper-text aside; both were replaced by the card layout from the "routine
   cards" wireframe.) Rows are filtered by rtShow: empty shows everything, else
   only rows whose option (category, or 'system') is selected.
   Field mapping per card:
     • title            ← workflow.title
     • status + toggle  ← workflow.status ('live' → Active/on, else Paused/off)
     • "When"           ← trigger.sub (icon: trigger.icon, or clock as fallback)
     • "Where it goes"  ← where  */
/* Rows visible in the current workspace: routines flagged scope:'personal' belong to
   the user alone, so they only show in Personal — the same rule Home uses for private
   cards (homeNeedsFor). Team workspaces show just the team's routines. */
/* Search: rtQuery is the text in the toolbar search box. A routine matches when the
   query appears (case-insensitive) in its name OR its description; the matched fragment
   is wrapped in <mark class="rt-hit"> on the card. Combines with the Show/Tool filters. */
let rtQuery = '';
const rtEsc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function rtHighlight(text, q){
  q = q.trim().toLowerCase();
  if(!q) return rtEsc(text);
  const low = text.toLowerCase();
  let out = '', pos = 0, at;
  while((at = low.indexOf(q, pos)) !== -1){
    out += rtEsc(text.slice(pos, at)) + '<mark class="rt-hit">' + rtEsc(text.slice(at, at + q.length)) + '</mark>';
    pos = at + q.length;
  }
  return out + rtEsc(text.slice(pos));
}
const rtInWorkspace = r => activeWorkspace === 'personal' || r.scope !== 'personal';
/* The list = optional draft card on top (while New routine is open) + the real cards. */
function rtPairsHTML(){
  const inner = rtPairsInnerHTML();
  if(rtBundle) return rtlBundleDraftsHTML(inner);   // a library bundle being added: its drafts sit above the routines
  if(!rtNewOpen || !nrState) return inner;
  const d = rtDraftCardHTML();
  return inner.startsWith('<div class="rt-grid">') ? inner.replace('<div class="rt-grid">', '<div class="rt-grid">'+d)
                                                    : '<div class="rt-grid">'+d+'</div>'+inner;
}
/* The draft card: same card as a routine, but dashed, labelled "Draft" instead of a status, and
   with muted "Not set yet" placeholders that fill in live as the user answers Mira in the panel.
   Each fillable spot is a "slot" (data-draft) so rtPatchDraft() can update just that spot, with a
   soft cross-fade, instead of rebuilding the card. */
function rtDraftParts(){
  const st = nrState, f = st.f;
  const none = cls => '<span class="rt-card__value rt-card__value--empty'+(cls || '')+'">Not set yet</span>';
  return {
    name:  f.name ? '<span class="rt-card__title">'+rtEsc(f.name)+'</span>' : '<span class="rt-card__title rt-card__title--empty">New routine</span>',
    what:  f.what ? '<span>'+rtEsc(f.what)+'</span>' : '<span class="rt-card__desc--empty">Description…</span>',
    when:  f.when ? '<span class="rt-card__value">'+(st.manual ? 'Run when you press play' : rtEsc(f.when))+'</span>' : none(),
    where: f.where ? '<span class="rt-card__value rt-card__value--dest">'+rtLogo(st.dest)+rtEsc(f.where)+'</span>' : none(),
    uses:  st.uses.length ? '<span class="rt-logos">'+st.uses.map(rtLogo).join('')+'</span>'
         : st.usesText ? '<span class="rt-card__value">'+rtEsc(st.usesText)+'</span>' : none(),
  };
}
function rtDraftCardHTML(){
  const p = rtDraftParts();
  nrState.shown = Object.assign({}, p);   // what each slot currently shows (rtPatchDraft compares against this)
  // The entrance animation (below) plays only the first time the card is drawn, not on every re-render.
  const fresh = !nrState.entered; nrState.entered = true;
  const slot = k => '<span class="rt-draft__slot" data-draft="'+k+'">'+p[k]+'</span>';
  return (
    '<div class="rt-card rt-card--draft rt-card--active'+(fresh ? ' rt-card--enter' : '')+'" data-rt-draft>'+
      '<div class="rt-card__head">'+
        '<span class="rt-card__titlewrap">'+slot('name')+'</span>'+
        '<span class="rt-card__status"><span class="rt-card__status-label">'+(nrState.fromLib ? 'Draft · from library' : 'Draft')+'</span></span>'+
      '</div>'+
      '<p class="rt-card__desc">'+slot('what')+'</p>'+
      rtCardRowsHTML(slot('when'), '', slot('where'), slot('uses'))+

}
/* Brings the draft card up to date with nrState in place: every slot whose content changed fades out,
   swaps, and rises back in. Slots go one after another (name → description → when → where → uses) so
   an answer that fills several of them reads as the card "writing itself" top to bottom. */
function rtPatchDraft(){
  const card = document.querySelector('[data-rt-draft]');
  if(!card || !nrState){ render(); return; }
  const parts = rtDraftParts();
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let n = 0;
  ['name','what','when','where','uses'].forEach(k => {
    const slot = card.querySelector('[data-draft="'+k+'"]');
    // Compare with what we last RENDERED, not slot.innerHTML: the browser re-serialises markup
    // (entities, quotes, SVG tags), so innerHTML never matches and every slot would re-animate.
    if(!slot || (nrState.shown && nrState.shown[k] === parts[k])) return;
    if(nrState.shown) nrState.shown[k] = parts[k];
    const v = slot._v = (slot._v || 0) + 1;   // a newer patch for this slot supersedes older pending ones
    const swap = () => {
      if(slot._v !== v) return;
      slot.innerHTML = parts[k];
      if(!calm && slot.animate) slot.animate(
        [{ opacity:0, transform:'translateY(5px)' }, { opacity:1, transform:'none' }],
        { duration:380, easing:'cubic-bezier(.22,.61,.36,1)' });
    };
    const delay = n++ * 130;
    if(calm || !slot.animate){ setTimeout(swap, delay); return; }
    setTimeout(() => {
      if(slot._v !== v) return;
      const out = slot.animate([{ opacity:1 }, { opacity:0 }], { duration:170, easing:'ease-out', fill:'forwards' });
      out.onfinish = () => { swap(); out.cancel(); };
    }, delay);
  });
}
/* The shared body of every routine card (Routines list, drafts, the library): a divider, then the three
   labelled rows When / Where it goes / Uses. Each argument is ready-made HTML for the row's value;
   `whenExtra` sits at the right of the When row (the Play button). */
function rtCardRowsHTML(whenHTML, whenExtra, whereHTML, usesHTML){
  const row = (icon, label, value, extra) =>
    '<div class="rt-card__row"><span class="rt-card__icon">'+svg(icon,1.6)+'</span>'+
    '<span class="rt-card__field"><span class="rt-card__label">'+label+'</span>'+value+'</span>'+(extra || '')+'</div>';
  return '<div class="rt-card__divider"></div><div class="rt-card__body">'+
    row('clock','When',whenHTML,whenExtra)+row('arrowright','Where it goes',whereHTML)+row('plug','Uses',usesHTML)+'</div>';
}
/* RoutineCard: one routine in the Routines grid. Content = description, share line, When / Where / Uses rows;
   the shell (cardShell) supplies the frame and the header. `r` = the RT_ROWS entry, `i` = its index. */
function routineCard(r, i){
    const active = r.workflow.status === 'live';
    const status = rtStatusOf(r);
    const statusLabel = status === 'failing' ? 'Failing' : active ? 'Active' : 'Paused';
    // "When" always uses the clock icon so every card reads the same — the
    // per-trigger icons (trigger.icon) are intentionally ignored here.
    const whenIcon = 'clock';
    // Manual routines (no trigger) get a cleaner label and a right-aligned Play
    // button; scheduled/messaging routines show their trigger copy instead.
    const manual = r.trigger.title === 'Manual';
    const whenText = manual ? 'Run when you press play' : r.trigger.sub;
    const playBtn = manual
      ? '<button type="button" class="rt-play">'+svg('play',1.8)+'Play</button>'
      : '';
    return cardShell({
      // data-rt-card carries the RT_ROWS index so a click can open that routine's
      // side panel (the active card also gets a highlighted state).
      // `_enter` is set once on a card that has just arrived (accepted from a notification):
      // it plays the same entrance as a new copy, then is cleared so re-renders stay still.
      cls:'rt-card'+(rtOpenRoutine === i ? ' rt-card--active' : '')+(r._enter ? ' rt-card--enter' : ''),
      attrs:'data-rt-card="'+i+'"',
      // Title + team badge sit together on the left. The badge (same purple pill as
      // the Home team tag) only appears in the Personal view, and only on routines
      // that carry a `team` — i.e. were created inside a team workspace.
      title:
        '<span class="rt-card__title">'+rtHighlight(r.workflow.title, rtQuery)+'</span>'+
        (activeWorkspace === 'personal' && r.team ? '<span class="home-badge home-badge--purple">'+r.team+'</span>' : '')+
        // Platform routines get a neutral "System" badge by the name instead.
        (r.system ? '<span class="home-badge home-badge--neutral">System</span>' : ''),
      right:
          '<span class="rt-card__status'+(active ? ' rt-card__status--on' : '')+(status === 'failing' ? ' rt-card__status--fail' : '')+'">'+
            // Warning triangle before the label — always in the markup, but CSS only shows it
            // under --fail, so the in-place toggle (which flips that class) keeps it in sync.
            // Icon + label share one hover target (.rt-card__state); its data-tip is the tooltip
            // text, naming the missing tool when we know it. Only shown under --fail (see CSS).
            '<span class="rt-card__state" data-tip="'+(r.failReason ? RT_TOOLS[r.failReason.tool].name+' isn’t connected.' : 'The last run failed.')+' Click to fix it with Mira.">'+
              '<span class="rt-card__status-icon">'+svg('warning',2)+'</span>'+
              '<span class="rt-card__status-label">'+statusLabel+'</span>'+
            '</span>'+
            // data-rt-toggle carries the RT_ROWS index so the click handler knows
            // which routine to flip; aria-pressed mirrors the on/off state.
            '<button type="button" class="rt-toggle" data-rt-toggle="'+i+'" aria-pressed="'+active+'" aria-label="Toggle '+r.workflow.title+'">'+
              '<span class="rt-toggle__knob"></span>'+
            '</button>'+
            // "…" menu: Edit with Mira / Make a copy / Delete. data-rt-more carries the RT_ROWS index.
            '<span class="rt-more">'+
              '<button type="button" class="rt-more__btn" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for '+r.workflow.title+'">'+svg('more',2.4)+'</button>'+
              '<div class="wl-ddmenu" role="menu" hidden>'+
                // First row: opens the routine's Mira chat side panel (same as clicking the card).
                '<button type="button" class="wl-ddmenu__item" role="menuitem" data-rt-act="edit" data-rt-more="'+i+'">'+svg('chat')+'Edit with Mira</button>'+
                '<div class="wl-ddmenu__sep" role="separator"></div>'+
                '<button type="button" class="wl-ddmenu__item" role="menuitem" data-rt-act="duplicate" data-rt-more="'+i+'">'+svg('copy')+'Make a copy</button>'+
                (r.sharedWithMe ? '' : '<button type="button" class="wl-ddmenu__item" role="menuitem" data-rt-act="share" data-rt-more="'+i+'">'+svg('share')+'Share</button>')+
                '<div class="wl-ddmenu__sep" role="separator"></div>'+
                // Own routines (and copies) can be deleted; one shared with me can only be taken off my list.
                (r.sharedWithMe
                  ? '<button type="button" class="wl-ddmenu__item" role="menuitem" data-rt-act="remove" data-rt-more="'+i+'">'+svg('minuscircle')+'Remove from my routines</button>'
                  : '<button type="button" class="wl-ddmenu__item wl-ddmenu__item--danger" role="menuitem" data-rt-act="delete" data-rt-more="'+i+'">'+svg('trash')+'Delete</button>')+
              '</div>'+
            '</span>'+
          '</span>',
      body:
        '<p class="rt-card__desc">'+rtHighlight(r.desc, rtQuery)+'</p>'+
        rtShareLineHTML(r)+
        rtCardRowsHTML('<span class="rt-card__value">'+whenText+'</span>', playBtn,
          '<span class="rt-card__value rt-card__value--dest">'+rtLogo(r.dest)+r.where+'</span>', rtUsesHTML(r.uses, r))
    });
}

function rtPairsInnerHTML(){
  // Filter by the "Show:" scope but keep each row's ORIGINAL index, so the toggle
  // can address RT_ROWS directly — the filtered position would drift as the scope
  // changes, pointing the handler at the wrong routine.
  const visible = RT_ROWS
    .map((r, i) => ({ r, i }))
    .filter(({ r }) => rtInWorkspace(r))
    .filter(({ r }) => activeWorkspace !== 'personal' || rtShow.size === 0 || rtShow.has(rtShowKey(r)))
    .filter(({ r }) => rtStatus.size === 0 || rtStatus.has(rtStatusOf(r)))
    .filter(({ r }) => rtTool.size === 0 || [...rtTool].some(id => r.dest === id || (r.uses || []).includes(id)))
    .filter(({ r }) => {
      const q = rtQuery.trim().toLowerCase();
      return !q || r.workflow.title.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q);
    });
  // Graceful fallback: a non-empty filter that happens to match nothing shows a
  // small empty state instead of a blank grid. (With the "empty = show all" rule
  // in rtShow, this is only reachable if a selected category has no rows.)
  if(visible.length === 0){
    // Search empty state: echoes the query, then points to the two ways forward — let Mira
    // find it, or create it. Both are wired in the 'routines' branch (wireEmpty).
    if(rtQuery.trim()){
      return '<div class="rt-empty">'+
        '<div class="rt-empty__title">No routines match “'+rtEsc(rtQuery.trim())+'”</div>'+
        '<p class="rt-empty__text">Try describing what it does instead, or ask Mira to find it for you.</p>'+
        '<div class="rt-empty__actions">'+
          '<button type="button" class="rt-empty__btn" data-rt-ask-mira>Ask Mira</button>'+
          '<button type="button" class="wl-newtask" data-rt-empty-new><span class="wl-newtask__icon">'+svg('plus',2)+'</span>New routine</button>'+
        '</div>'+
      '</div>';
    }
    return '<div class="rt-empty"><div class="rt-empty__title">No routines match the selected filters</div></div>';
  }
  const cards = visible.map(({ r, i }) => routineCard(r, i)).join('');
  // The entrance plays once: forget the flag so later re-renders don't replay it.
  visible.forEach(({ r }) => { delete r._enter; });
  return '<div class="rt-grid">'+cards+'</div>';
}

function wireRtChat(c){

/* Typing indicator markup + how long Mira "types" before a message appears (ms). */
const MIRA_TYPING = '<div class="mira-typing" aria-label="Mira is typing" role="status"><i></i><i></i><i></i></div>';
const MIRA_TYPING_MS = 1000;
/* Mira's opening message for a routine (shared by the side panel and the full-screen chat).
   A failing routine with a known cause: Mira starts the conversation herself, says which routine
   is broken and why, and offers the same Connect button used in onboarding. Otherwise the usual
   "What would you like to change?" with the quick-change chips. */
function rtChatBodyHTML(i){
  const r = RT_ROWS[i];
  const badges = RT_PANEL_BADGES
    .map(b => '<button type="button" class="nr__chip">'+b+'</button>')
    .join('');
  // A routine that is shared (by me, or with me) opens with a heads-up folded into the first line:
  // an individual share names the other person, a team share says the whole team is affected.
  const heads = rtShareHeadsUp(r);
  let body = '<div class="nr__bubble">'+(heads ? heads+' What should we change?' : 'What would you like to change?')+'</div><div class="nr__chips">'+badges+'</div>';
  if(r.failing && r.failReason){
    const t = RT_TOOLS[r.failReason.tool];
    body =
      '<div class="nr__bubble"><b class="rt-name">'+r.workflow.title+'</b> couldn’t run because '+t.name+' isn’t connected. Connect it and I’ll run '+r.failReason.retry+' again.</div>'+
      '<div class="rt-conn" data-rt-conn="'+i+'">'+
        '<span class="rt-logo">'+t.logo+'</span>'+
        '<span class="rt-conn__name">'+t.name+'</span>'+
        '<button type="button" class="rt-conn__btn">'+svg('link',1.8)+'Connect</button>'+
        '<span class="rt-conn__done">'+svg('check',2.25)+'Connected</span>'+
      '</div>'+
      // Revealed after connecting.
      '<div class="nr__bubble rt-conn-after" hidden>'+t.name+' is connected. <b class="rt-name">'+r.workflow.title+'</b> is back to normal and will run on its next schedule.</div>';
  }

}
/* Who a routine is shared with, for the pause / delete confirmations.
   kind 'team'       → shared with (or owned by) a team; `team` is its short name ("Sales team")
   kind 'individual' → shared one-to-one; `who` is the other people's names ("Craig", "Craig and Maria")
   kind 'personal'   → only the user is affected. */
function rtShareCtx(r){
  const short = n => n.replace(/\s*team$/i, '')+' team';
  const join = a => a.length > 1 ? a.slice(0, -1).join(', ')+' and '+a[a.length-1] : a[0];
  if(r.sharedTeams && r.sharedTeams.length) return { kind:'team', team:short(r.sharedTeams[0]) };
  const people = r.sharedBy ? [r.sharedBy] : (r.sharedWith || []);
  if(people.length) return { kind:'individual', who:join(people) };
  if(r.cat === 'sales' || r.team) return { kind:'team', team:short(r.team || 'Sales Team') };
  return { kind:'personal' };
}
/* Small confirm dialog (same shell as the other modals). `danger` makes the confirm button red.
   Cancel, Escape and a click on the backdrop all close it without doing anything. */
function rtConfirm(o, onYes){
  const m = document.createElement('div');
  m.className = 'home-modal rt-confirm';
  m.innerHTML =
    '<div class="home-modal__panel" role="alertdialog" aria-modal="true" aria-label="'+o.title.replace(/"/g,'&quot;')+'">'+
      '<h3 class="home-modal__title">'+o.title+'</h3>'+
      '<div class="home-modal__text rt-confirm__text">'+o.text+'</div>'+
      '<div class="rt-confirm__foot">'+
        '<button type="button" class="home-btn" data-close>Cancel</button>'+
        '<button type="button" class="home-btn '+(o.danger ? 'home-btn--danger' : 'home-btn--primary')+'" data-yes>'+o.confirm+'</button>'+
      '</div>'+
    '</div>';
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  m.addEventListener('mousedown', e => { if(e.target === m) close(); });
  m.querySelector('[data-close]').addEventListener('click', close);
  m.querySelector('[data-yes]').addEventListener('click', () => { close(); onYes(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
  m.querySelector('[data-close]').focus();
}
/* The heads-up sentence for a shared routine, or '' when it is not shared.
   Team share   → "Heads-up: changes apply to the whole Sales team."
   Individual   → "Heads-up: Craig will see your changes too." (names joined with "and") */
function rtShareHeadsUp(r){
  const teams = r.sharedTeams || [];
  if(teams.length){
    const t = teams.map(n => n.replace(/\s*team$/i, '')+' team');
    return 'Heads-up: changes apply to the whole '+t.join(' and the whole ')+'.';
  }
  const people = r.sharedBy ? [r.sharedBy] : (r.sharedWith || []);
  if(!people.length) return '';
  const list = people.length > 1 ? people.slice(0, -1).join(', ')+' and '+people[people.length-1] : people[0];
  return 'Heads-up: '+list+' will see your changes too.';
}
/* Wires the Connect row of a failing routine inside `root` (the side panel or the full-screen
   chat): flips it to "Connected", clears the routine's failing state and has Mira "type" her
   confirmation. `rerender` refreshes the cards behind the side panel; the full-screen chat must not
   re-render (that would restart the conversation). */
function wireRtConn(root, rerender){
  const conn = root.querySelector('[data-rt-conn]');
  if(!conn) return;
  conn.querySelector('.rt-conn__btn').addEventListener('click', () => {
    const row = RT_ROWS[Number(conn.dataset.rtConn)];
    row.failing = false;
    delete row.failReason;
    conn.classList.add('is-on');
    const after = root.querySelector('.rt-conn-after');
    if(after){
      conn.insertAdjacentHTML('afterend', MIRA_TYPING);
      const dots = conn.nextElementSibling;
      setTimeout(() => { dots.remove(); after.hidden = false; }, 800);
    }
    if(rerender) render();
  });
}

/* Keeps the shell-level #rtPanel segment in sync with rtOpenRoutine: fills and
   shows it on the Routines screen when a routine is open, hides it otherwise
   (including when navigating away). Called from render() after renderContent(). */
let rtPanelTypeTimer = null;    // pending end of the panel's opening typing state
let rtPanelCloseTimer = null;   // pending hide after the close easing finishes
function updateRtPanel(){
  const host = document.getElementById('rtPanel');
  if(!host) return;
  // The library is a full-width view: no side panel there (a bundle or a single routine opens the list first).
  const onList = activeId === 'routines' && !rtLibOpen;
  const drafting = onList && rtNewOpen && Boolean(nrState);
  const bundling = onList && !drafting && Boolean(rtBundle);
  const finding = onList && !drafting && !bundling && rtFindQuery !== null;
  const editing = onList && !drafting && !bundling && !finding && rtOpenRoutine !== null && RT_ROWS[rtOpenRoutine];
  if(activeId !== 'insights' || !insNav) insChat = null;   // leaving the dashboard closes its chat
  if(pgChat && (activeId === 'mira' || pgChat.pageKey !== pgPageKey())) pgChat = null;   // the page chat belongs to the page it was opened on
  const pinning = activeId === 'insights' && Boolean(insPin);   // pin-from-chat screen: its chat is this panel
  const dashEdit = !pinning && activeId === 'insights' && Boolean(insNav) && Boolean(insChat);   // a dashboard chat (Edit with Mira / Send report)
  if(drafting || bundling || finding || editing || dashEdit || pinning) pgChat = null;   // a more specific panel takes over
  const pgOpen = Boolean(pgChat);
  const open = drafting || bundling || finding || editing || dashEdit || pinning || pgOpen;
  // Hide the floating "Ask Mira" button while the drawer is open (it would overlap
  // the panel's own composer).
  const ask = document.getElementById('askMira');
  // (also hidden on the full-screen "Ask Mira" tab — every chat there, incl. New routine — where
  // the floating button would be redundant and would cover the composer / draft panel)
  if(ask) ask.hidden = Boolean(open) || activeId === 'mira';
  if(open){
    // Only rebuild (and thus replay the reveal easing) when what the panel shows actually
    // changes — not on every unrelated re-render while it stays open.
    const key = pgOpen ? 'page:'+pgChat.id : pinning ? 'pin:'+insPin.id : dashEdit ? 'dash:'+insChat+':'+insNav : drafting ? 'new:'+nrState.id : bundling ? 'bundle:'+rtBundle.b.id : finding ? 'find:'+rtFindQuery : String(rtOpenRoutine);
    if(host.dataset.routine !== key){

        // Closing the build chat before the first "Add to dashboard" drops the draft and goes back; afterwards it just closes.

        pgChat = null; insChat = null; insPin = null; rtOpenRoutine = null; rtFindQuery = null; rtNewOpen = false; rtBundle = null; render(); });
      // Expand: continue this routine's chat full screen, in the Ask Mira tab.
      const expand = host.querySelector('[data-rt-expand]');

      } else if(pinning){

          if(reveal) reveal.hidden = false;

        wireRtConn(host, true);

        if(pgOpen) pgWirePanel(host, pgChat);
        if(dashEdit && insChat === 'summary') insWireSummaryPanel(host, key, insDashLabel(insNav));
        if(dashEdit && insChat === 'filter') insWireFilterPanel(host);

    if(host.hidden){

}

/* ---- Search: words in the query are matched against name, description, app and trigger; rarer words
   count more, and only results close to the best one are kept. ---- */
const RTL_STOP = new Set('a an the to of for and or my me in on at from with into by is it that this i you your want automate turn make get send each every'.split(' '));
const rtlWords = s => (String(s).toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => !RTL_STOP.has(w)).map(w => w.length > 3 ? w.replace(/s$/, '') : w);

  const idf = w => Math.log(1 + RTL_ITEMS.length / (1 + docs.filter(d => d.has(w)).length));
  const scored = RTL_ITEMS.map((it, i) => ({ it, score:qw.reduce((n, w) => n + (docs[i].has(w) ? idf(w) : 0), 0) })).filter(x => x.score > 0);
  const top = Math.max(0, ...scored.map(x => x.score));
  return scored.filter(x => x.score >= top * 0.6).sort((a, b) => b.score - a.score).slice(0, 6).map(x => x.it);
}

function wireRoutineLibrary(c){
  c.querySelector('[data-rtl-back]').addEventListener('click', () => { rtLibOpen = false; rtViewEnter = true; render(); });
  const results = c.querySelector('[data-rtl-results]');
  // Source tabs.
  const tabs = c.querySelector('[data-rtl-tabs]');
  tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-rtl-source]'); if(!b) return;
    rtLibSource = b.dataset.rtlSource;
    tabs.querySelectorAll('.wl-tab').forEach(t => t.classList.toggle('is-active', t === b));
    rtlSetResults(results);
  });
  // Category dropdown: picks toggle, the menu stays open; the pill, menu and results are redrawn after each pick.
  const box = c.querySelector('[data-rtl-catdd]');
  const wireCat = openNow => wireMultiDropdown(box, 'rtlcat', val => {
    if(val === '__clear__') rtLibCats.clear();
    else { const id = RTL_CATS.concat(RTL_AUDIENCES).find(x => x.label === val).id; rtLibCats.has(id) ? rtLibCats.delete(id) : rtLibCats.add(id); }
    box.innerHTML = rtlCatDropdownHTML();
    wireCat(true);
    rtlSetResults(results);
  }, openNow);
  wireCat(false);
  wireCollapsibleSearch(c);
  const sBox = c.querySelector('[data-search]'), sInput = sBox.querySelector('.wl-search__input');
  // Open from the start (data-pinned keeps it open when it loses focus).
  sBox.querySelector('.wl-search__btn').setAttribute('aria-expanded','true');
  sInput.removeAttribute('tabindex');
  sInput.value = rtLibQuery;
  sInput.addEventListener('input', () => { rtLibQuery = sInput.value; rtlSetResults(results); });
  rtlSetResults(results);
  // One listener for every button in the results (they are swapped while typing).
  results.addEventListener('click', e => {
    const card = e.target.closest('[data-rtl-card]');
    const use = e.target.closest('[data-rtl-use]'), bun = e.target.closest('[data-rtl-bundle]'), bld = e.target.closest('[data-rtl-build]');
    if(use) rtlUse(use.dataset.rtlUse);
    else if(card && !bun && !bld) rtlUse(card.dataset.rtlCard);
    else if(bun) rtlOpenBundle(bun.dataset.rtlBundle);
    else if(bld){
      const q = rtLibQuery.trim(), close = rtlMatches > 0;
      openNewRoutine(q);
      // Some routines did match, so Mira shouldn't open with "Nothing matched".
      if(q && close && nrState) nrState.log[0].text = 'Let’s build “'+q+'” together. What should this routine do? Describe it in a sentence and I’ll take it from there.';
    }
  });
}

/* Reads what can be inferred from a free-text description: when / where / tools. Whatever is not
   mentioned is left out, and Mira asks about it. */
function nrInfer(text, team){
  const out = {};
  const w = text.match(/\b(every (?:day|weekday|morning|evening|week|monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?: (?:at|before|after) [\d:apm. ]+)?)/i);
  if(w) out.when = w[1].charAt(0).toUpperCase()+w[1].slice(1);
  else if(/\bdaily\b/i.test(text)) out.when = 'Every day';
  else if(/\bweekly\b/i.test(text)) out.when = 'Every week';
  else if(/\b(when i press play|on demand|manually)\b/i.test(text)){ out.when = 'When I press play'; out.manual = true; }
  if(/telegram/i.test(text)){ out.where = 'Telegram · @agata'; out.dest = 'telegram'; }
  else if(/slack/i.test(text)){ out.where = team ? 'Slack · #sales' : 'Slack · direct message'; out.dest = 'slack'; }
  else if(/e-?mail|gmail/i.test(text)){ out.where = team ? 'Email · to the Sales team' : 'Email · to me'; out.dest = 'gmail'; }
  const uses = [];
  [['gmail',/e-?mail|gmail|inbox/i],['gcal',/calendar|meeting/i],['gdrive',/drive|\bdocs?\b|files?/i],
   ['notion',/notion/i],['asana',/asana/i],['linear',/linear/i]]
    .forEach(([id, re]) => { if(re.test(text) && id !== out.dest) uses.push(id); });
  if(uses.length) out.uses = uses;
  return out;
}
/* Handles one answer (a tapped chip or typed text): shows it as the user's bubble, fills the draft,
   then — after the typing dots — Mira asks for whatever is still missing, or offers to save. */
function nrAnswer(host, text, pick){
  const st = nrState;
  if(!st || st.busy) return;   // Mira is still typing her last answer
  if(st.copyOf){ nrCopyAnswer(host, text, pick); return; }
  const f = st.f;
  if(!st.intro){               // answered while the opening dots were still showing: rebuild the thread from the log
    const sc = host.querySelector('[data-nr-scroll]'); if(sc) sc.innerHTML = '';
    st.intro = true;
  }
  let pending = null;
  const reply = (t, chips) => { pending = { role:'mira', text:t, chips }; };
  const prev = st.log[st.log.length - 1]; if(prev){ prev.chips = null; prev.more = null; }   // answered: chips go away
  st.log.push({ role:'user', text });
  let renamed = false;
  if(st.step === 'start'){
    if(pick && pick.name){
      Object.assign(f, { name:st.seed || pick.name, what:pick.what, when:pick.when || '', where:pick.where || '' });
      st.dest = pick.dest || null; st.uses = pick.uses || [];
    } else {
      const inf = nrInfer(text, st.team);
      f.what = nrSentence(text); f.name = st.seed || nrTitle(text);
      f.when = inf.when || ''; f.where = inf.where || ''; st.dest = inf.dest || null;
      st.uses = inf.uses || []; st.manual = Boolean(inf.manual);
    }
  } else if(st.step === 'when'){
    f.when = text; st.manual = Boolean(pick ? pick.manual : /press|manual|on demand/i.test(text));
  } else if(st.step === 'where'){
    f.where = text;
    const k = pick ? pick.tool : ['telegram','slack'].find(x => text.toLowerCase().includes(x)) || (/mail/i.test(text) ? 'gmail' : null);
    st.dest = k || null;
  } else {   // 'done': typed text renames the routine
    f.name = text.trim(); renamed = true;
  }
  // Ask for the next missing piece, one question at a time.
  if(!f.when){
    st.step = 'when';
    reply('Got it. How often should this run?', NR_WHEN);
  } else if(!f.where){
    st.step = 'where';
    reply('Got it. Where should the result go?', NR_WHERE[st.team ? 'team' : 'personal']);
  } else {
    st.step = 'done';
    reply((renamed ? 'Renamed. ' : '')+'Here’s your routine. Want me to turn it on?', NR_SAVE);
  }
  nrDeliver(host, pending);
}
/* Shows what the user just said + Mira's typing dots, fills the draft card in place, and after the
   typing delay appends Mira's reply (`pending`). Shared by creating and copying. */
function nrDeliver(host, pending){
  const st = nrState;
  st.busy = true;
  rtPatchDraft();      // fills the draft card in place with what the answer revealed
  nrSync(host);        // user's bubble + typing dots
  setTimeout(() => {
    st.busy = false;
    st.log.push(pending);
    // The panel may have been closed meanwhile: the state is updated either way, the DOM only if it's still there.
    const h = document.getElementById('rtPanel');
    if(nrState === st && rtNewOpen && h && h.querySelector('[data-nr-scroll]')) nrSync(h);
  }, MIRA_TYPING_MS);
}
/* Brings the panel in line with nrState without rebuilding it (keeps focus, no animation replay for
   old messages): appends the new thread entries and refreshes the composer placeholder. */
function nrSync(host){
  const scroll = host.querySelector('[data-nr-scroll]');
  const shown = scroll.querySelectorAll('.nr__bubble, .nr__user').length;
  scroll.querySelectorAll('.nr__chips, .nr__link, .nr__actions, .nr__or, .mira-typing').forEach(el => el.remove());
  nrState.log.slice(shown).forEach(en => scroll.insertAdjacentHTML('beforeend', nrEntryHTML(en)));
  if(nrState.busy) scroll.insertAdjacentHTML('beforeend', MIRA_TYPING);
  scroll.scrollTop = scroll.scrollHeight;
  const input = host.querySelector('.composer__input');
  input.placeholder = NR_PLACEHOLDER(nrState);
  input.focus();
}
/* ---- Make a copy ----
   Nearly the same process as creating, but starting from a filled-in draft (the original's
   fields). A copy is almost always made to change something, so Mira opens by asking what.
   Afterwards: the same "Save and turn on / Save as paused" ending as creating. */
function openCopyRoutine(i){
  nrState = nrFreshCopy(i);
  rtNewOpen = true; rtOpenRoutine = null; rtFindQuery = null; rtBundle = null; rtLibOpen = false;
  render();
  rtRevealDraft();
}
/* Scrolls the opened routine's card into view. Opening the side panel narrows the grid, so cards
   reflow; wait a frame for the new layout, then centre the card only if it is not fully visible. */
function rtRevealCard(i){
  requestAnimationFrame(() => {
    const card = document.querySelector('[data-rt-card="'+i+'"]');
    if(!card) return;
    const main = document.querySelector('.main') || card.parentElement;
    const c = card.getBoundingClientRect(), m = main.getBoundingClientRect();
    if(c.top < m.top || c.bottom > m.bottom) card.scrollIntoView({ behavior:'smooth', block:'center' });
  });
}
/* Brings the freshly added draft card into view: the list scrolls back to the top, where it sits. */
function rtRevealDraft(){
  const main = document.querySelector('.main');
  if(main && main.scrollTop > 0) main.scrollTo({ top:0, behavior:'smooth' });
}
/* The change chips. The last one depends on who owns the original: a team routine can be kept
   private ("Keep it for me only"), a personal one can be shared ("Share with a team"). */
function nrCopyChips(st, withSave){
  const chips = [
    { label:'Change when', act:'when' },
    { label:'Change where it goes', act:'where' },
    { label:'Rename', act:'rename' },
  ];
  if(!st.ownerDone) chips.push(st.copyOf.team ? { label:'Keep it for me only', act:'keep' } : { label:'Share with a team', act:'share' });
  return withSave ? chips.concat(NR_SAVE) : chips;
}
function nrFreshCopy(i){
  const r = RT_ROWS[i];
  const manual = r.trigger.title === 'Manual';
  const st = { id:++nrSeq, team:Boolean(r.team), lib:{ placeholder:'' }, copyOf:r, owner:r.team ? 'sales' : 'personal',
    trigger:r.trigger, ownerDone:false, changed:false,
    f:{ name:r.workflow.title+' (copy)', what:r.desc, when:manual ? 'When I press play' : r.trigger.sub, where:r.where || '' },
    seed:'', dest:r.dest || null, uses:(r.uses || []).slice(), manual, step:'change', intro:false, busy:false, log:[] };
  st.log.push({ role:'mira', text:'This is a copy of '+r.workflow.title+'. What would you like to change?', chips:nrCopyChips(st, false) });
  return st;
}
/* One answer while copying: applies the change to the draft and asks what else, or what comes next. */
function nrCopyAnswer(host, text, pick){
  const st = nrState, f = st.f;
  if(!st.intro){
    const sc = host.querySelector('[data-nr-scroll]'); if(sc) sc.innerHTML = '';
    st.intro = true;
  }
  const prev = st.log[st.log.length - 1]; if(prev){ prev.chips = null; prev.more = null; }
  st.log.push({ role:'user', text });
  const ownerLib = st.owner === 'sales' ? 'team' : 'personal';
  const again = 'Done. Anything else you’d like to change, or shall I save it?';
  let pending;
  if(pick && pick.act === 'when'){
    st.step = 'when'; pending = { role:'mira', text:'When should it run instead?', chips:NR_WHEN };
  } else if(pick && pick.act === 'where'){
    st.step = 'where'; pending = { role:'mira', text:'Where should the result go instead?', chips:NR_WHERE[ownerLib] };
  } else if(pick && pick.act === 'rename'){
    st.step = 'rename'; pending = { role:'mira', text:'What should it be called?' };
  } else if(pick && pick.act === 'keep'){
    st.owner = 'personal'; st.ownerDone = true; st.changed = true; st.step = 'change';
    pending = { role:'mira', text:'Okay, this copy stays with you only. Anything else you’d like to change, or shall I save it?', chips:nrCopyChips(st, true) };
  } else if(pick && pick.act === 'share'){
    st.step = 'share'; pending = { role:'mira', text:'Which team should get it?', chips:[{ label:'Sales Team', act:'team' }] };
  } else if(pick && pick.act === 'team'){
    st.owner = 'sales'; st.ownerDone = true; st.changed = true; st.step = 'change';
    pending = { role:'mira', text:'Done — it will be shared with the Sales Team. Anything else you’d like to change, or shall I save it?', chips:nrCopyChips(st, true) };
  } else if(st.step === 'when'){
    f.when = text; st.manual = Boolean(pick ? pick.manual : /press|manual|on demand/i.test(text));
    st.trigger = null; st.changed = true; st.step = 'change';
    pending = { role:'mira', text:again, chips:nrCopyChips(st, true) };
  } else if(st.step === 'where'){
    f.where = text; st.changed = true; st.step = 'change';
    st.dest = pick ? pick.tool : ['telegram','slack'].find(x => text.toLowerCase().includes(x)) || (/mail/i.test(text) ? 'gmail' : null);
    pending = { role:'mira', text:again, chips:nrCopyChips(st, true) };
  } else if(st.step === 'rename'){
    f.name = text.trim(); st.changed = true; st.step = 'change';
    pending = { role:'mira', text:again, chips:nrCopyChips(st, true) };
  } else if(st.step === 'share'){
    st.owner = 'sales'; st.ownerDone = true; st.changed = true; st.step = 'change';
    pending = { role:'mira', text:'Done — it will be shared with the Sales Team. Anything else you’d like to change, or shall I save it?', chips:nrCopyChips(st, true) };
  } else {
    // Free text while choosing what to change: "save it" / "nothing" ends the changes (an unchanged
    // copy gets the run-twice warning); otherwise apply whatever can be read from it.
    const inf = nrInfer(text, st.owner === 'sales');
    if(!inf.when && !inf.where && /\b(save|nothing|no changes?|as is|same|keep it)\b/i.test(text)){
      pending = (st.changed || st.fromLib)
        ? { role:'mira', text:'Here’s your routine. Want me to turn it on?', chips:NR_SAVE }
        : { role:'mira', text:'This will run at the same time as the original. Save it paused for now?',
            chips:[{ label:'Save as paused', save:'paused', primary:true }, { label:'Turn on anyway', save:'live', force:true }] };
      nrDeliver(host, pending);
      return;
    }
    if(inf.when){ f.when = inf.when; st.manual = Boolean(inf.manual); st.trigger = null; st.changed = true; }
    if(inf.where){ f.where = inf.where; st.dest = inf.dest; st.changed = true; }
    pending = (inf.when || inf.where)
      ? { role:'mira', text:again, chips:nrCopyChips(st, true) }
      : { role:'mira', text:'Tell me what to change: pick one below, or describe it, for example “every Friday at 9:00”.', chips:nrCopyChips(st, st.changed) };
  }
  nrDeliver(host, pending);
}
/* "Save and turn on" on a copy nobody changed: it would run alongside the original, so Mira says so. */
function nrWarnUnchanged(host, pick){
  const st = nrState;
  const prev = st.log[st.log.length - 1]; if(prev){ prev.chips = null; prev.more = null; }
  st.log.push({ role:'user', text:pick.label });
  nrDeliver(host, { role:'mira', text:'This will run at the same time as the original. Save it paused for now?',
    chips:[{ label:'Save as paused', save:'paused', primary:true }, { label:'Turn on anyway', save:'live', force:true }] });
}
/* Saves the draft as a real routine, on top of the list where its draft card was. */
function nrSave(live){
  const st = nrState, f = st.f;
  // A copy keeps (or changes) the original's owner; a new routine belongs to the current space.
  const team = st.owner ? st.owner === 'sales' : activeWorkspace === 'sales';
  RT_ROWS.unshift({
    cat: team ? 'sales' : 'personal', scope: team ? undefined : 'personal', team: team ? 'Sales Team' : undefined,
    where:f.where, dest:st.dest || undefined, uses:st.uses, usesText:st.usesText || undefined, desc:f.what,
    // A copy keeps the original's trigger until its "When" is changed.
    trigger: st.trigger || (st.manual ? { title:'Manual', sub:'No trigger — runs when you press play' }
                                      : { title:'Schedule', icon:'clock', sub:'Schedule · '+f.when }),
    workflow:{ title:f.name, auto:true, status:live ? 'live' : 'paused', text:live ? 'Live' : 'Paused' } });
  // Clear every filter/search so the new card is visible straight away.
  rtShow.clear(); rtStatus.clear(); rtTool.clear(); rtQuery = '';
  rtNewOpen = false; nrState = null;
  // A private copy made inside a team space lives in Personal: go there so the user sees where it landed.
  if(!team && activeWorkspace !== 'personal') setWorkspace('personal'); else render();
}
/* Wires the New routine panel once it has been built: opening typing, chips + "Browse all
   routines", and the composer. `key` guards the timers against the panel having moved on. */
function wireNewRoutinePanel(host, key){
  const st = nrState;
  if(!st.intro && !st.introTimer){
    st.introTimer = setTimeout(() => {
      st.intro = true;
      const h = document.getElementById('rtPanel');
      if(nrState === st && h && h.dataset.routine === key){
        const sc = h.querySelector('[data-nr-scroll]');
        if(sc) sc.innerHTML = nrScrollHTML();
      }
    }, MIRA_TYPING_MS);
  }
  const scroll = host.querySelector('[data-nr-scroll]');
  scroll.addEventListener('click', e => {
    if(e.target.closest('[data-nr-more]')){
      // "Browse all routines": the rest of the library joins the chips.
      const en = st.log[st.log.length - 1];
      if(en && en.more){
        en.chips = en.chips.concat(en.more); en.more = null;
        scroll.querySelectorAll('.nr__chips, .nr__link, .nr__actions, .nr__or').forEach(el => el.remove());
        scroll.insertAdjacentHTML('beforeend', nrChipsHTML(en));
        scroll.scrollTop = scroll.scrollHeight;
      }
      return;
    }
    const b = e.target.closest('[data-nr-chip]'); if(!b || st.busy) return;
    const en = [...st.log].reverse().find(x => x.chips);
    const pick = en && en.chips[Number(b.dataset.nrChip)];
    if(!pick) return;
    if(pick.save){
      // An unchanged copy would do exactly what the original does (e.g. send the same digest twice):
      // before turning it on, Mira points that out and suggests saving it paused.
      if(pick.save === 'live' && st.copyOf && !st.fromLib && !st.changed && !pick.force){ nrWarnUnchanged(host, pick); return; }
      nrSave(pick.save === 'live'); return;
    }
    setTimeout(() => nrAnswer(host, pick.label, pick), 120);
  });
  const form = host.querySelector('[data-nr-form]');
  const input = form.querySelector('.composer__input');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim(); if(!v || st.busy) return;
    input.value = '';
    setTimeout(() => nrAnswer(host, v, null), 120);
  });
  input.focus();
}
