   (24) = 12 visible lavender + 12 for that overlap strip; the bottom margin pulls the first section up. */
.home--c .home-col .home-editbar{
  position:relative;margin:0;padding:8px 32px 24px 24px;
  border:0;border-radius:0;background:#F4F1FB;
}
.home--c .home-col .home-editbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background:#FBFAFE;border-radius:12px 12px 0 0;
}
.home--c .home-editbar__text{font-size:13px;color:#7B59C3} /* 13px = the size of the button labels next to it */
.home--c .home-editbar .home-btn{background:#fff;border-color:#ECE6F8;color:#7B59C3}
.home--c .home-editbar .home-btn--primary{background:#7B59C3;border-color:#7B59C3;color:#fff}
/* Layout D (containers): same content as C, but the columns are two rounded #FAFAFA containers
   with a gap between them instead of divider lines (Inputs/Other/containers.png). The greeting
   row has no divider; the page gets an outer margin so the containers float on the white card. */
.content:has(> .home--c.home--d){padding:0 24px 24px}
.home--c.home--d .home-top{padding:24px 16px 16px;border-bottom:0}   /* 16px = the sections' inner padding, so the title lines up with them and with Tasks / Routines */
.home--c.home--d .home-cols{gap:8px}
.home--c.home--d .home-col,.home--c.home--d .home-col + .home-col{
  background:#FAFAFA;border:0;border-radius:12px;padding:8px 16px 16px;overflow:hidden; /* 8px tighter on every side */
}
/* Edit mode: the banner runs edge to edge of the right container (overflow:hidden clips it to the rounded corners). */
.home--c.home--d .home-col .home-editbar{padding:8px 16px 24px}
.home--c.home--d.is-editing .home-cols > .home-col + .home-col{background:#FBFAFE}
.home--c.home--d .home-col .home-editbar::after{background:#FBFAFE}
/* Edit mode: the drag handle hangs in the column's left padding instead of pushing the title right,
   so section titles stay aligned with the cards below and the left/right padding looks equal. */
.home--c .home-drag{margin:0 0 0 -24px;height:28px} /* net layout width 0: the grip hangs in the column padding, ~9px left of the title */
/* Layout D has 16px column padding (8px tighter), so the grip hangs less far left to avoid being clipped by the rounded container. */
.home--c.home--d .home-drag{margin:0 -4px 0 -20px}
/* Remove-widget button (right of a section title, edit mode only): a dark purple minus-in-circle icon.
   The click target is 28x28 (the icon itself is 20px), and a CSS tooltip ("Remove widget") shows
   on hover/focus to the left of the button, so the rounded containers can't clip it. */
.home-remove{display:none;position:relative;width:28px;height:28px;flex:0 0 28px;align-items:center;justify-content:center;padding:0;border:0;
  background:transparent;color:#5B34A0;opacity:0;pointer-events:none;transition:opacity .3s ease,background .12s ease}
.home-remove svg{width:20px;height:20px}
.home-remove:hover,.home-remove:focus-visible{background:#F4F1FB}
.home-remove::after{content:attr(data-tip);position:absolute;text-align:left;right:calc(100% + 6px);top:50%;transform:translateY(-50%);
  padding:4px 8px;border-radius:6px;background:#2b1f45;color:#fff;font-size:12px;font-weight:var(--fw-medium);line-height:16px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease}
.home-remove:hover::after,.home-remove:focus-visible::after{opacity:1;transition-delay:.25s}
.home--c .home-remove{display:inline-flex}
/* Only widgets in the right (purple) column can be removed; the left column (Needs you, Keep an eye on,
   Mira handled) is one fixed group, not widgets. */
.home--c.is-editing .home-col + .home-col .home-remove{opacity:1;pointer-events:auto}
/* Empty state of a card list: quiet, muted, one line, fades in once the last card is gone. */
.home-empty{display:none;align-items:center;justify-content:center;gap:8px;padding:20px 0;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-empty svg{width:16px;height:16px;flex:0 0 16px}   /* inherits the text colour */
.home-box__list:not(:has(.home-card)) .home-empty{display:flex;animation:homeBoxIn .4s cubic-bezier(.22,1,.36,1) .15s both}
/* Sections fade out when removed and slide/fade in when added back. */
.home-box{transition:opacity .2s ease}
.home-box.is-leaving{opacity:0}
.home-box--enter{animation:homeBoxIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes homeBoxIn{from{opacity:0;transform:translateY(8px)}}
/* "Add widgets" dropdown: a title + the hidden widgets, then an "Added" title + the widgets on the
   panel. It is position:fixed and appended to <body> (placed by JS: 8px left of the dashed field,
   top-aligned with it), so it can stick out past the purple container instead of being clipped. */
.home-addmenu{position:fixed;z-index:400;width:220px;display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;
  border:1px solid #ECE6F8;border-radius:10px;box-shadow:0 8px 24px rgba(136,85,210,.12);
  animation:homeBoxIn .3s cubic-bezier(.22,1,.36,1)}
/* Same eyebrow style as the "Apps" label in the side nav (.nav-group__label): IBM Plex Mono, 12px, all caps. */
.home-addmenu__title{padding:6px 10px 4px;font-size:12px;font-weight:var(--fw-medium);color:var(--slate);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}
.home-addmenu__title--sub{margin-top:6px;padding-top:10px;border-top:1px solid #ECE6F8}
.home-addmenu__item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border:0;
  background:transparent;font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--ink);text-align:left}
.home-addmenu__item:hover{background:var(--c-hover)}   /* same hover as .navlink in the side nav */
/* Same rule as every other dropdown: text black (also on already-added rows), icons in the
   grey of the side-nav icons (--slate-icon). */
.home-addmenu__icon,.home-addmenu__act{display:inline-flex;flex:0 0 auto;color:var(--slate-icon)}
.home-addmenu__icon svg,.home-addmenu__act svg{width:16px;height:16px}
.home-addmenu__name{flex:1 1 auto;min-width:0}
.home-addmenu__empty{padding:6px 10px;font-size:13px;color:var(--c-copy)}
/* Drag & drop of widget sections: the dragged section dims in place, a ghost copy follows the pointer,
   and a thick violet line marks the drop position. */
.home--c .home-col{position:relative}
.home-dropline{position:absolute;left:24px;right:32px;height:4px;margin-top:-2px;border-radius:2px;
  background:#7B59C3;pointer-events:none;z-index:5}
.home--c.home--d .home-dropline{left:16px;right:16px}
.home-box.is-dragging{opacity:.35}
.home-ghost{position:fixed;z-index:300;margin:0;pointer-events:none;opacity:.92;border-radius:10px;
  background:#FBFAFE;box-shadow:0 12px 32px rgba(136,85,210,.25)}
.home-ghost .home-drag{display:none}
body.is-dragging-widget,body.is-dragging-widget *{cursor:grabbing !important;user-select:none}
.home--c .home-drag{touch-action:none}
/* Smooth edit mode (C/D). Easing: ease-out quint, 0.4s.
   - .home-editzone (banner + add list) opens like an accordion: grid rows 0fr -> 1fr, with its
     margins animating too (collapsed it adds no space, expanded it sits flush at the column's top
     edge and cancels the column padding). Its content is visibility:hidden while closed, so it
     can't be tabbed to; the visibility change is delayed on close so the collapse stays visible.
   - the left column fades to 40% and the right column's background cross-fades. */
.home-editzone{display:grid;grid-template-rows:0fr;margin:0 -32px -32px -24px;
  transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),margin .4s cubic-bezier(.22,1,.36,1)}
.home--c.home--d .home-editzone{margin-left:-16px;margin-right:-16px}
.home--c.home--d .home.is-editing .home-editzone,.home--c.home--d.is-editing .home-editzone{margin-top:-8px}
.home-editzone__in{min-height:0;overflow:hidden;visibility:hidden;opacity:0;
  transition:opacity .3s ease,visibility 0s linear .4s}
.home-editzone__add{display:flex;justify-content:center;align-items:flex-start;gap:8px;padding:4px 32px 16px 24px}
.home--c.home--d .home-editzone__add{padding-left:16px;padding-right:16px}
.home.is-editing .home-editzone{grid-template-rows:1fr;margin-top:-16px;margin-bottom:-16px} /* -16: cancels the 16px bottom padding of the add row, kept so the hover glow isn't clipped */
.home.is-editing .home-editzone__in{visibility:visible;opacity:1;transition:opacity .3s ease .08s,visibility 0s}
.home--c .home-col{transition:opacity .35s ease,background-color .35s ease}
@media (prefers-reduced-motion:reduce){
  .home-editzone,.home-editzone__in,.home--c .home-col,.home--c .home-drag{transition:none}
}
/* Add widgets: always the empty dashed container (full width, 56px, 10px corners, 2px dashed outline -
   2px gives longer dashes than a 1px border) with "+ Add widgets" centred inside. Hover shows the same
   glow + tinted border as the Needs you cards. Clicking opens the dropdown: the label fades out and the
   glow stays for as long as the dropdown is open. */
.home-editzone .home-addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;padding:0 !important;
  background:#FBFAFE;border:2px dashed #ECE6F8;color:#7B59C3;font-size:13px;font-weight:var(--fw-medium);
  transition:background .25s ease,box-shadow .15s ease,border-color .15s ease}
button.home-addbtn:not(.ms-tab):not(.wl-tab):not(.wl-view__item):not(#_){border-radius:10px !important}
.home-addbtn svg{width:16px;height:16px;color:#7B59C3}
.home-addbtn__label{display:inline-flex;align-items:center;gap:8px;transition:opacity .2s ease}
.home-addbtn.is-open .home-addbtn__label{opacity:0}
button.home-addbtn:not(.ms-tab):not(.wl-tab):not(.wl-view__item):not(#_):hover,
button.home-addbtn.is-open:not(.ms-tab):not(.wl-tab):not(.wl-view__item):not(#_){
  box-shadow:0 2px 12px rgba(136,85,210,.22);border-color:rgba(136,85,210,.28)}
.home--c .home-cols{flex:1 1 auto;gap:0;align-items:stretch}
/* Solo: outside edit mode, once every widget in the right column is removed, the right column goes away and
   the left one (Needs you, Keep an eye on, Mira handled) stays as a single centred column. */
.home--c.home--solo .home-cols{grid-template-columns:minmax(0,720px);justify-content:center}
.home--c.home--solo .home-cols > .home-col + .home-col{display:none}
.home--c.home--solo .home-col{padding:16px 32px 32px}
.home--c .home-col{padding:16px 24px 32px 32px}
.home--c .home-col + .home-col{padding:16px 32px 32px 24px;border-left:1px solid #ECECED}

/* Section (no container box — it sits directly on the page). Title is the shared mono eyebrow style. */
.home-box{display:flex;flex-direction:column;gap:12px}
.home-box__head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
/* Section titles use the primary font (General Sans via --font) at 16px / 600.
   They are no longer the mono all-caps eyebrow, so the uppercase + tracking and
   the muted colour were dropped; the heading colour (--c-text) is used instead. */
.home-box__title{
  margin:0;font-family:var(--font);
  font-size:16px;font-weight:var(--fw-semibold);color:var(--c-text);
}
.home-box__meta{margin-left:8px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--c-muted)}
.home-box__list{display:flex;flex-direction:column;gap:6px}
.home-ibtn{
  width:24px;height:24px;flex:0 0 24px;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:999px;background:transparent;color:var(--c-muted);
  transition:background .12s ease,color .12s ease;
}
.home-ibtn:hover{background:var(--c-hover);color:var(--c-text)}
.home-ibtn svg{width:16px;height:16px}

/* Item card inside a container (task / watch item). */
.home-card{
  position:relative;background:#fff;border:1px solid var(--c-border);border-radius:10px;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));
  padding:16px;display:flex;flex-direction:column;gap:6px;
}
.home--c .home-card{padding:12px 16px}
/* Compact card: one row = text block (left) · buttons (right, vertically centred) · icons
   (chevron + dismiss X, top-aligned). The expandable detail sits under the row, full width. */
.home-card__row{display:flex;align-items:center;gap:16px}
.home-card__main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.home-card__row > .home-card__actions{flex:0 0 auto;margin-top:0}
.home-card__icons{flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:2px;margin-right:-8px}
/* Single-card panel for the other sections (Mira handled today, Business snapshot):
   white card chrome (border, 10px radius). The open "done" list is divided from the summary line. */
.home-box__panel{background:#fff;border:1px solid var(--c-border);border-radius:10px;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));overflow:hidden}
.home-box__panel--empty{min-height:160px}
/* HR widget (from the HR wireframe): period + segmented progress bar + legend, three stat tiles
   (dashed = figure still to be confirmed, "TBC"), then key/value rows. Brand colours instead of the wireframe's. */
.home-box__panel.home-hr:not(.home-tiles){gap:12px}
.home-hr__period{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-hr__bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.home-hr__bar span{display:block;min-width:0}
.home-hr__legend{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-hr__legend li{display:inline-flex;align-items:center;gap:6px}
.home-hr__legend i{display:block;width:8px;height:8px;border-radius:50%}
.home-hr__stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.home-hr__stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--c-bg);border:1px solid transparent}
.home-hr__stat--tbc{background:#fff;border:1px solid var(--c-border-strong)}
.home-hr__statlabel{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-hr__statvalue{font-size:20px;font-weight:var(--fw-semibold);line-height:1.2;color:var(--c-text)}
.home-hr__rows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.home-hr__rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--c-border);font-size:13px;font-weight:var(--fw-regular);color:var(--c-text)}
.home-hr__val{color:var(--c-muted);text-align:right}
/* Calendar widget: date block on the left, today's events on the right (like the Google Calendar iPhone widget). */
.home-box__panel.home-cal:not(.home-tiles){flex-direction:row;align-items:flex-start;gap:20px}
.home-cal__date{display:flex;flex-direction:column;align-items:flex-start;flex:0 0 auto;min-width:48px}
.home-cal__dow{font-size:12px;font-weight:var(--fw-medium);color:var(--slate);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em} /* = .nav-group__label ("Apps") */
.home-cal__day{font-size:34px;font-weight:var(--fw-semibold);line-height:1.1;letter-spacing:-.02em;color:var(--c-text)}
.home-cal__events{flex:1 1 auto;min-width:0;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.home-cal__event{display:flex;gap:10px;align-items:stretch}
.home-cal__bar{flex:0 0 3px;border-radius:2px;background:var(--cal)}
.home-cal__text{display:flex;flex-direction:column;gap:1px;min-width:0}
.home-cal__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-cal__time{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-box__panel:not(.home-tiles){padding:16px;display:flex;flex-direction:column;gap:12px}
.home-box__panel .home-donelist:not([hidden]){padding-top:12px;border-top:1px solid var(--c-border)}
/* Snapshot tiles: 1px grid gap over a border-coloured ground draws the dividers. */
.home-tiles.home-box__panel{gap:1px;background:var(--c-border)}
.home-tiles.home-box__panel .home-tile{border:0;border-radius:0}
/* Needs-you cards: chevron top-right expands the extra "why" line. Hover state: a soft
   purple glow (same brand-purple tint as the shadows) + tinted border, as in the sketch. */
.home-card__chev{position:absolute;top:12px;right:12px}
.home--c .home-card__chev{position:static}
.home-card__chev.is-open svg{transform:rotate(180deg)}
/* Needs-you cards open on click anywhere on the card (buttons/links excluded, see wireHome).
   The expanded area is .home-card__detail; its content is a placeholder for now. */
.home-card--needs{cursor:pointer}
.home-card__detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--c-border);display:flex;flex-direction:column;gap:8px}
.home-card__detail[hidden]{display:none}
.home-card__why b{font-weight:var(--fw-medium);color:var(--c-text)}
/* Four small info containers (label over value) in the expanded card. */
.home-card__facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.home-fact{border-radius:8px;padding:8px 12px;background:var(--c-bg);display:flex;flex-direction:column;gap:2px;min-width:0;
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
/* Label: caps, and a darker grey than --c-muted so it stays readable on the tile. Tile bg = sidebar (--c-bg). */
.home-fact__label{font-size:11px;font-weight:var(--fw-regular);color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em}
.home-fact__value{font-size:13px;font-weight:var(--fw-regular);color:var(--c-text)}
/* Overdue date: same red as the High badge text */
.home-fact__value--bad{color:var(--c-error)}
.home-badge--source{cursor:pointer;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.home-badge--source:hover{border-color:var(--c-border-strong);color:var(--c-text)}
/* Sources modal (opened from the source badge): dimmed backdrop + centred white panel. */
.home-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(17,17,17,.32)}
.home-modal__panel{width:100%;max-width:600px;max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:20px 24px 20px;box-shadow:0 12px 32px rgba(136,85,210,.14)}
.home-modal__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:0}
.home-modal__title{margin:0;font-size:16px;font-weight:var(--fw-semibold);color:var(--c-text)}
.home-modal__sub{margin-top:2px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-modal__close{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--c-border-strong);border-radius:8px;background:#fff}
.home-modal__sec{margin-top:16px}
.home-modal__label{font-size:11px;font-weight:var(--fw-medium);letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted);margin-bottom:4px}
.home-modal__text{font-size:14px;font-weight:var(--fw-regular);line-height:1.45;color:var(--c-copy)}
/* Grey sources footer box, then a divider and the right-aligned buttons. */
.home-modal__src{display:flex;gap:8px;align-items:flex-start;margin-top:20px;padding:10px 12px;border-radius:8px;background:var(--c-bg);font-size:13px;font-weight:var(--fw-regular);line-height:1.4;color:var(--c-copy)}
.home-modal__src svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}
.home-modal__foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--c-border)}
/* "Talk to Mira" link under the containers: chat icon + the standard underlined link. */
.home-card__talk{align-self:flex-start;display:inline-flex;align-items:center;gap:6px}
.home-card__talk svg{width:16px;height:16px;flex:0 0 16px}
.home-card--needs{transition:box-shadow .15s ease,border-color .15s ease}
.home-card--needs:hover{box-shadow:0 2px 12px rgba(136,85,210,.22);border-color:rgba(136,85,210,.28)}
/* Faint solid red wash inside: the error red (--c-error) at 8%, over the white card.
   Temporarily hidden — uncomment to bring the red background back. */
/* .home-card--risk{background:linear-gradient(rgba(204,52,48,.08),rgba(204,52,48,.08)),#fff} */
/* Footer row: Acknowledge link on the left, Review / primary button on the right. */
.home-card__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.home-card__foot .home-card__actions{margin-top:0}
.home-card__titlewrap{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;padding-right:32px}
/* Layout C: one line — badge, title, due, chevron; the title text wraps inside its own box. */
.home--c .home-card__titlewrap{align-items:flex-start;flex-wrap:nowrap;padding-right:0}
.home--c .home-card__titlewrap .home-badge,.home--c .home-card__titlewrap .home-card__due,.home--c .home-card__titlewrap .home-card__chev{flex:0 0 auto}
.home--c .home-card__titlewrap .home-card__title,.home--c .home-card__titlewrap .home-card__due{line-height:20px}
.home--c .home-card__titlewrap .home-card__chev{margin:-2px 0}
/* Needs-you card (layout C): head row (title · icons), body, then a bottom row with tags/due/source
   on the left and the buttons on the right. */
.home--c .home-card__head{display:flex;align-items:flex-start;gap:12px}
.home--c .home-card__head .home-card__title{flex:1 1 auto;line-height:20px}
.home--c .home-card__head .home-card__icons{align-self:flex-start}
.home--c .home-card__bottom{display:flex;align-items:center;gap:16px;margin-top:6px}
.home--c .home-card__meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.home--c .home-card__tags{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.home--c .home-card__meta .home-badge--source{margin-top:0}
.home--c .home-card__bottom > .home-card__actions{flex:0 0 auto;margin-top:0}
.home-card__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text);min-width:0}
.home-card__due{font-size:14px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-card__body{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-card__why{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-card__actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}

/* Status badge (mono, caps — same as before). */
.home-badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:var(--fw-regular);white-space:nowrap;gap:4px;
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;}
.home-badge svg{width:12px;height:12px;flex:0 0 12px}
.home-badge--warn{background:#f6e7c4;color:#8a6a24}
.home-badge--risk{background:#f8d2d6;color:var(--c-error)}
.home-badge--info{background:#dbe9fb;color:#1f5aa8}
.home-badge--neutral{background:var(--c-border);color:var(--c-copy)}   /* grey tag (e.g. "System") */
.home-badge--ok{background:#e3f6e8;color:#15803d}   /* green: done / added */
/* Workspace tag in the Home header only (and the avatar uses the same pair). */
.home-badge--purple{background:#ece4f8;color:#5b34a0}
/* Source badge under a card's copy: same pill as the header badge, but white inside with a grey border. */
.home-badge--source{background:#fff;border:1px solid var(--c-border);color:var(--c-muted);margin-top:8px}
.home--c .home-badge--source{margin-top:4px}

/* Buttons: outline (secondary) and ink (primary). */
.home-btn{
  height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--c-border-strong);background:#fff;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--c-text);white-space:nowrap;
  transition:background .12s ease,border-color .12s ease;
}
.home-btn:hover{background:var(--c-hover)}
/* Size: default 32px; --lg = 40px for buttons that sit next to an input or a 40px control */
.home-btn--lg{height:40px;padding:0 18px;font-size:14px}
.home-btn--primary{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.home-btn--primary:hover{background:var(--c-ink);opacity:.88}
/* Text links under watch items ("Nudge owners"). */
.home-links{display:flex;gap:16px;margin-top:6px}
.home-links__end{display:flex;gap:16px;margin-left:auto}
.home-link{padding:0 0 1px;border:0;border-bottom:1px solid var(--c-border-strong);background:transparent;font-family:inherit;font-size:14px;color:var(--c-text)}
/* The global rule `button:not(.ms-tab):not(.wl-tab):not(.wl-view__item){border-radius:999px !important}`
   rounds the underline into a curve. Mirror its :not() chain to out-rank it (higher
   specificity wins between two !important rules) so links get a straight underline. */
button.home-link:not(.ms-tab):not(.wl-tab):not(.wl-view__item):not(#_){border-radius:0 !important}
button.home-addmenu__item:not(.ms-tab):not(.wl-tab):not(.wl-view__item):not(#_){border-radius:6px !important}
.home-link:hover{border-bottom-color:var(--c-text)}

/* Mira handled today: one summary line, chevron expands the list. */
.home-sum{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-sum b{font-weight:var(--fw-medium);color:var(--c-text)}
.home-donelist{display:flex;flex-direction:column;gap:9px}
.home-donelist__item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-donelist__item svg{width:15px;height:15px;flex:0 0 15px;color:#16a34a}

/* Business snapshot: 2x2 tiles. */
.home-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.home-tile{border:1px solid var(--c-border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:2px;background:#fff}
.home-tile__value{font-size:28px;font-weight:var(--fw-semibold);letter-spacing:-.01em;line-height:1.15;color:var(--c-text)}
.home-tile__label{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.home-tile__foot{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin-top:8px;font-size:12px}
.home-tile__delta{font-weight:var(--fw-medium)}
.home-tile__delta--good{color:#16a34a}
.home-tile__delta--bad{color:var(--c-risk,var(--c-error))}
.home-tile__source{color:var(--c-copy)}

@media (max-width:960px){
  .home-cols{grid-template-columns:minmax(0,1fr)}
  /* Single column: no vertical divider; the second column gets a horizontal one instead. */
  .home--c .home-col + .home-col{border-left:0;border-top:1px solid #ECECED;padding:16px 32px 32px}
  .home--c .home-col{padding:16px 32px 24px}
  .home--c.home--d .home-col + .home-col{border-top:0;padding:8px 16px 16px}
  .home--c.home--d .home-col{padding:8px 16px 16px}
}
@media (max-width:760px){
  .home-top__title{font-size:24px}
  .home-card__actions{flex-wrap:wrap}
}

/* ---------- Advanced mode (sidebar) ---------- */
/* "Back to app" reads as a side-nav item: borderless, transparent, same type
   size/weight, and the same hover highlight as .navlink. */
.adv-back{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:9px 12px;margin:2px 0 16px;
  border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--slate);
  text-align:left;
  transition:background .12s ease,color .12s ease;
}
.adv-back:hover{background:var(--c-hover);color:var(--ink)}
.adv-back__icon{display:inline-flex;color:var(--slate-icon);transition:transform .16s ease}
.adv-back__icon svg{width:16px;height:16px;display:block}
.adv-back:hover .adv-back__icon{transform:translateX(-2px)}

/* mode section label — matches .nav-group__label ("Apps") in the primary nav */
.adv-sectlabel{
  padding:6px 12px;margin:2px 0 4px;
  font-size:12px;font-weight:var(--fw-medium);color:var(--slate);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;
}

/* mode-switch easing (plays once per transition, then styles settle) */
@keyframes navEnterAdv{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes navEnterApp{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.nav-enter-adv{animation:navEnterAdv .34s cubic-bezier(.22,.61,.36,1) both}
.nav-enter-app{animation:navEnterApp .34s cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){
  .nav-enter-adv,.nav-enter-app{animation:none}
}

/* ---------- Insights (list + shell) ---------- */
/* The list sits straight on the page surface: no card around the table, no grouping.
   Weights follow the --fw-* system: names 500, everything else 400, column headers 500. */
.in{max-width:1320px}

/* ---- Admin Panel screens (People / Tools & access / Monitoring) ----
   Only LAYOUT helpers live here (grids, gaps). Every visual piece reuses an existing
   component: .wl__head, .wl-view (segmented), .wl-ddpill, .wl-search, .wl-newtask,
   .in-table, .home-badge, .home-card, .rt-toggle, .rt-logo, .wl-pill, .home-link, .rt-empty. */
/* ---- Admin Panel: floating "Panel | Architecture" switch + full-screen sitemap ----
   The sitemap is an HTML re-draw (in Binome styling) of the Admin Panel ↔ User Settings sitemap.
   Both live on <body> (see admSyncFloat) so they sit above the whole app, sidebar included. The switch reuses .wl-view. */
.adm-float{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;box-shadow:0 4px 16px rgba(136,85,210,.18);background:#fff;border:1px solid var(--c-border);border-radius:12px;padding:4px}
.adm-float .wl-view{margin:0;background:transparent}
.adm-arch{position:fixed;inset:0;z-index:70;overflow:auto;background:var(--c-bg);padding:48px 56px 96px}
.adm-arch__inner{max-width:1180px;margin:0 auto}
.adm-arch__title{margin:0 0 28px;font-size:28px;font-weight:var(--fw-semibold);letter-spacing:-.01em;color:var(--c-text)}
.adm-arch__grid{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);row-gap:12px;align-items:stretch}
.adm-arch__head{padding:14px 18px;border-radius:10px;background:var(--c-border);color:var(--c-text)}
.adm-arch__head b{display:block;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:var(--fw-medium);text-transform:uppercase;letter-spacing:.06em}
.adm-arch__head span,.adm-arch__box span{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--c-copy)}
.adm-arch__box{padding:14px 18px;border-radius:10px;background:#fff;border:1px solid var(--c-border-strong);box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04))}
.adm-arch__box b{font-size:15px;font-weight:var(--fw-medium);color:var(--c-text)}
.adm-arch__box b i{font-style:normal;font-weight:var(--fw-regular);color:var(--c-muted)}
.adm-arch__box--dashed{border-style:dashed;background:transparent;box-shadow:none}
.adm-arch__arrow{display:flex;align-items:center;justify-content:center;color:var(--c-brand-purple)}
.adm-arch__arrow svg{width:18px;height:18px;display:block}
@media (max-width:900px){.adm-arch{padding:32px 20px 96px}.adm-arch__grid{grid-template-columns:1fr}.adm-arch__arrow{display:none}}
.adm-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.adm-toolbar__end{margin-left:auto}
.adm-toolbar__group{display:flex;align-items:center;gap:10px}
.adm-split{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.adm-split > .adm-col{flex:1 1 340px;min-width:0}
.adm-split > .adm-col--wide{flex:1.4 1 420px}
.adm-sect{margin:0 0 4px;font-size:15px;font-weight:var(--fw-medium);color:var(--c-text)}
.adm-sub{margin:0 0 14px;font-size:13px;color:var(--c-copy)}
.adm-list{display:flex;flex-direction:column;gap:8px}
.adm-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-family:inherit;
  background:#fff;border:1px solid var(--c-border);border-radius:10px;cursor:pointer;transition:border-color .12s ease}
.adm-row:hover{border-color:var(--c-border-strong)}
/* svg() output has no width/height, so every bare icon needs a size here or it fills the container (the "giant icons" bug). */
.adm-row > svg{flex:0 0 16px;width:16px;height:16px;display:block;color:var(--slate-icon)}
.adm-chips .wl-pill svg{width:14px;height:14px;display:block}
.adm .wl-ddpill--bare svg{width:16px;height:16px;display:block}
.adm-row.is-active{border-color:var(--c-brand-purple);background:#faf7fe;box-shadow:0 0 0 1px var(--c-brand-purple)}  /* same selected look as .ms-opt */
.adm-row__main{flex:1 1 auto;min-width:0}
.adm-row__name{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.adm-row__meta{margin-top:2px;font-size:12px;color:var(--c-copy)}
.adm-label{margin:18px 0 8px;font-size:12px;font-weight:var(--fw-medium);color:var(--c-muted);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}
.adm-chips{display:flex;flex-wrap:wrap;gap:8px}
.adm-perm{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--c-border);font-size:14px;color:var(--c-text)}
.adm-person{display:flex;align-items:center;gap:12px}
.adm-person .avatar{flex:0 0 auto}
.adm-note{margin:16px 0 0;font-size:13px;color:var(--c-copy)}
.adm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.adm-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.adm-stat__label{font-size:13px;color:var(--c-copy)}
.adm-stat__value{margin-top:6px;font-size:28px;font-weight:var(--fw-semibold);color:var(--c-text)}
.adm-bars{height:160px;display:flex;align-items:flex-end;gap:10px;margin-top:12px;border-bottom:1px solid var(--c-border)}
.adm-bars span{flex:1 1 0;background:var(--c-brand-purple);opacity:.55;border-radius:4px 4px 0 0}
.adm-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.adm-li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--c-border);font-size:14px;color:var(--c-text)}
.adm-grid2{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
.adm-grid2 > *{flex:1 1 320px;min-width:0}
.in-tablewrap{overflow-x:auto}                       /* only the table may scroll sideways on narrow screens */
.in-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.in-table th{
  padding:0 16px 10px 0;text-align:left;white-space:nowrap;
  font-size:12px;font-weight:var(--fw-medium);color:var(--c-muted);
  border-bottom:1px solid var(--c-border);
}
.in-table td{
  padding:14px 16px 14px 0;white-space:nowrap;vertical-align:middle;
  font-size:14px;font-weight:var(--fw-regular);color:var(--c-copy);
  border-bottom:1px solid var(--c-border);
}
.in-table th:first-child,.in-table td:first-child{width:38%;padding-left:12px}
.in-table tbody tr{transition:background .12s ease}
.in-table tbody tr:hover{background:var(--c-hover)}
.in-table tbody tr.is-clickable{cursor:pointer}
.in-name{font-weight:var(--fw-medium);color:var(--c-text);white-space:normal}   /* row title: 500 */
/* "Made with" chip: neutral outline, same family as the other chips (label = 500) */
.in-chip{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;
  border:1px solid var(--c-border);background:#fff;
  font-size:12px;font-weight:var(--fw-medium);color:var(--c-text);
}
/* No-data state: "No business data connected yet?" + Browse presets */
.in-empty{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:16px 18px;border:1px solid var(--c-border);border-radius:10px;background:#fff;
}
.in-empty__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.in-empty__sub{margin-top:2px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-nomatch{padding:28px 12px;font-size:14px;font-weight:var(--fw-regular);color:var(--c-copy)}

/* ---------- Insight detail: shell + blocks ---------- */
.ind{max-width:1320px}
.ind-crumb{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.ind-crumb button{padding:0;border:none;background:transparent;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.ind-crumb button:hover{color:var(--c-text)}
.ind-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ind-head .wl__title{margin:0}
.ind-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ind-actions .wl-newtask{padding:7px 14px;font-size:13px}
.ind-actions .wl-newtask--secondary{padding:6px 14px}
.ind-more{width:34px;justify-content:center;padding:6px 0 !important}
.ind-more svg{width:16px;height:16px;display:block}
/* meta chips under the title: source, updated + cadence, owner, made with (data = 400, muted) */
.ind-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;padding-bottom:16px;border-bottom:1px solid var(--c-border)}
.in-chip--meta{font-weight:var(--fw-regular);color:var(--c-copy)}
.ind-refresh{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border:none;background:transparent;
  font-size:12px;font-weight:var(--fw-medium);color:var(--c-copy)}
.ind-refresh:hover{background:var(--c-hover)}
.ind-refresh svg{width:13px;height:13px;display:block}
/* filter tabs + saved views on the left, period + Filters on the right */
.ind-controls{margin-top:6px}
.ind-controls .wl-tabsrow{margin-bottom:0;border-bottom:none;padding-top:12px}
.ind-savebtn{align-self:center;margin:0 0 2px 8px;padding:0 10px;height:26px;border:1px solid var(--c-border);background:#fff;
  font-size:12px;font-weight:var(--fw-medium);color:var(--c-copy)}
.ind-savebtn:hover{background:var(--c-hover)}
.ind-tools{display:flex;align-items:center;gap:8px}
.ind-tools .wl-newtask--secondary{padding:6px 14px;font-size:13px}
/* sections: fixed order, small uppercase heading (600) */
.in-sec{margin-top:26px}
.in-sec__title{margin:0 0 12px;font-family:var(--font);font-size:16px;font-weight:var(--fw-semibold);color:var(--c-text)}   /* = Home section titles */
/* The sections sit on one rounded grey surface (Home "containers" look), white cards on it */
.ind-body{display:flex;flex-direction:column;gap:28px;margin-top:20px;padding:8px 16px 16px;background:#FAFAFA;border-radius:12px}
.ind-body .in-sec{margin-top:0}
.ind-body .in-sec__title{margin-top:8px}
/* 6-column row grid: signals span 2, KPI tiles 1, breakdown blocks S=2 / M=3 / L=4 (no free-form grid) */
.in-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.in-blk{
  display:flex;flex-direction:column;min-width:0;padding:16px;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));
}
.in-blk--span2{grid-column:span 2}.in-blk--span3{grid-column:span 3}.in-blk--span4{grid-column:span 4}.in-blk--full{grid-column:1/-1}
.in-blk__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.in-blk__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.in-blk__note{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-ask{padding:3px 10px;border:1px solid var(--c-border);background:#fff;font-size:12px;font-weight:var(--fw-medium);color:var(--c-copy);white-space:nowrap}
.in-ask:hover{background:var(--c-hover)}
/* Mira noticed: signal card = priority badge, title, one-line explanation, footer (owner or task link) */
.in-blk > .home-badge{align-self:flex-start}   /* priority badge hugs its text, not the card width */
.in-blk > .home-badge--risk{background:color-mix(in srgb,var(--c-error) 14%,#fff);color:var(--c-error)}   /* status chips in Insights use the semantic tokens */
.in-blk > .home-badge--warn{background:color-mix(in srgb,var(--chart-warning) 16%,#fff);color:var(--chart-amber-700)}
.in-sig__title{margin:10px 0 4px;font-size:15px;font-weight:var(--fw-medium);color:var(--c-text)}
.in-sig__text{margin:0;font-size:13px;line-height:1.45;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-sig__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px}
.in-sig__who{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
/* KPI tile: label (400), value (600, tabular), sub-line (400) */
.in-kpi{gap:2px;padding:14px 16px;font-variant-numeric:tabular-nums}
.in-kpi__label{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-kpi__value{margin-top:6px;font-size:24px;font-weight:var(--fw-semibold);letter-spacing:-.01em;line-height:1.15;color:var(--c-text)}
.in-kpi__cur{display:block;font-size:12px;font-weight:var(--fw-regular);letter-spacing:0;color:var(--c-muted)}
.in-kpi__sub{margin-top:6px;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-kpi__sub--bad{font-weight:var(--fw-medium);color:var(--c-error)}   /* semantic: always next to a ▼ in the text */
/* Time series: stacked bars, last one is the month still running (lighter) */
.in-ts{display:flex;align-items:flex-end;gap:4px;height:190px;margin-top:auto}
/* One month = a column (the hover target) holding a stack whose height is the month's share of the tallest bar.
   Segments share the stack by their weight (flex-grow) with a 2px surface-coloured gap between them, no stroke.
   Colours come from the series, set inline from the CHART helpers; the partial month is hatched (see chartHatch). */
.in-ts__bar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.in-ts__stack{display:flex;flex-direction:column-reverse;gap:2px}
.in-ts__seg{display:block;width:100%;min-height:0}
/* Legend: any chart with 2+ series gets one. Swatches are the series colours (the partial one is hatched). */
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.chart-legend__item{display:inline-flex;align-items:center;gap:6px}
.chart-legend__sw{width:10px;height:10px;border-radius:2px;flex:0 0 10px}
.in-ts__cap{margin-top:12px;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
/* Ranked list: label · % on one line, a bar under it */
.in-rank{display:flex;flex-direction:column;gap:14px;font-variant-numeric:tabular-nums}
.in-rank__row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-rank__val{color:var(--c-text);font-weight:var(--fw-medium)}
.in-rank__track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--chart-grid)}
.in-rank__track span{display:block;height:100%;border-radius:3px;background:var(--chart-cat-1)}   /* one series = cat-1; parts of a whole get their ramp colour inline */
/* Table block (max 5 rows + See all N) */
.in-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.in-tbl th{padding:0 8px 8px 0;text-align:left;font-size:12px;font-weight:var(--fw-medium);color:var(--c-muted);border-bottom:1px solid var(--c-border)}
.in-tbl td{padding:10px 8px 10px 0;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy);border-bottom:1px solid var(--c-border)}
.in-tbl .is-num{text-align:right}
.in-tbl td:nth-child(2){color:var(--c-text)}
.in-tbl__more{display:flex;justify-content:center;margin-top:14px}
/* About this data: a collapsed row that opens in place */
.in-about{padding:0}
.in-about__btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border:none;background:transparent;text-align:left}
.in-about__title{display:block;font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.in-about__sub{display:block;margin-top:2px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.in-about__chev{display:inline-flex;color:var(--c-muted);transition:transform .15s ease}
.in-about__chev svg{width:16px;height:16px;display:block}
.in-about.is-open .in-about__chev{transform:rotate(180deg)}
.in-about__body{margin:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;list-style:none;font-size:13px;line-height:1.5;font-weight:var(--fw-regular);color:var(--c-copy)}
@media (max-width:900px){
  .in-blk--span2,.in-blk--span3,.in-blk--span4{grid-column:1/-1}
  .in-blk.in-kpi{grid-column:span 3}
  .ind-head,.ind-controls .wl-tabsrow{flex-wrap:wrap}
}

/* ---------- Insights: pin from chat (live preview next to Mira's chat panel) ---------- */
.dc-pin{max-width:640px;padding:24px 16px}
.dc-pin__note{margin:0 0 10px;font-size:13px;color:var(--c-copy)}
.dc-pin .dc-more{display:none}                 /* the ··· menu is for pinned cards; this one is only a preview */
.dc-pin__actions{display:flex;align-items:center;gap:8px;margin-top:16px}
.dc-pin__btn{display:inline-flex;align-items:center;gap:6px}
.dc-pin__chev{display:inline-flex}
.dc-pin__chev svg{width:14px;height:14px;display:block}
.dc-pin .wl-ddmenu{min-width:240px}
.dc-pin .wl-ddmenu__item svg{width:15px;height:15px;flex:0 0 15px}
.dc-pin__name{margin:2px}
/* Ask Mira conversation: the insight card sits inside Mira's message */
/* split chip: pin + caret in one pill (the chip look from .nr__chip) */
.cv-split-wrap{position:relative;display:inline-flex}
.nr__chip--split{padding:0;gap:0;overflow:hidden}
.nr__chip--split button{display:inline-flex;align-items:center;gap:8px;height:100%;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer}
.nr__chip--split button:hover{background:var(--c-hover)}
.nr__chip__main{padding:0 8px 0 12px}
.nr__chip__caret{padding:0 8px;border-left:1px solid var(--c-border) !important;color:var(--slate-icon) !important}
.nr__chip__caret svg{width:14px;height:14px;display:block}
.cv-split-wrap .wl-ddmenu{min-width:220px}
.cv-pinned{cursor:default;gap:6px}
.cv-pinned .home-link{font-size:13px}
.cv-msg{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.cv-card{width:100%;max-width:560px}
.dc--inchat .dc-more{display:none}
.nr__scroll.is-static *{animation:none !important}
.dc-prev{display:flex;flex-direction:column;min-width:0}
.dc-prev .dc{flex:1 1 auto}
.dc--preview .dc-more{display:none}              /* a preview has no ··· menu until it is added */
.dc.rt-card--active{border-color:rgba(136,85,210,.28);box-shadow:0 2px 12px rgba(136,85,210,.22)}   /* the routine edit highlight */

/* ---------- Insights filters (MVP) ----------
   Filter bar under the dashboard header = a row of the existing dropdown pills (.wl-ddpill) + text links (.home-link).
   The card chip and the view switches are the same pills, only sized down to sit in a card header / above its body. */
.dc-filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.dc-filters__actions{display:flex;align-items:center;gap:16px;margin-left:auto}   /* links on the right of the bar */
.dc-switches{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.dc .wl-ddpill{padding:3px 10px;font-size:12px}               /* compact: card header chip and view switches */
.dc__tools .wl-ddmenu{left:auto;right:0}                       /* the chip's menu opens inward, not out of the card */
.dc-rules{margin-top:12px}
/* Drag grip on a dashboard card = the Home widget grip (.home-drag), shown only while editing the layout. It sits OUTSIDE the
   card, on its left edge, centred in the 16px gap between cards (and in the page padding at the left edge), level with the title. */
.dc-page.is-editing .dc .home-drag{display:inline-flex;position:absolute;left:-16px;top:16px;width:16px;height:28px;margin:0;touch-action:none}
.dc.dc--leaving{opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .22s ease,transform .24s ease}   /* the removed block fades out and shrinks a little */
.dc-page.is-editing .dc .dc-more{display:none}   /* editing: the remove minus takes the place of the ··· menu */
.dc-page.is-editing .dc .home-remove{display:inline-flex;opacity:1;pointer-events:auto}
.dc--preview .home-remove{display:none !important}
.dc--preview .home-drag{display:none !important}   /* the block Mira is still building cannot be moved */
.dc-grid{position:relative}
.dc-dropline{left:auto;right:auto}
.dc-dropline.is-glide{transition:left .16s ease-out,top .16s ease-out,width .16s ease-out,height .16s ease-out}   /* the line glides to the next drop spot instead of jumping */
.dc-grid > .dc{transition:opacity .15s ease}   /* position and size are set inline (vertical between side-by-side cards, horizontal otherwise) */
.dc-rules b{font-weight:var(--fw-medium);color:var(--c-text);margin-right:4px}
/* ---------- Insights dashboard: cards, banner, add area ---------- */
.dc-wrap{padding:8px 16px 16px}   /* no grey surface any more: the cards sit straight on the white page */
.dc-grid{align-items:stretch;gap:16px}
/* The card IS the shell: white surface + border, with the header (title, source, ···) as its first row
   and the content below it. (No overflow:hidden here: the open ··· menu has to float out of the card.) */
.dc{position:relative;min-width:0;gap:0}   /* frame comes from .card-shell */
.dc.is-raised,.dc:has(.wl-dd.is-open){z-index:5}                                  /* an open ··· menu floats over the card below */
/* Header = the routine card header (.rt-card__head / __title / __status): 16px card padding, title 14/500 on the
   left, status + ··· on the right. The source sits next to the title as a quiet 12px note. */
.dc .rt-card__head{margin-bottom:12px}
.dc .rt-card__title{margin:0}   /* it is an <h2> here: no browser margins */
.dc-meta .has-tip::after{left:0;right:auto}   /* tooltip of the source logo opens to the right, inside the card */
.dc-meta{flex:0 0 auto;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
/* The inner panel loses its own chrome (border, fill, shadow, padding) so header + body read as one object */
.dc .home-box__panel{flex:1 1 auto;border:0;border-radius:0;background:transparent;box-shadow:none}
.dc .home-box__panel{padding:0}
.dc:has(.rt-card__state:hover){z-index:6}   /* the status tooltip paints over the card below (same as .rt-card) */
/* page frame like Home layout D: 24px outer margin, header row padded, banner above it */
.content:has(> .dc-page){padding:0 24px 24px}
.dc-page .home-top{padding:24px 16px 16px}
.dc-page .dc-banner{margin:24px 0 0}
.dc__tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dc-more{position:relative;display:inline-flex}
.dc-more__btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--slate-icon)}
.dc-more__btn svg{width:18px;height:18px;display:block}
.dc-more__btn:hover,.dc-more.is-open .dc-more__btn{background:var(--c-hover);color:var(--c-text)}
.dc-more .wl-ddmenu{left:auto;right:0;min-width:200px}
.dc-more .wl-ddmenu__item svg{width:15px;height:15px;flex:0 0 15px;display:block;color:var(--slate-icon)}   /* same icon size as the dashboard header menu */
.dc__foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:14px}
.dc__dot{color:var(--c-copy)}
.dc-link{padding:0;border:none;background:transparent;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-link:hover{color:var(--c-text)}
/* Edit mode (gear): the same look and the same smooth opening as Home's edit mode.
   Everything under the page header sits in one pale lavender container (the .dc-wrap that was already there; its
   8/16/16 padding becomes the lavender margin around the cards, so the cards keep the same left/right edges and sizes).
   The container's header = Home's edit bar + the dashed "Add widgets" bar, inside .dc-editzone, which opens like an
   accordion (grid rows 0fr -> 1fr, the same easing as Home) and pushes the cards down. Home's rules are scoped to
   .home, so the few that are needed are repeated here for .dc-page.
   Gap rule: header -> lavender container = header -> first card in normal mode (24px), so the container starts
   8px lower than the wrap does at rest (margin-top below) and the zone cancels the wrap's 8px top padding. */
.dc-wrap{border-radius:12px;transition:background-color .35s ease,margin-top .4s cubic-bezier(.22,1,.36,1)}
.dc-page.is-editing .dc-wrap{background:#FBFAFE;margin-top:8px}
.dc-editzone{display:grid;grid-template-rows:0fr;margin:0 -16px;
  transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1),margin .4s cubic-bezier(.22,1,.36,1)}
.dc-page.is-editing .dc-editzone{grid-template-rows:1fr;margin-top:-8px}
.dc-editzone__in{min-height:0;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .3s ease,visibility 0s linear .4s}
.dc-page.is-editing .dc-editzone__in{visibility:visible;opacity:1;transition:opacity .3s ease .08s,visibility 0s}
.dc-editzone__add{padding:4px 16px 16px}   /* the 16px under the button is the gap to the first card (the glow on hover is not clipped) */
.dc-editzone .home-addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;padding:0 !important;
  background:#FBFAFE;border:2px dashed #ECE6F8;color:#7B59C3;font-size:13px;font-weight:var(--fw-medium);
  transition:background .25s ease,box-shadow .15s ease,border-color .15s ease}
.dc-editzone .home-editbar{position:relative;margin:0;padding:8px 16px 24px;border:0;border-radius:12px 12px 0 0;background:#F4F1FB}
.dc-editzone .home-editbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:#FBFAFE;border-radius:12px 12px 0 0}
.dc-editzone .home-editbar > *{position:relative;z-index:1}   /* text + buttons above the curve */
.dc-editzone .home-editbar__text{font-size:13px;color:#7B59C3}
.dc-editzone .home-editbar .home-btn{background:#fff;border-color:#ECE6F8;color:#7B59C3}
.dc-editzone .home-editbar .home-btn--primary{background:#7B59C3;border-color:#7B59C3;color:#fff}
@media (prefers-reduced-motion:reduce){ .dc-wrap,.dc-editzone,.dc-editzone__in{transition:none} }
/* "About this data": an info icon after the title; the note shows in the same dark tooltip as the gear (.has-tip),
   but left-aligned under the icon and allowed to wrap, since it is a sentence, not a label. */
.dc-info{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:20px;height:20px;padding:0;border:none;background:transparent;color:var(--c-muted)}
.dc-info svg{width:15px;height:15px;display:block}
.dc-info:hover,.dc-info:focus-visible{color:var(--c-text)}
.dc-info.has-tip::after{left:0;right:auto;width:max-content;max-width:280px;white-space:normal;line-height:1.4}
.dc-info.has-tip:focus-visible::after{opacity:1;transform:none}
.dc:has(.dc-info:hover,.dc-info:focus-visible){z-index:6}   /* the tooltip paints over the card below */
.dc-note{margin:14px 0 0;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
/* Key numbers: up to six tiles in one row, no boxes of their own */
.dc-kpis{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:16px 0;font-variant-numeric:tabular-nums}
.dc-kpi{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 16px}
/* Dividers between the numbers (the hairlines of Home's Business snapshot): a line on the left of every tile
   except the first of a row; the first tile keeps no left padding so it lines up with the card title. */
.dc-kpi:first-child{padding-left:0}
.dc-kpi + .dc-kpi{border-left:1px solid var(--c-border)}
.dc-kpi__label{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-kpi__value{margin-top:4px;font-size:22px;font-weight:var(--fw-semibold);letter-spacing:-.01em;color:var(--c-text);white-space:nowrap}
.dc-kpi__sub{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-kpi__sub.is-bad{color:var(--c-error)}   /* semantic: always next to a ▼ in the text */
/* Responsive by the card's own width, not the window's: the Mira side panel narrows the cards without changing the
   viewport, so a media query would not catch it. Wide = every tile in one row; narrower = 3 per row; narrowest = 2.
   A tile that starts a row has no divider and no left padding (it lines up with the card title). */
.dc-panel{container-type:inline-size}
@container (max-width:760px){
  .dc-kpis{grid-template-columns:repeat(min(var(--n,6),3),minmax(0,1fr))}
  .dc-kpi:nth-child(3n+1){padding-left:0;border-left:0}
  .dc-kpi:nth-child(3n+2),.dc-kpi:nth-child(3n){padding-left:16px;border-left:1px solid var(--c-border)}
}
@container (max-width:460px){
  .dc-kpis{grid-template-columns:repeat(min(var(--n,6),2),minmax(0,1fr))}
  .dc-kpi:nth-child(n){padding-left:16px;border-left:1px solid var(--c-border)}
  .dc-kpi:nth-child(2n+1){padding-left:0;border-left:0}
}
/* StageStrip: proportional segments with a small gap, label and count under each */
.dc-stages__line{margin:0 0 14px;font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.dc-stages{display:flex;gap:3px;font-variant-numeric:tabular-nums}
.dc-stage{display:flex;flex-direction:column;gap:6px;min-width:0}
.dc-stage__bar{display:block;height:28px;border-radius:4px}
.dc-stage__label{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-stage__n{font-size:20px;font-weight:var(--fw-semibold);letter-spacing:-.01em;line-height:1.1;color:var(--c-text)}
/* Stats (Tasks, HR): big numbers with a caption under each */
.dc-stats{display:flex;gap:28px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dc-stat{display:flex;flex-direction:column;gap:2px}
.dc-stat__n{font-size:26px;font-weight:var(--fw-semibold);letter-spacing:-.01em;line-height:1.15;color:var(--c-text)}
.dc-stat__label{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-stat__label--link{padding:0;border:none;background:transparent;text-align:left;text-decoration:underline;text-underline-offset:2px;color:var(--c-copy)}
.dc-stat__label--link:hover{color:var(--c-text)}
/* Plain list (Quotes I'm waiting on): name left, age right, hairlines between */
.dc-list{margin:0;padding:0;list-style:none;font-size:13px;font-weight:var(--fw-regular)}
.dc-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;color:var(--c-text);border-top:1px solid var(--c-border)}
.dc-list li:first-child{border-top:none;padding-top:0}
.dc-list__meta{color:var(--c-copy);white-space:nowrap}
/* Chart with a y axis (three gridlines) and a few x labels */
.dc-chart{display:flex;gap:10px;height:210px}
.dc-chart__y{display:flex;flex-direction:column;justify-content:space-between;height:170px;font-size:11px;font-weight:var(--fw-regular);color:var(--c-copy);text-align:right;font-variant-numeric:tabular-nums}
.dc-chart__plot{flex:1;min-width:0}
.dc-chart__bars{display:flex;align-items:flex-end;gap:4px;height:170px;
  background:linear-gradient(var(--chart-grid),var(--chart-grid)) 0 0/100% 1px no-repeat,
             linear-gradient(var(--chart-grid),var(--chart-grid)) 0 33.3%/100% 1px no-repeat,
             linear-gradient(var(--chart-grid),var(--chart-grid)) 0 66.6%/100% 1px no-repeat,
             linear-gradient(var(--chart-grid),var(--chart-grid)) 0 100%/100% 1px no-repeat}
.dc-chart__x{position:relative;height:18px;margin-top:8px;font-size:11px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-chart__x span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dc-chart__x span:first-child{transform:none}
.dc-chart__x span:last-child{transform:translateX(-100%)}
.dc-chart__x--bars span:first-child,.dc-chart__x--bars span:last-child{transform:translateX(-50%)}   /* labels sit centred under their bar, also at the edges */
.dc-kpis-chart{margin-top:20px}   /* chart below the numbers (Email) */
/* Quotes by status: plain bars; when the refresh failed they go grey (old data) */
.dc-bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.dc-bars__col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:8px;min-width:0}
.dc-bars__bar{display:block;background:var(--chart-cat-1);border-radius:2px 2px 0 0}
.dc-bars__label{text-align:center;font-size:11px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-bars.is-stale .dc-bars__bar{background:var(--chart-prior)}   /* old data: the "prior period" grey */
.dc-bars.is-stale{height:140px}
/* Starter banner: ink bar above the header, shown once on a new personal dashboard */
.dc-stale{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c-error) 8%,#fff);font-size:13px;color:var(--c-error)}   /* same token as the ▼ lines and the risk chips */
.dc-stale b{font-weight:600}
.dc-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:12px;background:var(--c-brand-purple);color:#fff}
.dc-banner__title{font-size:14px;font-weight:var(--fw-medium)}
.dc-banner__text{margin-top:2px;font-size:13px;font-weight:var(--fw-regular);color:rgba(255,255,255,.85)}
.dc-banner__btns{display:flex;gap:8px;flex-wrap:wrap}
.dc-banner__btn{height:32px;padding:0 14px;border:1px solid rgba(255,255,255,.5);background:transparent;font-size:13px;font-weight:var(--fw-medium);color:#fff;white-space:nowrap}
.dc-banner__btn:hover{background:rgba(255,255,255,.12)}
.dc-banner__btn--on{border-color:#fff;background:#fff;color:var(--c-brand-purple)}
.dc-banner__btn--on:hover{background:#fff;opacity:.9}
/* "Add something": a dashed card with starter questions (Personal) or a dashed line asking Mira (team) */
.dc-add{margin-top:28px}
.dc-add--card{padding:16px 18px;border:1px dashed var(--c-border-strong);border-radius:10px}
.dc-add__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.dc-add__sub{margin:4px 0 12px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-chips{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  .dc-grid > .dc{grid-column:1/-1 !important}
  .dc-page .home-top{padding:16px 8px}
}

/* ---------- Mira settings (Settings → Mira) ---------- */
.ms{max-width:920px}
.ms-tabs{display:flex;gap:26px;border-bottom:1px solid var(--c-border);margin:22px 0 28px}
.ms-tab{
  display:inline-flex;align-items:center;gap:8px;padding:8px 2px 13px;margin-bottom:-1px;
  border:none;background:transparent;border-bottom:2px solid transparent;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--slate);transition:color .12s ease;
}
.ms-tab:hover{color:var(--ink)}
.ms-tab__icon{display:inline-flex;color:var(--slate-icon)}.ms-tab__icon svg{width:17px;height:17px;display:block}
.ms-tab.is-active{color:var(--c-brand-purple);border-bottom-color:var(--c-brand-purple)}
.ms-tab.is-active .ms-tab__icon{color:var(--c-brand-purple)}

.ms-sect{margin-bottom:24px}
.ms-sect__title{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-size:16px;font-weight:var(--fw-semibold);color:var(--ink)}
.ms-sect__icon{display:inline-flex;color:var(--accent)}.ms-sect__icon svg{width:20px;height:20px;display:block}
.ms-sect__desc{margin:0;font-size:14px;line-height:1.5;color:var(--c-copy);max-width:760px}

.ms-field{margin-bottom:32px}
.ms-label{font-size:15px;font-weight:var(--fw-medium);color:var(--ink);margin-bottom:12px}
.ms-group{margin-bottom:18px}
.ms-group__label{font-size:13px;font-weight:var(--fw-medium);color:var(--slate);margin-bottom:10px}
.ms-group__label span{font-weight:var(--fw-medium);color:var(--slate-icon)}
.ms-options{display:flex;flex-direction:column;gap:10px}
.ms-opt{
  display:flex;align-items:center;gap:13px;padding:14px 17px;cursor:pointer;
  background:#fff;border:1px solid var(--c-border);border-radius:10px;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));transition:border-color .12s ease,background .12s ease;
}
.ms-opt:hover{border-color:var(--c-border-strong)}
.ms-opt:has(.ms-opt__radio:checked){border-color:var(--c-brand-purple);background:#faf7fe;box-shadow:0 0 0 1px var(--c-brand-purple)}
.ms-opt__radio{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;width:18px;height:18px;margin:0;
  border:1.6px solid var(--c-border-strong);border-radius:50%;position:relative;cursor:pointer;transition:border-color .12s ease;
}
.ms-opt__radio:checked{border-color:var(--accent)}
.ms-opt__radio:checked::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ms-opt__body{display:flex;flex-direction:column;gap:2px;min-width:0}
.ms-opt__name{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.ms-opt__meta{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}

.ms-textarea{
  width:100%;min-height:154px;padding:14px 16px;box-sizing:border-box;
  border:1px solid var(--c-border);border-radius:12px;background:#fff;resize:vertical;outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:var(--ink);
}
.ms-textarea::placeholder{color:var(--slate-icon)}
.ms-textarea:focus{border-color:var(--c-border-strong)}
.ms-help{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--c-copy)}
.ms-save{
  padding:12px 28px;border:none;border-radius:11px;background:var(--c-ink);color:#fff;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);transition:background .12s ease;
}
.ms-save:hover{background:var(--c-ink)}

/* Memory tab */
.ms-mem{margin-bottom:30px}
.ms-mem__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ms-mem__title{font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
.ms-mem__sub{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy);margin-top:2px}
.ms-mem__actions{display:flex;gap:8px;flex:0 0 auto}
.ms-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;cursor:pointer;
  background:#fff;border:1px solid var(--c-border);border-radius:9px;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--slate);transition:background .12s ease,color .12s ease;
}
.ms-btn:hover{background:var(--c-bg);color:var(--ink)}
.ms-btn__icon{display:inline-flex;color:var(--slate-icon)}.ms-btn__icon svg{width:15px;height:15px;display:block}
.ms-mem__count{font-size:12px;color:var(--c-copy);margin:14px 0 6px}
.ms-progress{height:3px;width:130px;max-width:40%;background:var(--c-border);border-radius:2px;overflow:hidden;margin-bottom:14px}
.ms-progress>span{display:block;height:100%;background:var(--accent);border-radius:2px}
.ms-mem__box{
  padding:18px 20px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:10px;
  font-size:14px;line-height:1.75;color:var(--ink);
}
.ms-mem__box a{color:var(--ink);text-decoration:underline}

@media (max-width:760px){
  .ms-mem__actions{width:100%}
}

/* Page chat context chip: the share chip without an avatar, so its label gets the inset the avatar would give. */
.rt-panel__head:has(.pg-ctx){flex-wrap:wrap;align-content:flex-start;height:auto;row-gap:0;padding-bottom:15px}   /* 15px under the badge = the 15px from the panel's top edge to the avatar */
.rt-panel__head:has(.pg-ctx) > :not(.pg-ctx){min-height:40px}   /* keep the 40px title row, so "Mira" stays in line with the workspace name */   /* the badge is a second row of the header, under "Mira" */
.pg-ctx{flex:0 0 100%;min-width:0;padding:0 14px 0 0}
.pg-ctx .share-chip{height:28px;padding:0 8px 0 12px;gap:8px;max-width:100%}   /* the share chip's 4px side padding is meant for an avatar; this one has only text */
.pg-ctx__label{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Floating "Ask Mira" ---------- */

.ask-mira{
  position:fixed;z-index:60;overflow:hidden;
  right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:0;
  height:48px;padding:0 13px;border:none;border-radius:999px;
  background:var(--mira-flow) center/cover no-repeat,#c9a8e0;color:#fff;font-family:inherit;font-size:15px;font-weight:var(--fw-medium);
  box-shadow:0 12px 15px rgba(136,85,210,.24),0 2px 3px rgba(136,85,210,.16);
  transition:transform .14s ease,box-shadow .14s ease,padding .22s ease;
}
.ask-mira>*{position:relative;z-index:1}   /* keep icon + label above the hover overlay */
/* Resting state: only the orb (a 48px circle). On hover / keyboard focus the pill grows to the left and shows the label. */
.ask-mira__label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .22s ease,opacity .16s ease,margin .22s ease}
.ask-mira:hover,.ask-mira:focus-visible{padding:0 20px 0 13px}
.ask-mira:hover .ask-mira__label,.ask-mira:focus-visible .ask-mira__label{max-width:240px;opacity:1;margin-left:9px}
@media (prefers-reduced-motion:reduce){ .ask-mira,.ask-mira__label{transition:none} }
.ask-mira__icon{display:inline-flex}
.ask-mira__img{width:22px;height:22px;display:block;border-radius:50%}

@media (max-width:720px){
  .ask-mira{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}

@media (max-width:720px){
  .sidebar{display:none}
  .content{padding:24px 18px 40px}
  .content--chat{padding:0 18px}
  .chat-hero{margin-top:12vh}
}

/* Pill buttons — every button is fully rounded (999px).
   One late, blanket rule so the shape stays consistent as new buttons
   get added. Square icon buttons become circles; wide action buttons
   become stadium-shaped. Applied with !important so it wins over the
   per-class radii declared earlier in this stylesheet.
   Tabs are excluded — the underline tabs (.ms-tab / .wl-tab) and the
   segmented view switcher (.wl-view__item) keep their own squared/
   subtly-rounded shape instead of becoming pills. */
button:not(.ms-tab):not(.wl-tab):not(.wl-view__item){border-radius:999px !important}

/* ---------- Sharing routines: Share modal, share line on cards, notifications ---------- */
.rt-card__share{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.rt-card__share svg{width:14px;height:14px;flex:0 0 14px;color:var(--slate-icon)}
.rt-card__share b{font-weight:var(--fw-medium);color:var(--ink)}
.share-modal .home-modal__panel{max-width:520px;padding:16px}   /* same 16px inset as a routine card */
.share-modal .home-modal__close{border:0}   /* the X sits bare, no outline */
.share-modal .home-modal__head{align-items:center}
/* Pause / delete confirmation: narrow panel, buttons right-aligned; destructive = red. */
.rt-confirm .home-modal__panel{max-width:400px}
.rt-confirm__text{margin-top:8px}
.rt-confirm__foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.home-btn--danger{background:var(--c-error);border-color:var(--c-error);color:#fff}
.home-btn--danger:hover{background:var(--c-error);opacity:.88}
/* Text field (generic): rounded box with a purple focus ring; holds an <input>, optional chips before it and an optional .field__action (e.g. a bare dropdown pill) on the right. */
.field{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--c-border-strong);border-radius:12px;background:#fff;cursor:text}
.field:focus-within{border-color:var(--c-brand-purple);box-shadow:0 0 0 3px rgba(136,85,210,.14)}
.field input{flex:1 1 140px;min-width:100px;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;color:var(--ink);padding:4px 2px}
.share-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px;border-radius:999px;background:#f4effb;color:#5b34a0;font-size:13px;font-weight:var(--fw-medium)}
.share-chip__x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:0;background:transparent;color:#5b34a0;cursor:pointer}
.share-chip__x svg{width:11px;height:11px}
.share-chip__x:hover{background:#e3d8f5}
.share-ava{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#e3d8f5;color:#5b34a0;font-size:10px;font-weight:var(--fw-medium)}
.share-ava svg{width:12px;height:12px}
.share-ava--lg{width:28px;height:28px;font-size:12px}
.share-ava--lg svg{width:15px;height:15px}
.share-modal .wl-tabsrow{margin:8px 0 16px}
.share-modal .home-modal__head + .share-combo{margin-top:16px}   /* no tab row */
/* Input + permission pill + primary button on one row; the suggestions dropdown hangs under the whole row */
.share-combo{position:relative;display:flex;align-items:flex-start;gap:8px}   /* flex-start: when the input grows (chips wrap) the pill and the button keep their height and stay level with its top edge */
.share-combo .home-btn--lg{height:40px;flex:0 0 auto}
/* The permission sits inside the input, on its right edge; the input's own focus ring and border wrap it */
.field__action{margin-left:auto;align-self:center}
.field__action .wl-ddmenu{top:calc(100% + 10px)}   /* clear the field's bottom edge */
.share-note{margin-top:10px}
.share-note{display:flex;align-items:flex-start;gap:6px}
.share-note__ico{flex:0 0 14px;display:inline-flex;margin-top:2px;color:var(--slate-icon)}
.share-note__em{font-weight:var(--fw-medium)}   /* the whose-data phrase stands out (500) */
.share-note__ico svg{width:14px;height:14px;display:block}
/* Copy of an insight whose source the user can't read */
.dc-connect{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:140px;text-align:center;color:var(--c-copy)}
.dc-noaccess{flex:1 1 auto;background:var(--c-hover);border-radius:12px;padding:16px}   /* fills the card body; equal 16px top and bottom, content centred between them */
.dc-noaccess__body{margin:0;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.dc-connect__text{font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
.share-modal[data-tab="copy"] [data-share-only]{display:none}   /* permission pill + "People with access" belong to the Share tab */
/* Suggestions: a dropdown that floats under the input (same surface as .wl-ddmenu) instead of pushing the modal down */
.share-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--c-border);border-radius:12px;box-shadow:0 10px 28px rgba(136,85,210,.12);padding:5px}
.share-opt{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:8px!important;font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--ink);text-align:left;cursor:pointer}
.share-opt:hover{background:var(--c-hover)}
.share-opt__sub{margin-left:auto;font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.share-opt.is-disabled{cursor:default;color:var(--c-muted)}
.share-opt.is-disabled:hover{background:transparent}
.share-opt .share-perm__txt{align-items:flex-start;text-align:left}
.share-empty{padding:10px 8px;font-size:13px;color:var(--c-copy)}
/* Radio tiles — still used by the "Make a copy" modal (Where: Personal / team) */
.share-modes{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.share-mode{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--c-border-strong);border-radius:12px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.share-mode:hover{background:var(--c-hover)}
.share-mode.is-on{border-color:var(--c-brand-purple);background:#faf7fe}
.share-mode__radio{flex:0 0 16px;width:16px;height:16px;margin-top:2px;border:1.5px solid #c9c9c9;border-radius:50%;box-sizing:border-box}
.share-mode.is-on .share-mode__radio{border:5px solid var(--c-brand-purple)}
.share-mode__title{font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
.share-mode__text{margin-top:2px;font-size:13px;font-weight:var(--fw-regular);line-height:1.45;color:var(--c-copy)}
.share-modal .home-modal__panel{overflow:visible}   /* let the permission menu overhang the tiles below */
/* Permission dropdown inside the "Share access" tile (Can edit / Can run) */
.share-perm{flex:0 0 auto;margin-left:auto}
.share-perm .wl-ddmenu{left:auto;right:0;min-width:260px;width:max-content}   /* as wide as its longest line, so every subtext stays on one line */
.share-perm .wl-ddmenu .share-perm__sub{white-space:nowrap}
.share-perm .wl-ddmenu__item{align-items:flex-start;gap:10px;padding:10px}
.share-perm__txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.share-perm__sub{font-size:12px;font-weight:var(--fw-regular);line-height:1.4;color:var(--c-copy)}
/* "People with access": rows sit straight on the modal (no box), one per owner / team / person.
   Each row reuses the permission dropdown above, plus a red "Remove access" at its bottom (same red as the card menu's Delete). */
.share-access{margin-top:16px}
/* Title = the primary nav's "Apps" label (mono, caps, slate) */
.share-access__label{padding:6px 0;margin:0 0 2px;font-size:12px;font-weight:var(--fw-medium);color:var(--slate);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}
.share-access__row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
.share-perm .wl-ddmenu__item--danger{color:var(--c-error)}
.share-perm .wl-ddmenu__item--danger .wl-ddmenu__check{visibility:visible;color:color-mix(in srgb,var(--c-error) 55%,#fff)}   /* trash icon in the check slot, lighter red like the card menu */
.share-perm .wl-ddmenu__item--danger{align-items:center}
.home-btn[disabled]{opacity:.4;cursor:default;pointer-events:none}

.icon-btn--bell{position:relative}
.notif-dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--c-error);box-shadow:0 0 0 2px var(--c-bg,#fff)}
.notif{position:fixed;z-index:1100;width:380px;max-width:calc(100vw - 24px);max-height:min(560px,80vh);overflow:auto;background:#fff;border:1px solid var(--c-border);border-radius:14px;box-shadow:0 12px 32px rgba(136,85,210,.14)}
.notif__head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:15px;font-weight:var(--fw-semibold);color:var(--ink)}
.notif__count{font-size:12px;font-weight:var(--fw-regular);color:var(--c-copy)}
.notif__item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--c-border)}
.notif__body{flex:1;min-width:0}
.notif__text{font-size:14px;font-weight:var(--fw-regular);line-height:1.45;color:var(--ink)}
.notif__text b{font-weight:var(--fw-medium)}
.notif__meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--c-copy)}
.notif__hint{margin-top:6px;font-size:13px;line-height:1.4;color:var(--c-copy)}
.notif__actions{display:flex;gap:8px;margin-top:10px}
.notif__actions .home-btn{padding:6px 14px;font-size:13px}
.notif__done{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.notif__done svg{width:14px;height:14px}
.notif__done--ok{color:#2c7a4b}
</style>
</head>
<body>
<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar__top">
      <span class="brand" aria-label="Binome">
        <svg class="brand__logo" viewBox="0 0 128 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binome">
