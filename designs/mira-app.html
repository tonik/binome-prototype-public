/* ---- Sidebar collapse: the top-row button toggles an icon-only rail (CSS: .sidebar.is-collapsed).
   State is remembered in localStorage (wrapped in try/catch — it can be unavailable). While
   collapsed, hovering a nav item gives it a native tooltip from its label text, since the
   labels themselves are hidden. ---- */
(function(){
  const sb = document.querySelector('.sidebar');
  const btn = sb.querySelector('[data-sidebar-toggle]');
  const set = on => {
    sb.classList.toggle('is-collapsed', on);
    const label = on ? 'Expand sidebar' : 'Collapse sidebar';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
    btn.setAttribute('aria-expanded', String(!on));
    try{ localStorage.setItem('sidebarCollapsed', on ? '1' : '0'); }catch(e){}
  };
  btn.addEventListener('click', () => set(!sb.classList.contains('is-collapsed')));
  sb.addEventListener('mouseover', e => {
    if(!sb.classList.contains('is-collapsed')) return;
    const item = e.target.closest('.navlink, .navrow__main, .adv-back');
    if(!item || item.title) return;
    const lab = item.querySelector('.navlink__label') || item;
    item.title = lab.textContent.trim();
  });
  let saved = null;
  try{ saved = localStorage.getItem('sidebarCollapsed'); }catch(e){}
  if(saved === '1') set(true);
})();

/* ============================================================
   Sharing routines — Share modal + notifications (Craig's two actions)
   Spec: "Share access" = one routine for everyone; "Give them a copy" = independent copy
   that arrives paused. A recipient sees a notification (Accept / Decline); accepting adds the
   routine to their list. All mock data — nothing is sent anywhere.
   ============================================================ */
const SHARE_TEAMS = [
  { id:'t-sales',  name:'Sales Team', members:['Craig','Maria'] },
  { id:'t-ops',    name:'Ops team',   members:['Tom','Jonas'] },
  { id:'t-lead',   name:'Leadership', members:['Anna','Priya'] },
];
/* People can come from any team — the picker is not limited to the current workspace. */
const SHARE_PEOPLE = [
  { id:'p-craig', email:'craig.miller@company.com', name:'Craig Miller',  first:'Craig', team:'Sales Team' },
  { id:'p-maria', email:'maria.lopez@company.com', name:'Maria Lopez',   first:'Maria', team:'Sales Team' },
  { id:'p-tom',   email:'tom.becker@company.com', name:'Tom Becker',    first:'Tom',   team:'Ops team' },
  { id:'p-jonas', email:'jonas.weber@company.com', name:'Jonas Weber',   first:'Jonas', team:'Ops team' },
  { id:'p-anna',  email:'anna.kowalska@company.com', name:'Anna Kowalska', first:'Anna',  team:'Leadership' },
  { id:'p-priya', email:'priya.nair@company.com', name:'Priya Nair',    first:'Priya', team:'Leadership' },
];
const shareInitials = n => n.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
const shareAva = (o, big) => '<span class="share-ava'+(big ? ' share-ava--lg' : '')+'">'+(o.members ? svg('users',2) : shareInitials(o.name))+'</span>';

/* One muted line under the card description: who a routine is shared with, who shared it,
   (a copy has no line: once accepted it is simply the user's own routine). */
function rtShareLineHTML(r){
  if(r.sharedBy)   return '<div class="rt-card__share">'+svg('users',1.8)+'<span>Shared by <b>'+r.sharedBy+'</b></span></div>';
  if(r.sharedWith && r.sharedWith.length) return '<div class="rt-card__share" title="'+r.sharedWith.join(', ')+'">'+svg('users',1.8)+'<span>Shared with <b>'+r.sharedWith.join(', ')+'</b></span></div>';
  return '';
}

/* Who has access to a routine = r.access: [{ id, perm }] where id is a SHARE_TEAMS / SHARE_PEOPLE id and
   perm is 'edit' | 'run'. Copies ("Give them a copy") are independent routines, so they are never listed.
   The card line, the heads-up and the delete wording read the derived fields below, so every change to
   `access` goes through rtSyncShare. */
const shareLookup = id => SHARE_TEAMS.concat(SHARE_PEOPLE).find(x => x.id === id);
function rtSyncShare(r){
  const acc = (r.access || []).map(a => Object.assign({ perm:a.perm }, shareLookup(a.id)));
  const people = new Set();
  acc.forEach(o => o.members ? o.members.forEach(n => people.add(n)) : people.add(o.first));
  r.sharedWith = acc.map(o => o.members ? o.name : o.first);
  r.sharedTeams = acc.filter(o => o.members).map(o => o.name);
  r.sharedCount = acc.length ? people.size + 1 : undefined;   // + the owner
}
/* Only the owner changes access. A routine somebody shared with me (or created for me) is read-only for me. */
const rtIsOwner = r => !r.sharedWithMe;

/* Share modal — reusable: any shareable thing (routine, dashboard, …) opens it with a config object.
   Layout (wireframe "Share flow"): tabs [Share | Send a copy], then one row = people input + permission pill + primary
   button, a one-line note, and (Share tab) "People with access". Suggestions drop down while the user types.
   cfg = {
     title,        // the thing's name, shown at the top next to the X
     noun,         // 'routine' | 'dashboard' …, used in the aria-label
     listName,     // where the thing lives for the recipient ('Routines'), used in the "Remove access" confirm
     afterRemove,  // end of that confirm's sentence: 'run it anymore'
     perms,        // [{ id, label, sub }] — what a person with access may do (differs per kind of thing)
     defaultPerm,  // id preselected in the pill
     notes,        // { share, copy } — the muted line under the row, one per tab
     access,       // [{ id, perm, pending? }] — the item's own array; the modal edits it in place
     isOwner,      // false = permissions are read-only text
     onChange,     // called after access changes (resync the item's derived fields, re-render)
   } */
function openShareModal(cfg){
  const owner = cfg.isOwner, acl = cfg.access, title = cfg.title;
  const permOf = k => cfg.perms.find(p => p.id === k) || { label:'' };
  let picked = [];                         // chosen recipients: person or team objects
  const tabs = cfg.tabs || ['share','copy'];   // one entry = no tab row
  const hasShare = tabs.includes('share');
  let tab = tabs[0];                       // 'share' | 'copy'
  let perm = cfg.defaultPerm || (cfg.perms[0] && cfg.perms[0].id);   // only applies to the Share tab
  let open = false;                        // is the suggestions dropdown showing? (opens when the user starts typing; closes when the field is emptied, on an outside click or on Escape)
  // Permission pill = the app's dropdown pill (.wl-dd + .wl-ddpill); its menu rows carry a title + a muted line.
  const pill = (label, attrs) => '<button type="button" class="wl-ddpill wl-ddpill--bare" '+attrs+' aria-haspopup="menu" aria-expanded="false"><span class="wl-ddpill__value">'+label+'</span><span class="wl-ddpill__chev">'+svg('chevdown',2)+'</span></button>';
  const opt = (p, on, attrs) => '<button type="button" class="wl-ddmenu__item'+(on ? ' is-active' : '')+'" role="menuitemradio" '+attrs+'><span class="wl-ddmenu__check">'+svg('check',2)+'</span><span class="share-perm__txt"><span>'+p.label+'</span><span class="share-perm__sub">'+p.sub+'</span></span></button>';
  const m = document.createElement('div');
  m.className = 'home-modal share-modal';
  m.dataset.tab = tab;
  m.innerHTML =
    '<div class="home-modal__panel" role="dialog" aria-modal="true" aria-label="Share '+cfg.noun+'">'+
      '<div class="home-modal__head">'+
        '<h3 class="home-modal__title">'+title+'</h3>'+
        '<button type="button" class="home-ibtn home-modal__close" data-close aria-label="Close">'+svg('close',2)+'</button>'+
      '</div>'+
      (tabs.length > 1 ? '<div class="wl-tabsrow"><div class="wl-tabs" role="tablist"><button type="button" class="wl-tab is-active" role="tab" data-tab-btn="share">Share</button><button type="button" class="wl-tab" role="tab" data-tab-btn="copy">Send a copy</button></div></div>' : '')+
      '<div class="share-combo">'+
        '<div class="field" data-sf><span data-chips style="display:contents"></span><input type="text" placeholder="Add people or teams…" aria-label="Add people or teams" autocomplete="off">'+
          (hasShare ? '<div class="wl-dd share-perm field__action" data-perm data-share-only>'+pill(permOf(perm).label, 'data-perm-btn')+
            '<div class="wl-ddmenu" role="menu" hidden>'+cfg.perms.map(p => opt(p, p.id === perm, 'data-perm-opt="'+p.id+'"')).join('')+'</div></div>' : '')+
        '</div>'+
        '<button type="button" class="home-btn home-btn--primary home-btn--lg" data-go disabled>'+(tab === 'share' ? 'Share' : 'Send copy')+'</button>'+
        '<div class="share-list" data-list hidden></div>'+
      '</div>'+
      '<div class="home-modal__sub share-note" data-note></div>'+
      (hasShare ? '<div class="share-access" data-access data-share-only hidden></div>' : '')+
    '</div>';
  const input = m.querySelector('input'), list = m.querySelector('[data-list]'),
        chips = m.querySelector('[data-chips]'), go = m.querySelector('[data-go]'),
        note = m.querySelector('[data-note]'), access = m.querySelector('[data-access]');
  const closeMenus = () => m.querySelectorAll('[data-perm] .wl-ddmenu').forEach(x => { x.hidden = true; x.parentNode.classList.remove('is-open'); });
  const joinNames = a => a.length < 2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];   // "Kareem and Sam"
  // "People with access": one row per team / person. Changes apply at once; removing asks first.
  // A person who was just added shows "Pending" until they accept. For a non-owner the permission is plain text, not a dropdown.
  const accRow = a => {
    const o = shareLookup(a.id), sub = o.members ? o.members.length+' people' : o.team;
    const ctl = !owner ? '<span class="share-opt__sub">'+permOf(a.perm).label+'</span>' :
      '<div class="wl-dd share-perm" data-perm>'+pill(permOf(a.perm).label, 'data-acc-btn aria-label="Access for '+o.name+'"')+
        '<div class="wl-ddmenu" role="menu" hidden>'+
          cfg.perms.map(p => opt(p, a.perm === p.id, 'data-acc-opt="'+p.id+'" data-acc-id="'+a.id+'"')).join('')+
          '<div class="wl-ddmenu__sep" role="separator"></div>'+
          '<button type="button" class="wl-ddmenu__item wl-ddmenu__item--danger" role="menuitem" data-acc-remove="'+a.id+'"><span class="wl-ddmenu__check">'+svg('trash')+'</span><span class="share-perm__txt"><span>Remove access</span></span></button>'+
        '</div></div>';
    return '<div class="share-access__row">'+shareAva(o, true)+'<span class="share-perm__txt"><span>'+o.name+(a.pending ? ' <span class="home-badge home-badge--warn">Pending</span>' : '')+'</span><span class="share-perm__sub">'+sub+'</span></span>'+ctl+'</div>';
  };
  const drawAccess = () => {
    if(!access) return;
    access.hidden = !acl.length;
    if(!acl.length) return;
    access.innerHTML = '<div class="share-access__label">People with access</div>'+acl.map(accRow).join('');
  };
  const drawChips = () => {
    chips.innerHTML = picked.map(o =>
      '<span class="share-chip">'+shareAva(o)+o.name+'<button type="button" class="share-chip__x" data-rm="'+o.id+'" aria-label="Remove '+o.name+'">'+svg('close',2.4)+'</button></span>').join('');
    go.disabled = !picked.length;
  };
  // Why someone can't be picked on the Share tab (they are greyed out, not hidden): direct access, or access through a team.
  const lockedWhy = o => {
    if(acl.some(a => a.id === o.id)) return 'Already has access';
    if(!o.members){ const t = acl.map(a => shareLookup(a.id)).find(x => x.members && x.members.includes(o.first)); if(t) return 'Has access via '+t.name; }
    return null;
  };
  const drawList = () => {
    if(!open){ list.hidden = true; return; }
    const q = input.value.trim().toLowerCase();
    const hit = o => !picked.some(p => p.id === o.id) && (o.name.toLowerCase().includes(q) || (o.email || '').includes(q) || (o.team || '').toLowerCase().includes(q));
    const all = SHARE_PEOPLE.filter(hit).concat(SHARE_TEAMS.filter(hit)).map(o => ({ o, why: tab === 'share' ? lockedWhy(o) : null }));
    const rows = all.filter(x => !x.why).concat(all.filter(x => x.why));   // greyed-out rows go last
    list.innerHTML = rows.map(({ o, why }) =>
      '<button type="button" class="share-opt'+(why ? ' is-disabled' : '')+'" data-add="'+o.id+'"'+(why ? ' disabled' : '')+'>'+shareAva(o, true)+
        '<span class="share-perm__txt"><span>'+o.name+'</span><span class="share-perm__sub">'+(why || (o.members ? 'Team · '+o.members.length+' people' : o.email))+'</span></span></button>').join('') ||
      '<div class="share-empty">No one matches “'+input.value.trim().replace(/</g,'&lt;')+'”.</div>';
    list.hidden = false;
  };
  // The line under the field. A note can be a function of the picked permission (the dashboard's changes with Can view / Can edit);
  // the ⓘ icon in front is part of the component and always shows.
  const drawNote = () => {
    const n = cfg.notes[tab], text = typeof n === 'function' ? n(perm) : n;
    note.innerHTML = '<span class="share-note__ico">'+svg('info',2)+'</span>'+'<span>'+text+'</span>';
  };
  const setTab = k => {
    tab = k; m.dataset.tab = k; open = false;
    m.querySelectorAll('[data-tab-btn]').forEach(b => { const on = b.dataset.tabBtn === k; b.classList.toggle('is-active', on); b.setAttribute('aria-selected', on); });
    go.textContent = k === 'share' ? 'Share' : 'Send copy';
    drawNote();
    closeMenus(); drawList();
  };
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key !== 'Escape' || document.querySelector('.rt-confirm')) return;   // the confirm takes Escape first
    if(open){ open = false; drawList(); return; }   // first Escape only folds the dropdown
    close(); };
  m.addEventListener('click', e => {
    if(e.target === m || e.target.closest('[data-close]')) return close();
    const tb = e.target.closest('[data-tab-btn]');
    if(tb) return setTab(tb.dataset.tabBtn);
    // "People with access" rows: toggle a row's menu, change its permission, or remove the person (after a confirm).
    const ab = e.target.closest('[data-acc-btn]');
    if(ab){ const w = ab.closest('[data-perm]'), mn = w.querySelector('.wl-ddmenu'), willOpen = mn.hidden;
      closeMenus(); mn.hidden = !willOpen; w.classList.toggle('is-open', willOpen); ab.setAttribute('aria-expanded', willOpen); return; }
    const ao = e.target.closest('[data-acc-opt]');
    if(ao){ const a = acl.find(x => x.id === ao.dataset.accId), o = shareLookup(a.id);
      if(a.perm !== ao.dataset.accOpt){ a.perm = ao.dataset.accOpt; cfg.onChange();
        shareToast(o.name+' now has “'+permOf(a.perm).label+'”'); }
      drawAccess(); return; }
    const ar = e.target.closest('[data-acc-remove]');
    if(ar){ const o = shareLookup(ar.dataset.accRemove);
      closeMenus();
      // Wording: a team is "Remove access for Ops team?", a person is "Remove Craig’s access?". "They" for people, so no gender is guessed.
      rtConfirm({ title:o.members ? 'Remove access for '+o.name+'?' : 'Remove '+o.first+'’s access?',
        text:'“'+title+'” will disappear from '+(o.members ? 'their' : o.first+'’s')+' '+cfg.listName+' and they won’t be able to '+cfg.afterRemove+'.',
        confirm:'Remove access', danger:true }, () => {
        acl.splice(acl.findIndex(x => x.id === o.id), 1); cfg.onChange(); drawAccess();
        shareToast('Removed access for '+o.name);
      });
      return; }
    // Permission pill above the list: the button toggles the menu, an option sets `perm`.
    const pb = e.target.closest('[data-perm-btn]');
    if(pb){ const w = pb.closest('[data-perm]'), mn = w.querySelector('.wl-ddmenu'), willOpen = mn.hidden;
      closeMenus(); mn.hidden = !willOpen; w.classList.toggle('is-open', willOpen); pb.setAttribute('aria-expanded', willOpen); return; }
    const po = e.target.closest('[data-perm-opt]');
    if(po){ perm = po.dataset.permOpt; const w = po.closest('[data-perm]');
      w.querySelectorAll('[data-perm-opt]').forEach(b => b.classList.toggle('is-active', b === po));
      w.querySelector('.wl-ddpill__value').textContent = permOf(perm).label;
      drawNote(); closeMenus(); return; }
    // a click outside the input + dropdown folds the suggestions
    if(!e.target.closest('.share-combo')){ open = false; drawList(); }
    closeMenus();
    const add = e.target.closest('[data-add]');
    if(add){ const o = SHARE_TEAMS.concat(SHARE_PEOPLE).find(x => x.id === add.dataset.add); picked.push(o); input.value = ''; drawChips(); input.focus(); open = false; drawList(); return; }
    const rm = e.target.closest('[data-rm]');
    if(rm){ picked = picked.filter(o => o.id !== rm.dataset.rm); drawChips(); drawList(); return; }
    if(e.target.closest('[data-sf]')) input.focus();
  });
  // The dropdown appears once the user starts typing and goes away when the field is empty again.
  input.addEventListener('input', () => { open = input.value.trim() !== ''; drawList(); });
  input.addEventListener('keydown', e => { if(e.key === 'Backspace' && !input.value && picked.length){ picked.pop(); drawChips(); drawList(); } });
  go.addEventListener('click', () => {
    if(!picked.length) return;
    const names = picked.map(o => o.members ? o.name : o.first);
    if(tab === 'share'){
      // New people and teams join whoever already has access, each with the permission chosen here.
      // A team gets it at once (it lands in the team's workspace, no acceptance). A person has to accept, so
      // they show as "Pending" until they do. The modal stays open so the result is visible in "People with access".
      picked.forEach(o => acl.push({ id:o.id, perm, pending:!o.members }));
      picked = []; open = false; drawChips(); drawList(); drawAccess();
      cfg.onChange();   // the item resyncs its card line, head count and Mira's heads-up, then the screen redraws
      shareToast('Shared with '+joinNames(names));
    } else {
      // A copy is an independent item: the sender's own is untouched, so there is nothing to resync.
      close();
      shareToast('Copy sent to '+joinNames(names));
    }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
  drawNote();
  drawAccess();
  input.focus();
}
/* Routines' entry point: maps a routine row onto the generic Share modal. */
function openRoutineShare(i){
  const r = RT_ROWS[i];
  if(!r) return;
  if(!r.access) r.access = [];
  openShareModal({
    title:r.workflow.title, noun:'routine', listName:'Routines', afterRemove:'run it anymore',
    perms:[ { id:'edit', label:'Can edit', sub:'Changes apply to everyone' },
            { id:'run',  label:'Can run',  sub:'Gets results, can run it, can’t change it' } ],
    defaultPerm:'edit',
    notes:{ share:'One routine for everyone. Everyone gets the results.', copy:'Their own version. Changes won’t affect yours.' },
    access:r.access, isOwner:rtIsOwner(r),
    onChange:() => { rtSyncShare(r); render(); },
  });
}
/* "Refresh schedule…" (dashboard ··· menu, owner / Can edit): how often the dashboard's insights refresh. The same radio tiles as
   "Make a copy". Saved on the dashboard as `refreshEvery`; Can view people can only press Refresh. */
const INS_REFRESH = [
  { id:'hourly', title:'Every hour',        text:'Always close to live. Uses more of the source’s quota.', toast:'every hour' },
  { id:'daily',  title:'Every day',         text:'Fresh numbers each morning at 07:00.',                  toast:'every day at 07:00' },
  { id:'weekly', title:'Every week',        text:'Every Monday at 07:00.',                                toast:'every Monday at 07:00' },
  { id:'manual', title:'Only when asked',   text:'Refreshes when someone presses Refresh.',               toast:'only when someone presses Refresh' },
];
function openRefreshSchedule(dash){
  let pick = dash.refreshEvery || 'daily';
  const m = document.createElement('div');
  m.className = 'home-modal share-modal';
  m.innerHTML =
    '<div class="home-modal__panel" role="dialog" aria-modal="true" aria-label="Refresh schedule" style="max-width:440px">'+
      '<div class="home-modal__head"><h3 class="home-modal__title">Refresh schedule</h3>'+
        '<button type="button" class="home-ibtn home-modal__close" data-close aria-label="Close">'+svg('close',2)+'</button></div>'+
      '<div class="home-modal__sub" style="margin-top:4px">How often '+rtEsc(insDashLabel(dash.id))+' updates its data.</div>'+
      '<div class="share-modes" role="radiogroup" aria-label="Refresh schedule" data-opts></div>'+
      '<div class="home-modal__foot"><button type="button" class="home-btn" data-close>Cancel</button>'+
        '<button type="button" class="home-btn home-btn--primary" data-save>Save</button></div>'+
    '</div>';
  const opts = m.querySelector('[data-opts]');
  const draw = () => { opts.innerHTML = INS_REFRESH.map(o =>
    '<div class="share-mode'+(o.id === pick ? ' is-on' : '')+'" role="radio" aria-checked="'+(o.id === pick)+'" tabindex="0" data-r="'+o.id+'"><span class="share-mode__radio"></span><span>'+
      '<div class="share-mode__title">'+o.title+'</div><div class="share-mode__text">'+o.text+'</div></span></div>').join(''); };
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  m.addEventListener('click', e => {
    if(e.target === m || e.target.closest('[data-close]')) return close();
    const r = e.target.closest('[data-r]');
    if(r){ pick = r.dataset.r; draw(); return; }
    if(e.target.closest('[data-save]')){
      dash.refreshEvery = pick; close();
      shareToast('Refreshes '+INS_REFRESH.find(o => o.id === pick).toast);
    }
  });
  opts.addEventListener('keydown', e => { const r = e.target.closest('[data-r]'); if(r && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); pick = r.dataset.r; draw(); } });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(m);
  draw();
}
/* Insights' entry point: the same modal for a dashboard (Can edit / Can view; a copy uses the recipient's own data access). */
function openDashboardShare(dash){
  if(!dash.access) dash.access = [];
  openShareModal({
    title:insDashLabel(dash.id), noun:'dashboard', listName:'Insights', afterRemove:'see it anymore',
    perms:[ { id:'edit', label:'Can edit', sub:'Add, remove and change insights' },
            { id:'view', label:'Can view', sub:'Sees the dashboard and can filter it' } ],
    defaultPerm:'view',
    notes:{ share:perm => perm === 'view' ? 'They’ll see data from <span class="share-note__em">your connected sources</span>, even ones they can’t access.'
                                           : 'They’ll see data from <span class="share-note__em">their own connected sources</span>.',
            copy:'Their own version, using their own data access. Numbers may differ.' },
    access:dash.access, isOwner:(dash.role || 'owner') === 'owner',
    onChange:() => {},   // nothing on the dashboard itself depends on who has access (yet)
  });
}
function shareToast(text){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:1200;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--c-ink);color:#fff;font-size:13px;font-weight:var(--fw-medium);box-shadow:0 8px 24px rgba(0,0,0,.18)';
  t.innerHTML = '<span style="display:inline-flex;width:14px;height:14px">'+svg('check',2.4)+'</span>';
  t.appendChild(document.createTextNode(text));
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---- Notifications (bell in the sidebar header) ----
   Two mock notifications, one per action Craig took: he shared a routine to work on together,
   and he sent a copy of another. Accept adds the routine to the user's list; Decline dismisses it. */
const NOTIFS = [
  { id:'n-share', kind:'share', from:'Craig', routine:'Pipeline Review Summary', when:'2 min ago', state:'pending',
    row:{ cat:'sales', where:'Slack · #sales', dest:'slack', uses:['gdrive','linear'], team:'Sales Team',
          desc:'Posts a weekly summary of open deals by stage, with what moved since last week.',
          sharedWithMe:true, sharedBy:'Craig', sharedCount:3,
          trigger:{title:'Weekly', sub:'Every Monday · 9:00'},
          workflow:{title:'Pipeline Review Summary', auto:true, status:'live', text:'Live · every Monday'} } },
  { id:'n-copy', kind:'copy', from:'Craig', routine:'Deal Won Announcements', when:'1 hour ago', state:'pending',
    row:{ cat:'personal', where:'Slack · #wins', dest:'slack', uses:['linear'],
          desc:'Announces every closed-won deal in #wins with the owner and deal size.',
          trigger:{title:'Event', sub:'When a deal is marked won'},
          // Copies arrive paused so the recipient can adjust them before anything is sent.
          workflow:{title:'Deal Won Announcements', auto:true, status:'paused', text:'Paused · adjust it, then switch it on'} } },
];
/* A dashboard shared with the user by a colleague. A person has to accept (teams never see this: it lands in the team's
   workspace). It keeps running on the OWNER's data access, and Can view means filter + manual refresh only. */
NOTIFS.push({ id:'n-dshare', kind:'dshare', from:'Aga', routine:'Pipeline overview', perm:'view', when:'Just now', state:'pending',
  dash:{ label:'Pipeline overview', role:'viewOnly', sharedBy:'Aga', pins:[ { insightId:'key-numbers', size:'L' }, { insightId:'quotes-by-status', size:'S' } ] } });
const notifPending = () => NOTIFS.filter(n => n.state === 'pending').length;
function syncBellDot(){
  const bell = document.querySelector('[data-notif-bell]');
  if(!bell) return;
  let d = bell.querySelector('.notif-dot');
  if(notifPending() && !d){ d = document.createElement('span'); d.className = 'notif-dot'; bell.appendChild(d); }
  else if(!notifPending() && d) d.remove();
}
function notifItemHTML(n){
  const text = n.kind === 'share' || n.kind === 'dshare'
    ? '<b>'+n.from+'</b> shared <b>'+n.routine+'</b> with you'
    : '<b>'+n.from+'</b> sent you a copy of <b>'+n.routine+'</b>';
  const hint = n.kind === 'share'
    ? 'You’ll work on one routine together. Changes apply to everyone.'
    : n.kind === 'dshare' ? (n.perm === 'view' ? 'Can view · it shows the owner’s data. You can filter it and refresh it, but not change it.' : 'Can edit · it shows the owner’s data. Changes apply to everyone.')
    : 'It’s yours to change. It starts paused, so nothing runs until you switch it on.';
  // What is being offered: a routine or a dashboard (a tag before the time).
  const kindBadge = '<span class="home-badge home-badge--neutral">'+({ share:'Routine', copy:'Routine', dshare:'Dashboard' }[n.kind])+'</span>';
  let tail;
  if(n.state === 'pending') tail =
    '<div class="notif__hint">'+hint+'</div>'+
    '<div class="notif__actions"><button type="button" class="home-btn" data-notif-act="decline" data-id="'+n.id+'">Decline</button>'+
    '<button type="button" class="home-btn home-btn--primary" data-notif-act="accept" data-id="'+n.id+'">Accept</button></div>';
  else if(n.state === 'accepted') tail = '<div class="notif__done notif__done--ok">'+svg('check',2.25)+(n.kind === 'dshare' ? 'Accepted · added to your dashboards' : 'Accepted · added to your routines')+'</div>';
  else tail = '<div class="notif__done">Declined</div>';
  return '<div class="notif__item" data-nid="'+n.id+'">'+shareAva({name:n.from}, true)+'<div class="notif__body"><div class="notif__text">'+text+'</div><div class="notif__meta">'+kindBadge+n.when+'</div>'+tail+'</div></div>';
}
function openNotifPanel(bell){
  document.querySelectorAll('.notif').forEach(x => x.remove());
  const p = document.createElement('div');
  p.className = 'notif';
  p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Notifications');
  const draw = () => {
    const k = notifPending();
    p.innerHTML = '<div class="notif__head">Notifications<span class="notif__count">'+(k ? k+' new' : 'All caught up')+'</span></div>'+NOTIFS.map(notifItemHTML).join('');
  };
  draw();
  const r = bell.getBoundingClientRect();
  const collapsed = !!bell.closest('.sidebar.is-collapsed');
  p.style.top = Math.max(8, r.bottom + 8)+'px';
  p.style.left = Math.max(8, Math.min(collapsed ? r.right + 8 : r.left, window.innerWidth - 392))+'px';
  p.addEventListener('click', e => {
    const b = e.target.closest('[data-notif-act]');
    if(!b) return;
    const n = NOTIFS.find(x => x.id === b.dataset.id);
    if(b.dataset.notifAct === 'accept' && n.kind === 'dshare'){
      // The dashboard joins the sidebar list of the workspace the user is in, and opens on it.
      n.state = 'accepted';
      const id = 'shared-'+(++insNewDashSeq);
      IN_DASHBOARDS.push(Object.assign({ id, ws:activeWorkspace, add:'' }, n.dash));
      INS_NAV_DASHBOARDS.push({ id, label:n.dash.label, ws:activeWorkspace });
      insNav = id; insChat = null; inOpenId = null; activeId = 'insights';
      render();
    } else if(b.dataset.notifAct === 'accept'){
      n.state = 'accepted';
      // Lands on top with the entrance effect, and filters are cleared so it is visible at once.
      RT_ROWS.unshift(Object.assign({}, n.row, { _enter:true }));
      rtShow.clear(); rtStatus.clear(); rtTool.clear(); rtQuery = '';
      render();
    } else n.state = 'declined';
    draw(); syncBellDot();
  });
  const close = () => { p.remove(); document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  const onDown = e => { if(!p.contains(e.target) && !bell.contains(e.target)) close(); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('mousedown', onDown);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(p);
}
(function wireNotifications(){
  const bell = document.querySelector('[data-notif-bell]');
  if(!bell) return;
  bell.addEventListener('click', () => {
    if(document.querySelector('.notif')) document.querySelectorAll('.notif').forEach(x => x.remove());
    else openNotifPanel(bell);
  });
  syncBellDot();
})();

/* Floating "Ask Mira": opens the side panel about the page the user is on (see pgOpenPanel). */
document.getElementById('askMira').addEventListener('click', () => pgOpenPanel(null));
</script>
