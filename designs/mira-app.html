/* The thread on screen, if it is this conversation's (a timer may fire after the user went elsewhere). */
function cvScroll(conv){ const el = document.querySelector('[data-cv-scroll]'); return el && el.dataset.cvConv === conv.id ? el : null; }
function cvToEnd(sc){ sc.scrollTop = sc.scrollHeight; }
function cvPush(conv, e){
  conv.entries.push(e);
  const sc = cvScroll(conv);
  if(sc){ sc.insertAdjacentHTML('beforeend', cvWrap(e, conv.entries.length - 1)); cvToEnd(sc); }
}
const cvUser = (conv, text) => cvPush(conv, { role:'user', text });
function cvRepaint(conv, i){
  const sc = cvScroll(conv), el = sc && sc.querySelector('[data-cv-i="'+i+'"]');
  if(el) el.innerHTML = cvEntryInner(conv.entries[i]);
}
/* Mira types for a moment, then `make()` gives her message. */
function cvReply(conv, make){
  const sc = cvScroll(conv);
  if(sc){ sc.insertAdjacentHTML('beforeend', MIRA_TYPING); cvToEnd(sc); }
  setTimeout(() => {
    const s2 = cvScroll(conv), dots = s2 && s2.querySelector(':scope > .mira-typing'); if(dots) dots.remove();
    const msg = make(); if(msg.kind === 'answer') msg.base = msg.insight;   // tweaks are the variants of the first answer
    cvPush(conv, msg);
  }, MIRA_TYPING_MS);
}
function cvStart(text){
  const ch = { id:'q'+(++cvSeq), title:nrTitle(text), group:'Today', conv:{ id:'q'+cvSeq, entries:[], naming:false } };
  CHATS.unshift(ch); addMiraNavItem(ch);
  activeChat = ch.id; render();
  cvAsk(ch.conv, text);
}
function cvAsk(conv, text){
  cvUser(conv, text);
  const m = CV_DATE.exec(text);
  if(m) cvReply(conv, () => ({ role:'mira', kind:'text',   // a one-off fact: an answer, not an insight, so no Pin
    html:'You issued 14 invoices '+(/yesterday/i.test(m[0]) ? '' : 'on ')+rtEsc(m[0])+', worth SAR 212,400 in total.' }));
  else cvReply(conv, () => ({ role:'mira', kind:'answer', insight:cvPickInsight(text), base:null, done:false }));
}
const cvAnswerIdx = conv => conv.entries.map(e => e.kind === 'answer').lastIndexOf(true);
const cvOpen = id => {
  if(id === 'home'){ setActive('home'); return; }
  insNav = id; inOpenId = null; insPin = null; insDraft = null; activeId = 'insights'; render();
};
/* Pins the current answer. `target` = a dashboard id, 'home' or 'new:<name>'. A shared target gets the heads-up first. */
function cvPinTo(conv, target, confirmed){
  const ai = cvAnswerIdx(conv), ans = conv.entries[ai], ins = IN_INSIGHTS[ans.insight];
  const isNew = target.startsWith('new:'), dash = IN_DASHBOARDS.find(d => d.id === target);
  const team = target === 'home' ? null : cvTeam(isNew ? { ws:activeWorkspace } : dash);
  if(team && !confirmed){
    cvReply(conv, () => ({ role:'mira', kind:'text', html:insPinWho(ins.id, isNew ? { ws:activeWorkspace } : dash),
      ui:[ { type:'chips', items:[ { label:'Pin it', act:'pinok', arg:target }, { label:'Cancel', act:'cancel' } ] } ] }));
    return;
  }
  let name = 'Home', openId = 'home';
  if(isNew){
    openId = 'new-'+(++insNewDashSeq); name = target.slice(4);
    IN_DASHBOARDS.push({ id:openId, ws:activeWorkspace, role:'owner', mine:true, add:'chips', pins:[ { insightId:ins.id, size:'S' } ] });
    INS_NAV_DASHBOARDS.push({ id:openId, label:name, ws:activeWorkspace });
  } else if(dash){
    openId = dash.id; name = insDashLabel(dash.id);
    if(!dash.pins.some(p => p.insightId === ins.id)) dash.pins.push({ insightId:ins.id, size:'S' });   // by id, no copy
  }
  const placed = IN_DASHBOARDS.find(d => d.id === openId);
  if(placed){ placed.newPin = { id:ins.id, t:Date.now() }; insLastDash[placed.ws] = placed.id; }
  renderNav();   // a new dashboard joins the sidebar
  ans.pinned = { name, id:openId };   // the pin chip becomes "✓ Pinned to … · Open"
  cvRepaint(conv, ai);
}
function cvAct(conv, btn){
  const act = btn.dataset.cvAct, arg = btn.dataset.cvArg;
  const i = +btn.closest('[data-cv-i]').dataset.cvI, e = conv.entries[i];
  if(act === 'open'){ cvOpen(arg); return; }
  if(act === 'tweak'){ e.insight = arg; cvRepaint(conv, i); return; }   // the card in the message changes in place
  const menu = btn.closest('.wl-ddmenu'); if(menu) menu.hidden = true;
  if(e.kind !== 'answer'){ e.ui = null; cvRepaint(conv, i); }   // a heads-up is answered: its chips go
  if(act === 'pin' || act === 'pin2' || act === 'pinok') cvPinTo(conv, arg, act === 'pinok');
  else if(act === 'home') cvPinTo(conv, 'home', true);
  else if(act === 'newdash'){
    conv.naming = true;
    cvReply(conv, () => ({ role:'mira', kind:'text', html:'What should it be called?' }));
    setTimeout(() => { const inp = document.querySelector('[data-cv-form] .composer__input'); if(inp) inp.focus(); }, MIRA_TYPING_MS + 50);
  }
}
function wireCv(c, conv){
  const sc = c.querySelector('[data-cv-scroll]');
  cvToEnd(sc);
  requestAnimationFrame(() => sc.classList.remove('is-static'));   // old messages do not replay their entrance
  c.addEventListener('click', e => {
    const m = e.target.closest('[data-cv-menu]');   // the caret (or the whole chip when there is no default) opens the other places
    if(m){ const dd = m.closest('.wl-dd'), menu = dd.querySelector('.wl-ddmenu'); menu.hidden = !menu.hidden; dd.querySelector('.nr__chip__caret').setAttribute('aria-expanded', !menu.hidden); return; }
    const b = e.target.closest('[data-cv-act]'); if(b) cvAct(conv, b);
  });
  const onDown = e => {
    if(!c.isConnected){ document.removeEventListener('mousedown', onDown); return; }
    if(!e.target.closest('.cv-split-wrap')) c.querySelectorAll('.cv-split-wrap .wl-ddmenu').forEach(x => { x.hidden = true; });
  };
  document.addEventListener('mousedown', onDown);
  const form = c.querySelector('[data-cv-form]'), input = form.querySelector('input');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const t = input.value.trim(); if(!t) return;
    input.value = '';
    if(conv.naming){ conv.naming = false; cvUser(conv, t); cvPinTo(conv, 'new:'+t, false); } else cvAsk(conv, t);
  });
  input.focus();
}

let insEditing = false;       // edit mode of the dashboard (the gear): lavender container + bar. Layout only for now, the interactions come later.
let insStarterShown = true;   // the "Mira set up a starter dashboard" banner (Personal → My work), until "Looks good"

function dcChart(v){
  // y axis: round the top up to a whole million so the three gridlines read 3.0M / 2.0M / 1.0M
  // `unit:'K'` = values are thousands (the daily series): round the top up to 10K and label the axis 30K / 20K / 10K
  const inK = v.unit === 'K';
  // Counts chart (per-bar pairs, e.g. Email): whole numbers, top rounded up to a multiple of 3 so 3 gridlines are integers.
  const counts = Boolean(v.pairs);
  const top = counts ? Math.max(3, Math.ceil(Math.max.apply(null, v.values) / 3) * 3)
    : inK ? Math.ceil(Math.max.apply(null, v.values) / 10) * 10 : Math.ceil(Math.max.apply(null, v.values) / 1000) * 1000, n = v.values.length;
  const fmt = k => k === 0 ? '0' : counts ? String(Math.round(k)) : inK ? Math.round(k)+'K' : (k / 1000).toFixed(1)+'M';
  const ticks = [top, top * 2/3, top / 3, 0];
  const bars = tsBars(v, top);
  // x labels: every 4th month plus the running one, placed by their share of the width
  const xl = v.xlabels || ['Sep ’24','Jan ’25','May ’25','Sep ’25','Jan ’26','Aug ’26'];
  const xi = xl.map((_, k) => k === xl.length - 1 ? n - 1 : k * (v.xstep || 4));   // xstep = points between labels (monthly default 4)
  return '<div class="dc-chart">'+
    '<div class="dc-chart__y">'+ticks.map(t => '<span>'+fmt(t)+'</span>').join('')+'</div>'+
    '<div class="dc-chart__plot"><div class="dc-chart__bars">'+bars+'</div>'+
      // Counts chart: one label under EVERY bar, centred on it (the others place a few labels by their share of the width).
      (counts ? '<div class="dc-chart__x dc-chart__x--bars">'+v.xlabels.map((l, k) => '<span style="left:'+((k + .5) / n * 100).toFixed(2)+'%">'+rtEsc(l)+'</span>').join('')+'</div></div></div>'
        : '<div class="dc-chart__x">'+xl.map((l, k) => '<span style="left:'+(xi[k]/(n-1)*100).toFixed(1)+'%">'+l+'</span>').join('')+'</div></div></div>')+tsLegend(v);
}

/* StageStrip: one bar split into stages, a reusable block like KpiRow / RankedList.
   view = { line, items:[{ label, n, fields? }] }. Segment widths are proportional to n; the colour is one hue,
   darkest first, in stage order (CHART.getPartColor). The light steps are under 3:1 on white, so the label and
   count sit under every segment and the tooltip (native title) lists the fields: colour never carries it alone. */
function stageStrip(v){
  const keys = v.items.map(x => x.label);
  const total = v.items.reduce((a, x) => a + x.n, 0);
  const seg = x => {
    const tip = x.label+': '+x.n+' of '+total+(x.fields ? '\n'+x.fields.join(', ') : '');
    return '<div class="dc-stage" style="flex:'+x.n+' 1 0" title="'+rtEsc(tip)+'">'+
      '<span class="dc-stage__bar" style="background:'+CHART.getPartColor(x.label, keys)+'"></span>'+
      '<span class="dc-stage__label">'+rtEsc(x.label)+'</span><span class="dc-stage__n">'+x.n+'</span></div>';
  };
  return (v.line ? '<p class="dc-stages__line">'+rtEsc(v.line)+'</p>' : '')+'<div class="dc-stages">'+v.items.map(seg).join('')+'</div>';
}
function dcBody(ins, ctx){
  const v = insViewOf(ins, ctx);   // filterable insights build their view from the filter values in ctx; the others have a fixed view
  if(v.type === 'list' && !v.items.length) return '<p class="dc-note">Nothing matches these filters.</p>';
  // Key numbers style (label, value, sub-line, dividers). `cur:false` = plain counts, no "SAR" before the value.
  // The row has one column per item (--n), so three numbers fill the card instead of sitting in six narrow slots.
  // `v.chart` = an optional chart (a timeseries view) under the numbers; Email uses it for replied vs waiting over the period.
  if(v.type === 'kpis') return '<div class="dc-kpis" style="--n:'+v.items.length+'">'+v.items.map(k =>
    '<div class="dc-kpi"><span class="dc-kpi__label">'+rtEsc(k.label)+'</span>'+
    '<span class="dc-kpi__value">'+(v.cur === false ? '' : 'SAR ')+rtEsc(k.value)+'</span>'+
    (k.sub ? '<span class="dc-kpi__sub'+(k.bad ? ' is-bad' : '')+'">'+rtEsc(k.sub)+'</span>' : '')+'</div>').join('')+'</div>'+
    (v.chart ? '<div class="dc-kpis-chart">'+dcChart(v.chart)+'</div>' : '');
  if(v.type === 'timeseries') return dcChart(v);
  if(v.type === 'stages') return stageStrip(v);
  if(v.type === 'ranked') return inRankedList(v);
  if(v.type === 'table'){
    // Cards are narrow: show the name and the money column only (the first and last of the full table)
    const keep = [1, v.cols.length - 1];
    return '<table class="in-tbl"><thead><tr>'+keep.map(i => '<th'+(v.cols[i].num ? ' class="is-num"' : '')+'>'+(i === 1 ? 'Customer' : v.cols[i].h)+'</th>').join('')+'</tr></thead><tbody>'+
      v.rows.slice(0, IN_MAX.rows).map(r => '<tr>'+keep.map(i => '<td'+(v.cols[i].num ? ' class="is-num"' : '')+'>'+rtEsc(r[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  }
  if(v.type === 'bars') return '<div class="dc-bars'+(ins.stale ? ' is-stale' : '')+'">'+v.items.map(b =>
    '<div class="dc-bars__col"><span class="dc-bars__bar" style="height:'+b.v+'%"></span><span class="dc-bars__label">'+rtEsc(b.label)+'</span></div>').join('')+'</div>';
  if(v.type === 'stats') return '<div class="dc-stats">'+v.items.map(s =>
    '<div class="dc-stat"><span class="dc-stat__n">'+s.n+'</span>'+
    (s.link ? '<button type="button" class="dc-stat__label dc-stat__label--link" data-dc-open="tasks">'+s.label+'</button>' : '<span class="dc-stat__label">'+s.label+'</span>')+'</div>').join('')+'</div>'+
    (v.note ? '<p class="dc-note">'+rtEsc(v.note)+'</p>' : '');
  if(v.type === 'list') return '<ul class="dc-list">'+v.items.map(it =>
    '<li><span>'+rtEsc(it.name)+'</span><span class="dc-list__meta">'+rtEsc(it.meta)+'</span></li>').join('')+'</ul>';
  return '';
}

/* ---- CardShell: the one card frame behind RoutineCard and InsightCard ----
   Frame (border, radius, shadow, padding) + a header row + the content below it.
     title   = HTML for the left of the header (the title element, optional badges / source note)
     right   = HTML for the right of the header (status, actions, ··· menu: whatever the card has)
     body    = the card's content, in its own markup
     cls     = extra classes on the card ('rt-card …' for routines, 'home-box dc' for insights)
     attrs   = extra attributes on the card element (data-*, style)
   The shell knows nothing about routines or insights, so a third kind of card only needs its own body. */
function cardShell({ cls = '', attrs = '', tag = 'div', title, right = '', body = '' }){
  return '<'+tag+' class="card-shell '+cls+'" '+attrs+'>'+
    '<header class="rt-card__head"><span class="rt-card__titlewrap">'+title+'</span>'+right+'</header>'+
    body+
  '</'+tag+'>';
}

/* View switches on an insight card: only these (breakdown, unit) may sit on a card besides its own filter, and they change
   ONLY this card. Same single-choice pill as the filters, but with no "Label:" prefix, so they read as "how to show it". */
function insSwitchesHTML(dash, ins){
  if(!ins.switches || !ins.switches.length) return '';
  return '<div class="dc-switches">'+ins.switches.map(sw => {
    const cur = insSVal(dash, ins, sw);
    return ddPillHTML({ key:'sw:'+ins.id+':'+sw.id, label:'', value:cur, itemsHTML:sw.options.map(o => ddItem(o, o === cur)).join('') });
  }).join('')+'</div>';
}
/* InsightCard: one pinned insight on a dashboard (content = dcBody; the shell supplies frame + header). */
function dcCard(p, dash, extraCls = ''){
  const ins = p.insight, v = ins.view;
  // Icon-only "open in the source app" (external-link arrow, same button as the ···); the label shows as the dark tooltip on hover.
  const open = v.open ? '<button type="button" class="dc-more__btn dc-open has-tip" data-dc-open="'+(v.open.to || '')+'" data-tip="'+rtEsc(v.open.label)+'" aria-label="'+rtEsc(v.open.label)+'">'+svg('external',2)+'</button>' : '';
  // ··· menu = the dashboard header menu: icon + label rows, groups split by dividers. What it offers depends on the
  // dashboard's role (not on who made it): viewOnly can't edit or remove a block.
  const role = dash.role || 'owner', viewOnly = role === 'viewOnly';
  const item = (icon, label, extra) => '<button type="button" class="wl-ddmenu__item" role="menuitem" '+(extra || '')+'>'+svg(icon)+label+'</button>';
  // A single insight is never sent, shared or copied: those actions exist only for a whole dashboard (its header menu).
  const groups = [
    item('pin','Pin to Home','data-dc-act="home"'),
  ];
  if(!viewOnly) groups.push(item('minuscircle','Remove insight','data-dc-act="unpin"'));
  // Edit mode: the ··· is replaced by the purple minus-in-circle of the Home widgets (.home-remove); same action as "Remove insight".
  const removeBtn = viewOnly ? '' : '<button type="button" class="home-remove dc-remove" data-dc-act="unpin" data-tip="Remove insight" aria-label="Remove insight: '+rtEsc(ins.title)+'">'+svg('minuscircle',1.8)+'</button>';
  const menu = removeBtn+'<div class="dc-more"><button type="button" class="dc-more__btn" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for '+rtEsc(ins.title)+'">'+svg('more',2.4)+'</button>'+
    '<div class="wl-ddmenu" role="menu" hidden>'+groups.join('')+'</div></div>';   // no dividers between the rows
  // Footer: "See all N" for tables. "About this data" is no longer here: it is the info icon next to the title.
  const foot = [];
  if(v.type === 'table') foot.push('<button type="button" class="dc-link">See all '+v.total+'</button>');
  const info = ins.about
    ? '<button type="button" class="dc-info has-tip" data-tip="'+rtEsc(ins.about)+'" aria-label="About this data: '+rtEsc(ins.about)+'">'+svg('info',1.8)+'</button>' : '';
  // "Not connected" uses the routine cards' own status (red label + warning icon, dotted underline, dark tooltip) in the header.
  const missing = insMissingSource(ins);   // a copy whose source the user cannot read (see insMissingSource)
  const failStatus = (label, tip, extra) => '<span class="rt-card__status rt-card__status--fail"><span class="rt-card__state" '+(extra || '')+' data-tip="'+rtEsc(tip)+'">'+
        '<span class="rt-card__status-icon">'+svg('warning',2)+'</span><span class="rt-card__status-label">'+label+'</span></span></span>';
  const status = missing ? failStatus('Not connected', 'Connect '+missing+' to see this.') : '';   // a failed refresh has no header status: it is a banner inside the card (staleBanner below)
  // Same header as a routine card: title (and the source) on the left; status, Open in… and ··· on the right.
  // Instead of its numbers, that block shows the error status in the header and a "Connect X to see this" message with the way out.
  // A failed refresh keeps the old numbers and puts a banner at the top of the card body: what happened (semibold) + the way out.
  const staleParts = (ins.stale || '').split('. ');
  const staleBanner = ins.stale ? '<div class="dc-stale" role="status"><span class="dc-stale__text"><b>'+rtEsc(staleParts[0])+'.</b> '+rtEsc(staleParts.slice(1).join('. '))+'</span>'+
    '<button type="button" class="home-btn" data-dc-fix>Fix with Mira</button></div>' : '';
  // The account cannot open the source's data: a grey block (the sidebar's hover grey, no outline) with the way out.
  const panel = ins.noAccess
    ? '<div class="home-box__panel dc-panel"><div class="dc-connect dc-noaccess"><div class="dc-connect__text">You don’t have access to this data</div>'+
        '<p class="dc-noaccess__body">This insight uses '+rtEsc(ins.noAccess)+' data your account can’t open.</p>'+
        '<button type="button" class="home-btn" data-dc-request>Request access in '+rtEsc(ins.noAccess)+' ↗</button></div></div>'
    : missing
    ? '<div class="home-box__panel dc-panel"><div class="dc-connect"><div class="dc-connect__text">Connect '+rtEsc(missing)+' to see this</div>'+
        '<button type="button" class="home-btn" data-dc-connect>Connect '+rtEsc(missing)+'</button></div></div>'
    : '<div class="home-box__panel dc-panel">'+staleBanner+insSwitchesHTML(dash, ins)+dcBody(ins, insCtx(dash, ins))+
        (ins.rules ? '<p class="dc-note dc-rules"><b>Rules</b> '+rtEsc(ins.rules)+'</p>' : '')+
        (foot.length ? '<div class="dc__foot">'+foot.join('<span class="dc__dot">·</span>')+'</div>' : '')+'</div>';
  // A filter that applies to this insight ONLY is a compact chip in the card header (not a bar). Hidden while the block is not connected.
  const ownChips = missing ? '' : (ins.filters || []).map(f => insFilterPillHTML(dash, f, role === 'owner' && f.type !== 'period')).join('');
  return cardShell({
    tag:'section', cls:'home-box dc'+extraCls, attrs:'style="grid-column:span '+p.span+'" data-pin="'+ins.id+'"',
    // The grip is the same .home-drag as on the Home widgets (visible only in edit mode, see .dc-page.is-editing .home-drag).
    title:'<button type="button" class="home-drag" data-dc-drag aria-label="Drag to reorder '+rtEsc(ins.title)+'">'+svg('grip',3.2)+'</button>'+
      '<h2 class="rt-card__title">'+rtEsc(ins.title)+'</h2>'+(p.isNew ? '<span class="home-badge home-badge--purple dc-newbadge">New</span>' : '')+(ins.src && !missing ? '<span class="dc-meta">'+insSrcHTML(ins.src)+(ins.asOf ? ' · '+rtEsc(ins.asOf) : '')+'</span>' : '')+(missing ? '' : info),   // no source chip / info when not connected: the status and the body already name the source
    right:'<div class="dc__tools">'+ownChips+status+open+menu+'</div>',
    body:panel });
}

/* Removing a block, smoothly: the card fades and shrinks a little, then the remaining cards glide to their new places
   (FLIP: measure before, re-render, start each card at its old position and let it transition to the new one). */
function dcRemoveCard(card, dash, id){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish = () => {
    const before = {};
    document.querySelectorAll('.dc[data-pin]').forEach(el => { if(el.dataset.pin !== id) before[el.dataset.pin] = el.getBoundingClientRect(); });
    dash.pins = dash.pins.filter(p => p.insightId !== id); render();
    if(reduce) return;
    const moved = [];
    document.querySelectorAll('.dc[data-pin]').forEach(el => {
      const o = before[el.dataset.pin]; if(!o) return;
      const n = el.getBoundingClientRect(), dx = o.left - n.left, dy = o.top - n.top;
      if(!dx && !dy) return;
      el.style.transition = 'none'; el.style.transform = 'translate('+dx+'px,'+dy+'px)'; moved.push(el);
    });
    if(!moved.length) return;
    moved[0].getBoundingClientRect();   // force a reflow so the start position is painted before the transition begins
    moved.forEach(el => { el.style.transition = 'transform .38s cubic-bezier(.22,1,.36,1)'; el.style.transform = ''; });
    setTimeout(() => moved.forEach(el => { el.style.transition = ''; }), 420);
  };
  if(!card || reduce){ finish(); return; }
  card.classList.add('dc--leaving');
  setTimeout(finish, 240);
}
function dcAddArea(dash){
  if(dash.role === 'viewOnly') return '';   // Can view cannot change the layout, so no "add something" card
  if(dash.add === 'chips') return '<div class="dc-add dc-add--card"><div class="dc-add__title">Add something you want to keep an eye on</div>'+
    '<p class="dc-add__sub">Ask Mira in chat or on Telegram, then pin the answer here.</p>'+
    '<div class="dc-chips"><button type="button" class="home-btn" data-dc-pin>My invoiced sales</button>'+
    '<button type="button" class="home-btn" data-dc-pin>Customers I haven’t contacted</button>'+
    '<button type="button" class="home-btn" data-dc-ask>Ask Mira...</button></div></div>';
  return '';   // the "Add to this dashboard" input was removed
}

/* The whole dashboard body: starter banner (first visit), the card grid, the add area. */
function inDashboardBody(dash){
  const draft = insDraftOf(dash);
  // A card that was just pinned from chat lands at the end with a short highlight and a "New" badge.
  const fresh = p => Boolean(dash.newPin && dash.newPin.id === p.insight.id && Date.now() - dash.newPin.t < 6000);
  let cards = inPinned(dash).map(p => { p.isNew = fresh(p); return dcCard(p, dash, p.isNew ? ' rt-card--enter' : ''); }).join('');
  // The block Mira is building: half width, highlighted like a routine being edited, until "Add to dashboard"
  if(draft && draft.pending) cards += '<div class="dc-prev" style="grid-column:span '+IN_SIZES.S+'">'+
    dcCard({ pin:{ insightId:draft.pending.insightId, size:'S' }, insight:IN_INSIGHTS[draft.pending.insightId], span:IN_SIZES.S }, dash, ' rt-card--active dc--preview')+'</div>';
  return '<div class="dc-wrap">'+
    // Edit-mode header (always rendered, opened by CSS when .dc-page has .is-editing): bar + "Add blocks".
    '<div class="dc-editzone"><div class="dc-editzone__in">'+
      '<div class="home-editbar">'+
        '<span class="home-editbar__text">Remove, reorder or add insights</span>'+
        '<div class="home-editbar__actions"><button type="button" class="home-btn" data-dc-edit-mira>Edit with Mira</button><button type="button" class="home-btn home-btn--primary" data-dc-edit-done>Done</button></div>'+
      '</div>'+
      '<div class="dc-editzone__add"><button type="button" class="home-btn home-addbtn" data-dc-add aria-label="Add blocks" aria-expanded="false"><span class="home-addbtn__label">'+svg('plus',2)+'Add blocks</span></button></div>'+
    '</div></div>'+
    (cards ? '<div class="in-grid dc-grid">'+cards+'</div>' : draft ? insDraftEmptyHTML() : '<p class="in-nomatch">Nothing pinned here yet.</p>')+
    dcAddArea(dash)+'</div>';
}
function inStarterBanner(dash){
  if(!dash.starter || !insStarterShown) return '';
  return '<div class="dc-banner" role="status"><div><div class="dc-banner__title">Mira set up a starter dashboard for you</div>'+
    '<div class="dc-banner__text">Built from your Gmail. Keep it, change it or ask for something else.</div></div>'+
    '<div class="dc-banner__btns"><button type="button" class="dc-banner__btn dc-banner__btn--on" data-dc-keep>Looks good</button>'+
    '<button type="button" class="dc-banner__btn" data-dc-ask>Ask Mira to change it</button></div></div>';
}
function wireDashboard(c, dash){
  const closeMenus = () => c.querySelectorAll('.dc-more.is-open').forEach(m => {
    m.classList.remove('is-open'); m.querySelector('.wl-ddmenu').hidden = true; m.querySelector('.dc-more__btn').setAttribute('aria-expanded','false');
    m.closest('.dc').classList.remove('is-raised');
  });
  document.addEventListener('mousedown', function off(e){
    if(!c.isConnected){ document.removeEventListener('mousedown', off); return; }
    if(!e.target.closest('.dc-more')) closeMenus();
  });
  // `c` is the same element on every render, so the previous render's click handler has to come off first;
  // otherwise each render stacks another one and a single click runs them all (e.g. N copies of a chat message).
  if(c._dcClick) c.removeEventListener('click', c._dcClick);
  c.addEventListener('click', c._dcClick = e => {
    const btn = e.target.closest('.dc-more__btn');
    if(btn){
      const wrap = btn.parentNode, willOpen = !wrap.classList.contains('is-open');
      closeMenus();
      if(willOpen){ wrap.classList.add('is-open'); wrap.querySelector('.wl-ddmenu').hidden = false; btn.setAttribute('aria-expanded','true'); wrap.closest('.dc').classList.add('is-raised'); }
      return;
    }
    const fixBtn = e.target.closest('[data-dc-fix]');
    if(fixBtn){ pgOpenPanel({ insId:fixBtn.closest('.dc').dataset.pin, dashId:dash.id }); return; }   // Fix with Mira: the same side panel as the floating button, scoped to this card
    const act = e.target.closest('[data-dc-act]');
    if(act){
      const id = act.closest('.dc').dataset.pin;
      closeMenus();
      if(act.dataset.dcAct === 'unpin') dcRemoveCard(act.closest('.dc'), dash, id);
      else if(act.dataset.dcAct === 'home') insPinToHome(id, dash);   // (the card menu has no Ask Mira; its only Mira action is Fix with Mira)
      return;
    }
    const bq = e.target.closest('[data-bld-chip]');   // New dashboard: a starter chip starts a block
    if(bq){ insBuildPick(bq.dataset.bldChip); return; }
    // Starter chips: open the pin-from-chat screen with that question already sent.
    const pinQ = e.target.closest('[data-dc-pin]');
    if(pinQ){ insOpenPin({ question:pinQ.textContent }); return; }
    if(e.target.closest('[data-dc-keep]')){ insStarterShown = false; render(); return; }
    if(e.target.closest('[data-dc-ask]')){ setActive('mira'); return; }
    const open = e.target.closest('[data-dc-open]');
    if(open){ if(open.dataset.dcOpen) setActive(open.dataset.dcOpen); return; }   // work lives in Tasks / apps
  });
  // Edit mode: "Edit layout" in the ··· menu and "Done" flip the container (no re-render, so nothing moves or flashes).
  const newBadge = c.querySelector('.dc-newbadge');
  if(newBadge){
    newBadge.closest('.dc').scrollIntoView({ block:'nearest' });
    setTimeout(() => c.querySelectorAll('.dc-newbadge').forEach(b => b.remove()), 5000);   // the highlight is short
  }
  const page = c.querySelector('.dc-page');
  const setEditing = on => { insEditing = on; page.classList.toggle('is-editing', on); };
  c.querySelector('[data-dc-edit-done]').addEventListener('click', () => setEditing(false));
  // Drag to reorder (edit mode): same interaction as the Home widgets. The card dims in place, a ghost copy follows the
  // pointer and a violet line marks the drop position: vertical (centre of a full-width card) = share its row 50:50,
  // horizontal = a row of its own. Dropping rewrites the order and sizes of dash.pins; Escape cancels.
  const grid = c.querySelector('.dc-grid');
  if(grid) c.querySelectorAll('[data-dc-drag]').forEach(h => h.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const card = h.closest('.dc');
    e.preventDefault();
    const rect = card.getBoundingClientRect(), grabX = e.clientX - rect.left, grabY = e.clientY - rect.top;
    const ghost = card.cloneNode(true);
    ghost.classList.add('home-ghost');
    ghost.style.cssText = 'width:'+rect.width+'px;left:'+rect.left+'px;top:'+rect.top+'px';
    document.body.appendChild(ghost);
    card.classList.add('is-dragging');
    document.body.classList.add('is-dragging-widget');
    const line = document.createElement('div'); line.className = 'home-dropline dc-dropline';
    const others = [...grid.querySelectorAll(':scope > .dc[data-pin]')].filter(x => x !== card);
    let target = null;   // { card, before }
    let raf = 0, last = e;
    const onMove = ev => { last = ev; if(!raf) raf = requestAnimationFrame(step); };
    const step = () => {
      raf = 0; const ev = last;
      ghost.style.transform = 'translate3d('+(ev.clientX - grabX)+'px,'+(ev.clientY - grabY)+'px,0)';
      const hit = others.find(x => { const r = x.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; });
      if(!hit) return;   // between cards: keep the last target
      const r = hit.getBoundingClientRect(), g = grid.getBoundingClientRect();
      const wide = r.width >= g.width * .75;   // a card alone in its row
      // Zones: the left / right quarter of a full-width card = join it in one row (50:50, vertical line on the new boundary);
      // anywhere else = a row of its own above / below that row (horizontal line). A row that already has two cards takes no third.
      let zone;
      if(wide && ev.clientX < r.left + r.width * .25) zone = 'left';
      else if(wide && ev.clientX > r.right - r.width * .25) zone = 'right';
      else zone = ev.clientY < r.top + r.height / 2 ? 'before' : 'after';
      const side = zone === 'left' || zone === 'right';
      line.style.cssText = side
        ? 'left:'+(r.left + r.width / 2 - g.left - 2)+'px;top:'+(r.top - g.top)+'px;width:4px;height:'+r.height+'px;margin:0'
        : 'left:0;width:'+g.width+'px;top:'+((zone === 'before' ? r.top - 8 : r.bottom + 8) - g.top - 2)+'px;height:4px;margin:0';
      if(line.parentNode !== grid){ grid.appendChild(line); line.getBoundingClientRect(); line.classList.add('is-glide'); }   // first placement jumps, the next ones glide
      target = { card:hit, zone };
    };
    const finish = drop => {
      document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel); document.removeEventListener('keydown', onKey);
      cancelAnimationFrame(raf); line.remove(); ghost.remove(); card.classList.remove('is-dragging'); document.body.classList.remove('is-dragging-widget');
      if(drop && target){
        // Take the card out of its row, put it in its new place, then size every row again: one card = L, two = S + S.
        const rows = inRows(dash.pins).map(row => row.filter(x => x.insightId !== card.dataset.pin)).filter(row => row.length);
        const pin = dash.pins.find(x => x.insightId === card.dataset.pin);
        const at = rows.findIndex(row => row.some(x => x.insightId === target.card.dataset.pin));
        if(target.zone === 'before') rows.splice(at, 0, [pin]);
        else if(target.zone === 'after') rows.splice(at + 1, 0, [pin]);
        else rows[at].splice(target.zone === 'left' ? 0 : 1, 0, pin);
        dash.pins.length = 0;
        rows.forEach(row => row.forEach(x => { x.size = row.length === 2 ? 'S' : 'L'; dash.pins.push(x); }));
        // FLIP: remember where every card was, re-render, then slide each card from its old box to its new one.
        const before = new Map([...grid.querySelectorAll(':scope > .dc[data-pin]')].map(x => [x.dataset.pin, x.getBoundingClientRect()]));
        render();
        document.querySelectorAll('.dc-grid > .dc[data-pin]').forEach(x => {
          const a = before.get(x.dataset.pin); if(!a) return;
          const b = x.getBoundingClientRect();
          if(Math.abs(a.left - b.left) < 1 && Math.abs(a.top - b.top) < 1 && Math.abs(a.width - b.width) < 1) return;
          x.animate([{ transform:'translate('+(a.left - b.left)+'px,'+(a.top - b.top)+'px) scale('+(a.width / b.width)+','+(a.height / b.height)+')', transformOrigin:'0 0' },
                     { transform:'none', transformOrigin:'0 0' }], { duration:320, easing:'cubic-bezier(.22,1,.36,1)' });
        });
      }
    };
    const onUp = () => finish(true), onCancel = () => finish(false), onKey = ev => { if(ev.key === 'Escape') finish(false); };
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel); document.addEventListener('keydown', onKey);
    step();
  }));
  // Edit with Mira: opens the Mira chat side panel next to the dashboard (edit mode stays on)
  c.querySelector('[data-dc-edit-mira]').addEventListener('click', () => { insChat = 'edit'; insDraft = null; render(); });
  // Share: the shared Share modal, configured for a dashboard
  // Refresh now (mock): the label says "Refreshing…", then "just now". Allowed for every role.
  const rfBtn = c.querySelector('[data-dc-refresh]');
  if(rfBtn && dash) rfBtn.addEventListener('click', () => {
    const lab = c.querySelector('[data-dc-refreshed]');
    rfBtn.disabled = true; lab.textContent = 'Refreshing…';
    setTimeout(() => { dash.refreshed = 'just now'; lab.textContent = 'Last refreshed just now'; rfBtn.disabled = false; shareToast('Refreshed'); }, 700);
  });
  const shareBtn = c.querySelector('[data-dc-share]');
  if(shareBtn && dash) shareBtn.addEventListener('click', () => openDashboardShare(dash));
  const reportBtn = c.querySelector('[data-dc-report]');
  if(reportBtn && dash) reportBtn.addEventListener('click', () => { insChat = 'summary'; insDraft = null; render(); });
  // ··· menu (same open/close behaviour as the routine cards' menu)
  const more = c.querySelector('[data-dc-more]');
  if(more){
    const mbtn = more.querySelector('.rt-more__btn'), mmenu = more.querySelector('.wl-ddmenu');
    const closeMore = () => { more.classList.remove('is-open'); mmenu.hidden = true; mbtn.setAttribute('aria-expanded','false'); };
    mbtn.addEventListener('click', e => {
      e.stopPropagation();
      if(!mmenu.hidden){ closeMore(); return; }
      mmenu.hidden = false; more.classList.add('is-open'); mbtn.setAttribute('aria-expanded','true');
      const onDown = ev => { if(!ev.target.closest('[data-dc-more]')){ closeMore(); cleanup(); } };
      const onKey = ev => { if(ev.key === 'Escape'){ closeMore(); cleanup(); } };
      const cleanup = () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
      document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey);
    });
    mmenu.querySelectorAll('[data-dc-menu]').forEach(it => it.addEventListener('click', e => {
      e.stopPropagation(); closeMore();
      const act = it.dataset.dcMenu;
      if(act === 'layout') setEditing(true);
      else if(act === 'schedule') openRefreshSchedule(dash);
      else if(act === 'summary'){ insChat = 'summary'; insDraft = null; render(); }
      else if(act === 'copy') insMakeCopy(dash);
      else if(act === 'delete'){
        const name = insDashLabel(dash.id);
        rtConfirm({ title:'Delete '+rtEsc(name)+'?',
          text: dash.sharedWith ? 'This deletes it for everyone on '+rtEsc(dash.sharedWith)+'.' : 'This can’t be undone.',
          confirm:'Delete dashboard', danger:true }, () => {
          IN_DASHBOARDS.splice(IN_DASHBOARDS.indexOf(dash), 1);
          INS_NAV_DASHBOARDS.splice(INS_NAV_DASHBOARDS.findIndex(x => x.id === dash.id), 1);
          insChat = null; insNav = insFirstDashboard(); render();
        });
      }
    }));
  }
  const inp = c.querySelector('[data-dc-askinput]');
  if(inp) inp.addEventListener('keydown', e => { if(e.key === 'Enter' && inp.value.trim()) setActive('mira'); });
}

/* ---- Blocks (each returns HTML; step 3 will arrange them from a layout) ---- */
function inSignalBlock(sg){
  const badge = '<span class="home-badge home-badge--'+(sg.pri === 'High' ? 'risk' : 'warn')+'">'+sg.pri+'</span>';
  const action = sg.foot.action === 'Open task'
    ? '<button type="button" class="in-ask" data-in-task>Open task</button>'   // work to do lives in Tasks
    : '<button type="button" class="in-ask">'+sg.foot.action+'</button>';
  return '<article class="in-blk in-blk--span2">'+badge+
    '<h3 class="in-sig__title">'+rtEsc(sg.title)+'</h3>'+
    '<p class="in-sig__text">'+rtEsc(sg.text)+'</p>'+
    '<div class="in-sig__foot"><span class="in-sig__who">'+rtEsc(sg.foot.who)+'</span>'+action+'</div>'+
  '</article>';
}
function inKpiBlock(k){
  return '<div class="in-blk in-kpi">'+
    '<span class="in-kpi__label">'+rtEsc(k.label)+'</span>'+
    '<span class="in-kpi__value"><span class="in-kpi__cur">SAR</span>'+rtEsc(k.value)+'</span>'+
    '<span class="in-kpi__sub'+(k.bad ? ' in-kpi__sub--bad' : '')+'">'+rtEsc(k.sub)+'</span>'+
  '</div>';
}
function inBlockHead(title, note){
  return '<div class="in-blk__head"><span class="in-blk__title">'+rtEsc(title)+'</span>'+
    (note || '<button type="button" class="in-ask">Ask Mira about this</button>')+'</div>';
}
function inTimeSeriesBlock(b){
  const max = Math.max.apply(null, b.values);
  const bars = tsBars(b, max);
  return '<section class="in-blk in-blk--span'+IN_SIZE_SPAN[b.size]+'">'+inBlockHead(b.title)+
    '<div class="in-ts">'+bars+'</div><div class="in-ts__cap">'+rtEsc(b.caption)+'</div>'+tsLegend(b)+'</section>';
}
/* Ranked list. `parts:true` = the rows are parts of one whole (divisions of revenue): each row gets its ramp colour,
   by key, so the same division has the same colour here and in the time series. Otherwise it is one series = cat-1. */
function inRankedList(b){
  if(!b.items.length) return '<p class="dc-note">Nothing matches these filters.</p>';   // e.g. Division = Automation + Customer = Arabian Falcon
  const keys = b.items.map(it => it.key || it.label);
  return '<div class="in-rank">'+b.items.map(it => {
    const color = b.parts ? CHART.getPartColor(it.key || it.label, keys) : CHART.v('cat-1');
    return '<div class="in-rank__row"><span>'+rtEsc(it.label)+'</span><span class="in-rank__val">'+rtEsc(it.text != null ? it.text : it.pct+'%')+'</span>'+
      '<span class="in-rank__track"><span style="width:'+it.pct+'%;background:'+color+'"></span></span></div>';
  }).join('')+'</div>';
}
function inRankedBlock(b){
  return '<section class="in-blk in-blk--span'+IN_SIZE_SPAN[b.size]+'">'+inBlockHead(b.title)+inRankedList(b)+'</section>';
}
function inTableBlock(t){
  const head = t.cols.map(c => '<th'+(c.num ? ' class="is-num"' : '')+'>'+c.h+'</th>').join('');
  const body = t.rows.slice(0, IN_MAX.rows).map(r =>
    '<tr>'+r.map((v, i) => '<td'+(t.cols[i].num ? ' class="is-num"' : '')+'>'+rtEsc(v)+'</td>').join('')+'</tr>').join('');
  return '<section class="in-blk in-blk--full">'+
    inBlockHead(t.title, '<span class="in-blk__note">'+rtEsc(t.note)+'</span>')+
    '<table class="in-tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>'+
    '<div class="in-tbl__more"><button type="button" class="in-ask">See all '+t.total+'</button></div></section>';
}
function inAboutBlock(a){
  return '<section class="in-blk in-blk--full in-about" data-in-about>'+
    '<button type="button" class="in-about__btn" aria-expanded="false">'+
      '<span><span class="in-about__title">About this data</span><span class="in-about__sub">'+rtEsc(a.sub)+'</span></span>'+

function inSection(title, inner){

/* a dropdown menu row (radio-style single choice) */
function ddItem(label, active){

    '<span class="wl-ddmenu__check">'+svg('check',2.25)+'</span>'+label+

/* "Clear" row closing a filter menu — only offered while something is selected. This replaces
   the old "All" item: with nothing selected the filter is simply off, and the pill says
   just its name (see rtFilterPill). data-val is a sentinel the pick handlers look for. */
function ddClearItem(){

/* Pill text for a filter: nothing selected → just the name ("Status"); otherwise
   "Status: Failing" / "Status: 2 selected". */
function rtFilterPill(name, labels){
  return labels.length === 0 ? { label:name, value:'' }
       : { label:name+':', value: labels.length === 1 ? labels[0] : labels.length+' selected' };
}
/* a dropdown pill: optional "Label:" prefix, a value, a chevron, and a menu.
   itemsHTML is a run of ddItem(...) strings. */

    '<button type="button" class="wl-ddpill" aria-haspopup="menu" aria-expanded="false">'+
      (o.label ? '<span class="wl-ddpill__label">'+o.label+'</span>' : '')+

/* Wire a collapsible search inside `panel`: clicking the magnifier expands the
   input and focuses it; leaving it empty collapses it on blur. */
function wireCollapsibleSearch(panel){
  const search = panel.querySelector('[data-search]');
  if(!search) return;
  const input = search.querySelector('.wl-search__input');
  const btn   = search.querySelector('.wl-search__btn');
  btn.addEventListener('click', () => {
    search.classList.add('is-open');
    btn.setAttribute('aria-expanded','true');
    input.removeAttribute('tabindex');
    input.focus();
  });
  // × button: clears the text, fires a normal 'input' event so whatever listens (e.g. the
  // Routines filter) updates, and keeps the focus in the box. mousedown is cancelled so
  // the input doesn't blur (and collapse) before the click lands.
  const clear = search.querySelector('.wl-search__clear');
  const syncClear = () => search.classList.toggle('has-value', input.value.length > 0);
  input.addEventListener('input', syncClear);
  clear.addEventListener('mousedown', e => e.preventDefault());
  clear.addEventListener('click', () => {
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles:true }));
    input.focus();
  });
  input.addEventListener('blur', () => {
    if(!input.value.trim() && !search.hasAttribute('data-pinned')){   // data-pinned = stays open (routine library)
      search.classList.remove('is-open');
      btn.setAttribute('aria-expanded','false');
      input.setAttribute('tabindex','-1');
    }
  });
}

/* Multi-select dropdown (the Routines "Show:" pill, marked data-multi): clicking an
   option does NOT close the menu — it just reports the pick via onPick(label) and the
   caller toggles state and re-renders. openNow reopens the menu after that re-render so
   several options can be ticked in a row. Outside click / Escape closes it. */
function wireMultiDropdown(panel, key, onPick, openNow){
  const dd = panel.querySelector('.wl-dd[data-multi][data-dd="'+key+'"]');
  if(!dd) return;
  const pill = dd.querySelector('.wl-ddpill');
  const menu = dd.querySelector('.wl-ddmenu');
  const onDocClick = e => { if(!e.target.closest('.wl-dd[data-multi][data-dd="'+key+'"]')) close(); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  function close(){
    menu.hidden = true;
    pill.setAttribute('aria-expanded','false');
    dd.classList.remove('is-open');
    document.removeEventListener('mousedown', onDocClick);
    document.removeEventListener('keydown', onKey);
  }
  function open(){
    menu.hidden = false;
    pill.setAttribute('aria-expanded','true');
    dd.classList.add('is-open');
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
  }
  pill.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
  menu.querySelectorAll('.wl-ddmenu__item').forEach(item =>
    item.addEventListener('click', e => { e.stopPropagation(); onPick(item.dataset.val); }));
  if(openNow) open();
}

/* Wire all .wl-dd dropdown pills inside `panel`: open on click, pick one option,
   close (outside click / Escape also closes). The chosen value is written into
   the pill's [data-dd-value]. If onPick(ddKey, value) is given it fires on each
   selection — Routines uses it to actually filter; Tasks leaves it visual. */
function wireDropdownPills(panel, onPick){
  const dds = [...panel.querySelectorAll('.wl-dd:not([data-multi])')];
  if(!dds.length) return;
  const onDocClick = e => { if(!e.target.closest('.wl-dd:not([data-multi])')) closeDd(); };
  const onKey = e => { if(e.key === 'Escape') closeDd(); };
  function closeDd(){
    dds.forEach(dd => {
      dd.querySelector('.wl-ddmenu').hidden = true;
      dd.querySelector('.wl-ddpill').setAttribute('aria-expanded','false');
      dd.classList.remove('is-open');
    });
    document.removeEventListener('mousedown', onDocClick);
    document.removeEventListener('keydown', onKey);
  }
  dds.forEach(dd => {
    const pill  = dd.querySelector('.wl-ddpill');
    const menu  = dd.querySelector('.wl-ddmenu');
    const value = dd.querySelector('[data-dd-value]');
    pill.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = menu.hidden;
      closeDd();
      if(willOpen){
        menu.hidden = false;
        pill.setAttribute('aria-expanded','true');
        dd.classList.add('is-open');
        document.addEventListener('mousedown', onDocClick);
        document.addEventListener('keydown', onKey);
      }
    });
    menu.querySelectorAll('.wl-ddmenu__item').forEach(item =>
      item.addEventListener('click', () => {
        menu.querySelectorAll('.wl-ddmenu__item').forEach(x => {
          x.classList.remove('is-active'); x.setAttribute('aria-checked','false');
        });
        item.classList.add('is-active'); item.setAttribute('aria-checked','true');
        if(value) value.textContent = item.dataset.val;
        closeDd();
        if(onPick) onPick(dd.dataset.dd, item.dataset.val);
      }));
  });
}

/* Side-nav highlight glide: render() rebuilds every nav link, so a CSS transition on the active
   background can't run. Instead we remember where the old active link was, re-render, then slide
   a floating copy of the highlight (same fill + radius) from the old rect to the new link's rect -
   the same ease-out quint as the Home edit-mode motion. The new link's own background stays off
   while the copy travels so there is never a double highlight. Only plain nav links take part
   (the gradient "Ask Mira" pill and mode switches keep their own transitions). */
function glideNavHighlight(fromRect){
  const to = document.querySelector('.sidebar .navlink.is-active');
  document.querySelectorAll('.nav-glide').forEach(g => g.remove());   /* a glide still running: drop it */
  if(!to || !fromRect) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r0 = to.getBoundingClientRect();
  if(Math.abs(r0.top - fromRect.top) < 1 && Math.abs(r0.left - fromRect.left) < 1) return;   /* same row: nothing to move */
  const g = document.createElement('div');
  g.className = 'nav-glide';
  document.body.appendChild(g);
  to.classList.add('is-gliding');
  const done = () => {
    g.remove();
    /* hand the fill back to the link without its .12s background fade, or it would flicker */
    to.style.transition = 'none';
    to.classList.remove('is-gliding');
    void to.offsetWidth;
    to.style.transition = '';
  };
  /* Driven per frame (not a fixed from->to keyframe) because the target can still be moving while we
     glide: e.g. the Ask Mira chat list collapsing pushes the whole nav up for ~260ms. Re-reading the
     target's rect every frame keeps the highlight locked onto the real row instead of a stale spot. */
  /* The edge facing the direction of travel (the "leading" edge) moves on the normal curve, the other
     one trails behind on a slower one, so the highlight stretches and then settles. For neighbouring
     rows (e.g. Home -> Tasks, only 40px apart) this reads as one soft motion instead of a snap. */
  const DUR = 460, LAG = 0.18, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);   /* ease-out quart: calmer start than quint for short hops */
  const lerp = (a, b, e) => a + (b - a) * e;
  const down = r0.top > fromRect.top;
  const tick = now => {
    if(!g.isConnected) return;
    if(!to.isConnected){ g.remove(); return; }   /* nav re-rendered mid-glide: that render takes over */
    const t = Math.min(1, (now - t0) / DUR), r = to.getBoundingClientRect();
    const eLead = ease(t), eTrail = ease(Math.max(0, (t - LAG) / (1 - LAG)));   /* starts a beat later, still lands exactly at t=1 */
    const eTop = down ? eTrail : eLead, eBot = down ? eLead : eTrail;
    const top = lerp(fromRect.top, r.top, eTop);
    const bottom = lerp(fromRect.bottom, r.bottom, eBot);
    g.style.left = lerp(fromRect.left, r.left, eLead)+'px';
    g.style.width = lerp(fromRect.width, r.width, eLead)+'px';
    g.style.top = top+'px';
    g.style.height = Math.max(0, bottom - top)+'px';
    if(t < 1) requestAnimationFrame(tick); else done();
  };
  tick(t0);
  requestAnimationFrame(tick);
}
function setActive(id){
  if(MODES[id]){ enterMode(id); return; }

     tabs there just snapped the highlight. The mode tabs are ordinary .navlink buttons (renderModeNav ->
     makeLink), so they now take part in the same glide as the primary nav. Entering/leaving a mode
     does not go through setActive (see enterMode/exitMode), so it keeps its own slide animation. */
  const cur = document.querySelector('.sidebar .navlink.is-active');
  const fromRect = cur ? cur.getBoundingClientRect() : null;

  insPin = null; insDraft = null; if(insChat === 'build') insChat = null;   // leaving (or re-opening) a section closes the pin-from-chat screen and drops a draft dashboard
  if(id === 'insights'){ inOpenId = null; insNav = insFirstDashboard(); }   // clicking Insights opens the first dashboard
  activeId = id; render();

}
