/* Wires Home's interactions: dismiss (X) on cards, expand "Mira handled today". */
function wireHome(c){
  document.querySelectorAll('.home-addmenu').forEach(m => m.remove());
  // Edit mode: the gear toggles the banner; Done closes it; Reset to default re-renders Home
  // (restoring any dismissed cards) and stays in edit mode.
  // Collapse chevrons: toggle the section down to its header row; the state outlives re-renders.
  c.querySelectorAll('[data-home-collapse]').forEach(btn => {
    const box = btn.closest('.home-box'), key = btn.dataset.homeCollapse;
    const apply = on => { box.classList.toggle('is-collapsed', on); btn.setAttribute('aria-expanded', !on); btn.setAttribute('aria-label', (on ? 'Expand ' : 'Collapse ')+key); };
    apply(homeCollapsed.has(key));
    btn.addEventListener('click', () => {
      homeCollapsed.has(key) ? homeCollapsed.delete(key) : homeCollapsed.add(key);
      apply(homeCollapsed.has(key));
    });
  });
  const gear = c.querySelector('[data-home-gear]');
  const bar = c.querySelector('[data-home-editbar]');
  // Toggles the single-centred-column layout (see .home--solo): only outside edit mode, in layouts C/D,
  // when no widget in the right column is visible any more.
  const updateSolo = () => {
    const rc = c.querySelector('.home-cols > .home-col + .home-col');
    const none = rc && !rc.querySelector(':scope > .home-box[data-widget]:not([hidden])');
    c.querySelector('.home').classList.toggle('home--solo', !!none && !homeEditing);
  };
  const setEditing = on => {
    homeEditing = on;
    // C/D: the banner sits in an animated zone (CSS), so only the old layouts toggle [hidden].
    if(!bar.closest('.home-editzone')) bar.hidden = !on;
    if(!on) closeAddMenu();
    c.querySelector('.home').classList.toggle('is-editing', on);
    gear.classList.toggle('is-active', on);
    gear.setAttribute('aria-pressed', on);
    updateSolo();
  };
  updateSolo();
  gear.classList.toggle('is-active', homeEditing);
  gear.addEventListener('click', () => setEditing(!homeEditing));
  c.querySelector('[data-home-edit-done]').addEventListener('click', () => setEditing(false));
  c.querySelector('[data-home-reset]').addEventListener('click', () => {
    homeHidden.clear();
    homeHiddenDefault().forEach(k => homeHidden.add(k));
    c.innerHTML = renderHome().replace(' home-fade','');
    wireHome(c);
  });
  // Layout switch: re-render Home in the chosen layout (edit mode is kept).
  c.querySelectorAll('[data-home-layout]').forEach(b => b.addEventListener('click', () => {
    homeLayout = b.dataset.homeLayout;
    refreshNavVariant();
    c.innerHTML = renderHome().replace(' home-fade','');
    wireHome(c);
  }));
  // Dismissing a card (X on Needs you / Keep an eye on): the card fades while it folds shut (height, padding
  // and the 6px list gap all go to 0), so the cards below glide up instead of jumping when it is removed.
  c.querySelectorAll('[data-home-dismiss]').forEach(x =>
    x.addEventListener('click', () => {
      const card = x.closest('.home-card');
      if(card.dataset.leaving) return;                        /* double click: already on its way out */
      if(!card.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches){ card.remove(); return; }
      card.dataset.leaving = '1';
      card.style.pointerEvents = 'none';
      card.style.overflow = 'hidden';
      const h = card.getBoundingClientRect().height;
      const a = card.animate(
        [{ height:h+'px', opacity:1, marginBottom:'0px' },
         { opacity:0, offset:.45 },                            /* fade first, fold while it is already gone */
         { height:'0px', opacity:0, marginBottom:'-6px', paddingTop:'0px', paddingBottom:'0px', borderTopWidth:'0px', borderBottomWidth:'0px' }],
        { duration:380, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards' });
      a.onfinish = () => card.remove();
    }));
  // Widgets: remove with the purple minus right of a title; add with the round "+" under the banner.
  // The dashed "+ Add widgets" field opens a dropdown beside it (label fades out, hover glow stays): "Add widgets" lists
  // the hidden widgets (click to add), "Added" lists the ones on the panel (click to remove again).
  // Hidden sections stay in the DOM with [hidden]; adding un-hides one at the end of the right column.
  const addBtn = c.querySelector('[data-home-add]');
  const addWrap = c.querySelector('.home-editzone__add');
  const rightCol = () => c.querySelector('.home-cols > .home-col + .home-col');
  let addMenu = null;
  function widgetItem(box, added){
    return '<button type="button" class="home-addmenu__item" data-key="'+box.dataset.widget+'" data-added="'+added+'">'+
      '<span class="home-addmenu__icon">'+svg(HOME_WIDGET_ICON[box.dataset.widget] || 'plus',1.8)+'</span>'+
      '<span class="home-addmenu__name">'+box.dataset.title+'</span>'+
      '<span class="home-addmenu__act">'+svg(added ? 'minuscircle' : 'plus',1.8)+'</span></button>';
  }
  function buildMenu(){
    if(!addMenu) return;
    const avail = [...c.querySelectorAll('.home-box[data-widget][hidden]')];
    const added = [...rightCol().querySelectorAll(':scope > .home-box[data-widget]:not([hidden])')];
    addMenu.innerHTML =
      '<div class="home-addmenu__title">Add widgets</div>'+
      (avail.length ? avail.map(b => widgetItem(b,false)).join('') : '<div class="home-addmenu__empty">Nothing left to add</div>')+
      '<div class="home-addmenu__title home-addmenu__title--sub">Added</div>'+
      (added.length ? added.map(b => widgetItem(b,true)).join('') : '<div class="home-addmenu__empty">Nothing added yet</div>');
  }
  // Fixed position: right edge 8px left of the dashed field (field = the row's left padding, 24px, in
  // from the row), top-aligned with it; nudged up if it would run off the bottom of the window.
  function placeMenu(){
    if(!addMenu || !addWrap) return;
    const r = addWrap.getBoundingClientRect();
    const fieldLeft = r.left + 24, fieldTop = r.top + 4;
    const h = addMenu.offsetHeight;
    addMenu.style.left = Math.max(8, fieldLeft - 8 - 220)+'px';
    addMenu.style.top = Math.max(8, Math.min(fieldTop, window.innerHeight - h - 8))+'px';
  }
  // Any press outside the dropdown closes it (the dashed field itself is excluded: its own click toggles).
  const onOutside = e => {
    if(addMenu && !addMenu.contains(e.target) && !addBtn.contains(e.target)) closeAddMenu();
  };
  function closeAddMenu(){
    document.removeEventListener('pointerdown', onOutside, true);
    window.removeEventListener('resize', placeMenu);
    document.removeEventListener('scroll', placeMenu, true);
    if(addMenu){ addMenu.remove(); addMenu = null; }
    if(addBtn){ addBtn.setAttribute('aria-expanded','false'); addBtn.classList.remove('is-open'); }
  }
  // Hide a section with a short fade; show it again at the end of the right column.
  function hideWidget(box){
    homeHidden.add(box.dataset.widget);
    box.classList.add('is-leaving');
    setTimeout(() => { box.hidden = true; box.classList.remove('is-leaving'); buildMenu(); }, 220);
  }
  // A newly added widget lands at the very TOP of the right column (right under the dashed "Add widgets"
  // field), not at the bottom. Micro-interaction: the dashed field "hands over" to the widget - it fades
  // out, the widget slides out of the field's spot down into its own slot, then the dashed field fades
  // back in above it, ready for the next one. Plain fade/slide with no motion for prefers-reduced-motion.
  function showWidget(box){
    homeHidden.delete(box.dataset.widget);
    box.hidden = false;
    const col = rightCol();
    const zone = col.querySelector('.home-editzone');
    // Insert right after the edit zone (banner + dashed field), i.e. first widget in the column.
    col.insertBefore(box, zone ? zone.nextSibling : col.firstChild);
    buildMenu();
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(calm || !addBtn || !box.animate){ box.classList.add('home-box--enter'); return; }
    // Distance from the dashed field's top to the widget's final top: the widget starts on the field.
    const dy = box.getBoundingClientRect().top - addBtn.getBoundingClientRect().top;
    const ease = 'cubic-bezier(.22,1,.36,1)';
    box.style.position = 'relative';
    box.style.zIndex = '2';   // stay above the dashed field while sliding over it
    const slide = box.animate(
      [{ opacity:0, transform:'translateY('+(-dy)+'px) scale(.96)' }, { opacity:1, transform:'none' }],
      { duration:480, easing:ease });
    slide.onfinish = slide.oncancel = () => { box.style.position = ''; box.style.zIndex = ''; };
    // Dashed field: out quickly, stay hidden while the widget lands, then return.
    addBtn.animate(
      [{ opacity:1, transform:'none', offset:0 },
       { opacity:0, transform:'scale(.98)', offset:.22 },
       { opacity:0, transform:'scale(.98)', offset:.55 },
       { opacity:1, transform:'none', offset:1 }],
      { duration:620, easing:'ease-out' });
  }
  c.querySelectorAll('[data-home-remove]').forEach(b => b.addEventListener('click', () => hideWidget(b.closest('.home-box'))));
  if(addBtn && addWrap){
    addBtn.addEventListener('click', () => {
      // Second click closes it again (label fades back in, glow goes).
      if(addBtn.classList.contains('is-open')){ closeAddMenu(); return; }
      addBtn.setAttribute('aria-expanded','true');
      addBtn.classList.add('is-open');
      addMenu = document.createElement('div');
      addMenu.className = 'home-addmenu';
      addMenu.addEventListener('click', e => {
        const it = e.target.closest('.home-addmenu__item');
        if(!it) return;
        const box = c.querySelector('.home-box[data-widget="'+it.dataset.key+'"]');
        if(it.dataset.added === 'true') hideWidget(box); else showWidget(box);
      });
      document.body.appendChild(addMenu);
      buildMenu();
      placeMenu();
      window.addEventListener('resize', placeMenu);
      document.addEventListener('pointerdown', onOutside, true);
      document.addEventListener('scroll', placeMenu, true);
    });
  }
  // Drag & drop of widget sections (edit mode, layouts C/D). Grab a section's handle: the section
  // dims in place, a ghost copy follows the pointer, and a thick violet line marks where it will
  // land. Sections can be reordered within the right column; the left column is disabled while
  // editing, so it is skipped. Order is not persisted - Reset to default / switching layout restores it.
  const dropLine = document.createElement('div');
  dropLine.className = 'home-dropline';
  c.querySelectorAll('.home-drag').forEach(h => h.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const box = h.closest('.home-box');
    if(!box) return;
    e.preventDefault();
    const rect = box.getBoundingClientRect();
    const grabY = e.clientY - rect.top;
    // Floating copy that follows the pointer (inert, so it never steals pointer events).
    const ghost = box.cloneNode(true);
    ghost.classList.add('home-ghost');
    // The ghost sits at 0,0 and is moved with a transform (GPU, no layout), at most once per frame.
    ghost.style.cssText = 'width:'+rect.width+'px;left:0;top:0;will-change:transform;transform:translate3d('+rect.left+'px,'+rect.top+'px,0)';
    document.body.appendChild(ghost);
    box.classList.add('is-dragging');
    document.body.classList.add('is-dragging-widget');
    // Columns that accept drops: the ones that aren't disabled (pointer-events:none) right now.
    const cols = [...c.querySelectorAll('.home-cols > .home-col')].filter(col => getComputedStyle(col).pointerEvents !== 'none');
    let target = null; // { col, before } - insert box into col, before this sibling (null = at the end)
    const GAP = 32;    // vertical gap between sections; the line sits in the middle of it
    const onMove = ev => {
      ghost.style.top = (ev.clientY - grabY)+'px';
      const col = cols.find(cl => { const r = cl.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right; });
      if(!col){ dropLine.remove(); target = null; return; }
      const others = [...col.children].filter(n => n.classList.contains('home-box') && n !== box && !n.hidden);
      const before = others.find(b => { const r = b.getBoundingClientRect(); return ev.clientY < r.top + r.height/2; }) || null;
      const colTop = col.getBoundingClientRect().top;
      let y;
      if(before) y = before.getBoundingClientRect().top - GAP/2;
      else if(others.length) y = others[others.length-1].getBoundingClientRect().bottom + GAP/2;
      // Column holds only the dragged widget: mark its own slot, not the very top of the column
      // (the column starts with the banner / padding, so colTop would put the line far above the widget).
      else if(box.parentNode === col) y = box.getBoundingClientRect().top;
      else y = colTop + GAP/2;
      if(dropLine.parentNode !== col) col.appendChild(dropLine);
      dropLine.style.top = (y - colTop)+'px';
      target = { col, before };
    };
    const finish = drop => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      document.removeEventListener('keydown', onKey);
      if(drop && target) target.col.insertBefore(box, target.before);
      dropLine.remove();
      ghost.remove();
      box.classList.remove('is-dragging');
      document.body.classList.remove('is-dragging-widget');
    };
    const onUp = () => finish(true);
    const onCancel = () => finish(false);
    const onKey = ev => { if(ev.key === 'Escape') finish(false); };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
    document.addEventListener('keydown', onKey);
    onMove(e);
  }));
  // Needs-you cards: click anywhere on the card (except its buttons/links) to expand or
  // collapse the detail area; the chevron rotates to match. Only one card is open at a
  // time — opening one closes any other.
  const needs = [...c.querySelectorAll('.home-card--needs')];
  const setOpen = (card, open) => {
    const chev = card.querySelector('[data-home-expand]');
    const detail = card.querySelector('.home-card__detail');
    chev.classList.toggle('is-open', open);
    chev.setAttribute('aria-expanded', open);
    if(detail) detail.hidden = !open;
  };
  needs.forEach(card => {
    card.addEventListener('click', e => {
      if(e.target.closest('.home-btn, .home-link, .home-badge--source, [data-home-dismiss]')) return;
      const willOpen = !card.querySelector('[data-home-expand]').classList.contains('is-open');
      needs.forEach(o => setOpen(o, o === card && willOpen));
    });
  });
  // Source badge opens a modal. Closes on X, backdrop click or Escape. Body is a placeholder.
  c.querySelectorAll('[data-home-source]').forEach(b =>
    b.addEventListener('click', () => openSourceModal(HOME_NEEDS[+b.dataset.homeSource].modal)));
  const done = c.querySelector('[data-home-done]');
  const list = c.querySelector('.home-donelist');
  if(done && list){
    done.addEventListener('click', () => {
      const open = done.classList.toggle('is-open');
      list.hidden = !open;
      done.firstElementChild.style.transform = open ? 'rotate(180deg)' : '';
    });
  }
}

/* ---- Insights — list screen ("Insights" nav item) ----
   Scope comes from the workspace switcher (decided 2026-10-26): Personal shows only the user's
   personal insights, a team workspace shows only that team's. So there are no All / Personal / Team
   tabs and no Visibility column. Mock data from the handoff (Sales Performance sample, SAR). */
const IN_COLLECTIONS = ['Sales','Operations','Agro'];
const IN_SORTS = ['Last viewed','Last updated','Name'];
/* `ws` = the workspace id the insight belongs to ('personal' or a team id). `madeWith` is the
   user-facing label: Mira / Custom-built / App. `viewed` and `upd` are ranks (higher = more recent)
   used only for sorting; `updated` is the text shown in the table. Mutable so that "New insight
   with Mira" (a later step) can add rows. */
const IN_ROWS = [
  { id:'sales-performance', ws:'sales', name:'Sales Performance — Trading & Automation', collection:'Sales',
    source:'Dynamics (ERP)', madeWith:'Mira', updated:'Today 06:40 · daily', owner:'Binome team', viewed:3, upd:3 },
  { id:'stock-control', ws:'sales', name:'Stock control', collection:'Operations',
    source:'Item master', madeWith:'Custom-built', updated:'21 Oct · nightly', owner:'Binome team', viewed:2, upd:1 },
  { id:'harvest-overview', ws:'sales', name:'Harvest overview', collection:'Agro',
    source:'Harvest app', madeWith:'App', updated:'Today 05:30', owner:'Harvest app', viewed:1, upd:2 },
];
let inQuery = '';            // search text (survives re-renders, like rtQuery)
let inCollection = 'All';    // "Collection:" filter
let inSort = 'Last viewed';  // "Sort:" pill

/* Rows for the active workspace, filtered by search + collection and sorted. */
function inVisibleRows(){
  const q = inQuery.trim().toLowerCase();
  const rows = IN_ROWS
    .filter(r => r.ws === activeWorkspace)
    .filter(r => inCollection === 'All' || r.collection === inCollection)
    .filter(r => !q || [r.name, r.source, r.madeWith, r.owner].some(v => v.toLowerCase().includes(q)));
  if(inSort === 'Name') rows.sort((a, b) => a.name.localeCompare(b.name));
  else rows.sort((a, b) => inSort === 'Last updated' ? b.upd - a.upd : b.viewed - a.viewed);
  return rows;
}

/* The results area: the flat table, "no match" text, or the no-data state. Kept separate so the
   search box can swap just this part while typing (the input keeps focus). */
function inResultsHTML(){
  const rows = inVisibleRows();
  const anyInWorkspace = IN_ROWS.some(r => r.ws === activeWorkspace);
  if(!anyInWorkspace){
    return '<div class="in-empty">'+
      '<div><div class="in-empty__title">No business data connected yet?</div>'+
      '<div class="in-empty__sub">Start from a preset: time Mira saved, workflows run, tasks done this week.</div></div>'+
      '<button type="button" class="wl-newtask wl-newtask--secondary" data-in-presets>Browse presets</button>'+
    '</div>';
  }
  if(!rows.length) return '<p class="in-nomatch">No insights match your search.</p>';
  const body = rows.map(r =>
    '<tr data-in-id="'+r.id+'"'+(IN_DETAILS[r.id] ? ' class="is-clickable"' : '')+'>'+
      '<td><span class="in-name">'+rtEsc(r.name)+'</span></td>'+
      '<td>'+insSrcHTML(r.source)+'</td>'+
      '<td><span class="in-chip">'+r.madeWith+'</span></td>'+
      '<td>'+rtEsc(r.updated)+'</td>'+
      '<td>'+rtEsc(r.owner)+'</td>'+
    '</tr>').join('');
  return '<div class="in-tablewrap"><table class="in-table">'+
    '<thead><tr><th>Insight</th><th>Source</th><th>Made with</th><th>Updated</th><th>Owner</th></tr></thead>'+
    '<tbody>'+body+'</tbody></table></div>';
}

function renderInsights(){
  const team = activeWorkspace !== 'personal';
  const ws = WORKSPACES.find(w => w.id === activeWorkspace);
  // The line under the title says what this scope contains, so the missing tabs are not missed.
  const sub = team
    ? 'Shared with the '+rtEsc(ws.name)+'. Your personal insights live in the Personal workspace.'
    : 'Only you see these. Team insights live in each team’s workspace.';
  const collItems = ['All'].concat(IN_COLLECTIONS).map(c => ddItem(c, c === inCollection)).join('');
  const sortItems = IN_SORTS.map(c => ddItem(c, c === inSort)).join('');
  return (
    '<div class="in">'+
      '<header class="wl__head">'+
        '<h1 class="wl__title">Insights</h1>'+
        '<p class="wl__subtitle">'+sub+'</p>'+
      '</header>'+
      // Same toolbar shell as Tasks / Routines, so search, pills and the button share sizes.
      '<div class="wl-toolbar">'+
        '<div class="wl-toolbar__left"><div class="wl-pillgroup">'+
          ddPillHTML({ key:'collection', label:'Collection:', value:inCollection, itemsHTML:collItems })+
          ddPillHTML({ key:'sort', label:'Sort:', value:inSort, itemsHTML:sortItems })+
        '</div></div>'+
        '<div class="wl-toolbar__right">'+
          searchBoxHTML('Search insights...')+
          '<button type="button" class="wl-newtask" data-in-new><span class="wl-newtask__icon">'+svg('plus',2)+'</span>New insight with Mira</button>'+
        '</div>'+
      '</div>'+
      '<div data-in-results>'+inResultsHTML()+'</div>'+
    '</div>'
  );
}

/* Wire the list: search, the two single-select pills. Row click and the New insight / Browse
   presets buttons are connected in the next steps (detail view, New insight with Mira). */
function wireInsights(c){
  const results = c.querySelector('[data-in-results]');
  const refresh = () => { results.innerHTML = inResultsHTML(); };
  wireCollapsibleSearch(c);
  const sBox = c.querySelector('[data-search]');
  const sInput = sBox.querySelector('.wl-search__input');
  // Re-open the box with its text after a full re-render (same trick as Routines).
  if(inQuery){
    sInput.value = inQuery;
    sBox.classList.add('is-open','has-value');
    sBox.querySelector('.wl-search__btn').setAttribute('aria-expanded','true');
    sInput.removeAttribute('tabindex');
  }
  sInput.addEventListener('input', () => { inQuery = sInput.value; refresh(); });
  // Row click opens the detail (event delegation: the results area is re-rendered by search / filters).
  results.addEventListener('click', e => {
    const tr = e.target.closest('tr.is-clickable');
    if(tr){ inOpenId = tr.dataset.inId; render(); }
  });
  wireDropdownPills(c, (key, val) => {
    if(key === 'collection') inCollection = val; else inSort = val;
    refresh();
  });
}

/* ---- CHART: colour rules for Insights charts (tokens: --chart-* in :root; docs: chart colour guidelines) ----
   The rules are code, not just documentation, so every chart (and later every chart Mira generates) goes through them:
     one series            -> cat-1
     parts of one whole    -> the purple ramp (2 parts = 500 + 300, 3 parts = 700 + 500 + 300)
     distinct series       -> categorical, in order; more than 6 = top 5 + "Other" (grey)
     colour follows the ENTITY, not its rank: pass the chart's full, unfiltered key list, so filtering or sorting never repaints
     good / bad            -> semantic tokens, always with a sign or icon, never colour alone
     incomplete period     -> the same colour as diagonal hatching on seq-100, "Partial month" in the legend and tooltip
     never: gradients, brand turquoise, full brand pink. */
const CHART = (() => {
  const v = name => 'var(--chart-'+name+')';
  const CAT = [1, 2, 3, 4, 5, 6].map(n => v('cat-'+n));
  // Ramp steps by number of parts. Parts are listed biggest-first in the data (the darkest step goes to the first part).
  const RAMP = { 1:[500], 2:[500, 300], 3:[700, 500, 300], 4:[800, 600, 400, 200], 5:[800, 650, 500, 400, 200] };
  const seq = step => step === 650 ? v('seq-600') : v('seq-'+step);
  return {
    v,
    /* Distinct series. allKeys = every series key of the chart in its fixed order. */
    getSeriesColor(key, allKeys){
      const i = allKeys.indexOf(key);
      if(allKeys.length === 1) return CAT[0];
      if(i < 0) return v('other');
      if(allKeys.length > CAT.length) return i < CAT.length - 1 ? CAT[i] : v('other');   // top 5 + Other
      return CAT[i];
    },
    /* Parts of one whole (a stack, a share-of-total list). partKeys = every part in order; the key 'other' is always grey. */
    getPartColor(key, partKeys){
      if(key === 'other') return v('other');
      const keys = partKeys.filter(k => k !== 'other'), i = keys.indexOf(key);
      const steps = RAMP[Math.min(keys.length, 5)] || RAMP[5];
      return seq(steps[Math.max(i, 0)]);
    },
    /* Incomplete period: stripes of the series colour on seq-100 (not a lighter colour). */
    hatch(color){
      return 'repeating-linear-gradient(135deg,'+color+' 0 2px,'+v('seq-100')+' 2px 5px)';
    },
    /* Legend: items = [{ label, color, hatch? }]. Only drawn for 2+ entries. */
    legend(items){
      if(items.length < 2) return '';
      return '<div class="chart-legend">'+items.map(it =>
        '<span class="chart-legend__item"><span class="chart-legend__sw" style="background:'+(it.hatch ? CHART.hatch(it.color) : it.color)+'"></span>'+rtEsc(it.label)+'</span>').join('')+'</div>';
    },
  };
})();

/* A stacked time series as bars. `view.series` = [{ key, label }] (omit for one series), weights from `shares`
   (or `shareA` for two parts). The LAST bar is the month still running: hatched, and its tooltip says so.
   `top` = the value that fills the full height. Tooltip (native title) lists every segment, because the light
   steps of the ramp are below 3:1 on white and cannot carry the information alone. */
function tsParts(view){
  const series = view.series;
  if(!series || series.length < 2) return [{ key:'all', label:'', share:1, color:CHART.v('cat-1') }];
  const shares = view.shares || [view.shareA, 1 - view.shareA];
  const keys = series.map(x => x.key);
  return series.map((x, i) => ({ key:x.key, label:x.label, share:shares[i], color:CHART.getPartColor(x.key, keys) }));
}
function tsBars(view, top){
  const parts = tsParts(view), n = view.values.length;
  return view.values.map((x, i) => {
    // `partial` = index of the bar still running (default: the last one; -1 = none, e.g. last week).
    const last = view.partial != null ? i === view.partial : i === n - 1;
    // Per-bar split (counts charts, e.g. Email): `pairs[i]` = [part A, part B] for that bar, so every bar has its OWN split
    // instead of one fixed share for all bars (`shareA`). A null pair = a bucket that has not happened yet: an empty slot.
    const pair = view.pairs ? view.pairs[i] : null;
    const label = view.labels ? view.labels[i] : '';   // full name of the bucket for the tooltip ("Wed 28 Oct"); counts charts only
    if(view.pairs && !pair) return '<span class="in-ts__bar" title="'+rtEsc(label+'\nNo data yet')+'"></span>';
    const sum = pair ? pair[0] + pair[1] : 0;
    const ps = pair ? parts.map((p, k) => Object.assign({}, p, { share: sum ? pair[k] / sum : (k ? 0 : 1) })) : parts;
    // First line: the month (from `firstMonth`, 'YYYY-MM') and, for the running one, "Partial month".
    const d0 = view.firstMonth ? new Date(+view.firstMonth.slice(0,4), +view.firstMonth.slice(5) - 1 + i, 1) : null;
    const when = label || (d0 ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d0.getMonth()]+' '+d0.getFullYear() : '');
    const val = (p, k) => pair ? String(pair[k]) : 'SAR '+Math.round(x * p.share)+'K';   // counts vs SAR thousands
    const tip = [when, last ? (view.partialLabel || 'Partial month') : ''].filter(Boolean).join(' · ')+
      (when || last ? '\n' : '')+(ps.length > 1 ? ps.map((p, k) => p.label+': '+val(p, k)).join('\n')+'\nTotal: '+(pair ? sum : 'SAR '+x+'K') : 'SAR '+x+'K');
    const segs = ps.map(p => '<span class="in-ts__seg" style="flex:'+p.share+' 1 0;background:'+(last ? CHART.hatch(p.color) : p.color)+'"></span>').join('');
    return '<span class="in-ts__bar" title="'+rtEsc(tip)+'"><span class="in-ts__stack" style="height:'+(x / top * 100).toFixed(1)+'%">'+segs+'</span></span>';
  }).join('');
}
function tsLegend(view){
  const parts = tsParts(view);
  if(parts.length < 2) return '';
  const items = parts.map(p => ({ label:p.label, color:p.color }));
  if(view.partial !== -1) items.push({ label:view.partialLabel || 'Partial month', color:parts[0].color, hatch:true });   // partial:-1 = nothing is running (e.g. last week)
  return CHART.legend(items);
}

/* ---- Insight detail (built with Mira) ----
   Opened from a list row (inOpenId). The SHELL (breadcrumb, title, actions, meta chips, filter tabs,
   period) is the same for every insight; the CONTENT is a fixed section order — Mira noticed first
   (can't be removed), then Key numbers, Breakdowns, Detail, About this data. Each block type is one
   reusable function below, so the same blocks can later sit on Home and in the Add block catalogue.
   Rules: no approve / Ready buttons — work to do is a link to Tasks. Limits: max 3 signals, 6 KPI
   tiles, 5 table rows. Mock data = the Sales Performance sample from the handoff (SAR). */
const IN_MAX = { signals:3, kpis:6, rows:5 };

/* A dashboard's pins resolved to what the view needs: the insight, the size and its column span. */
/* A row holds one card (full width) or two (50:50). Layout comes from the order: two S pins in a row are a pair, and an S pin
   with no partner (next to an L, or last) is alone in its row, so it takes the full width. */
const inRows = pins => {
  const rows = [];
  for(let i = 0; i < pins.length; i++){
    if(pins[i].size === 'S' && pins[i+1] && pins[i+1].size === 'S'){ rows.push([pins[i], pins[i+1]]); i++; }
    else rows.push([pins[i]]);
  }
  return rows;
};
const inPinned = d => inRows(d.pins).flatMap(row => row.map(pin => ({ pin, insight:IN_INSIGHTS[pin.insightId], span:row.length === 2 ? IN_SIZES.S : IN_SIZES.L })));

/* ---- Filters (MVP) ----
   Rule: a filter that applies to EVERY insight on a dashboard sits in the filter bar under the header
   (dashboard.filters[]); a filter that applies to ONE insight is a compact chip in that card's header
   (insight.filters[]). No sections, no "Not filtered by…" badges, no exception handling (out of scope for the MVP).
   A filter definition is data: { id, label, type:'period'|'dimension', options, default, multi }.
   Every insight receives the dashboard's filter values plus its own (insCtx), then builds its view from them.
   Values are per user and per dashboard and the last choice is remembered (insFilterVals, in memory for the
   prototype). filter.default is the starting value; the bar only offers "Clear all" and "+ Add filter" (no Reset / Save
   as default). An empty selection on a multi filter means "All".
   Thresholds / rules (min stock, service level, lead time) are NOT filters: they are a read-only "Rules" line on
   the card, set by the owner (see `rules` on 'freshness-watch').
   Still open (not built on purpose): a click on a chart element (filter the dashboard vs open Ask Mira). */
const insFilterVals = {};     // 'dashId::filterId' → chosen values (array). Missing = the owner's default.
const insSwitchVals = {};     // 'dashId::insightId::switchId' → chosen option. Missing = the first option.
let insFiltersMore = false;   // is the "More filters (n)" row expanded?
let insKeepOpen = null;       // data-dd key of a multi filter whose menu is reopened after the re-render (so several options can be ticked in a row)
const INS_FILTERS_MAX = 4;    // chips shown in the bar; the rest go under "More filters (n)"
const insFVal = (dash, f) => insFilterVals[dash.id+'::'+f.id] || f.default;
const insSVal = (dash, ins, s) => insSwitchVals[dash.id+'::'+ins.id+'::'+s.id] || s.options[0];
/* The values an insight builds its view from: the dashboard's filters plus its own, plus its view switches.
   Without a dashboard (e.g. a copy somewhere else) it falls back to the defaults. */
function insCtx(dash, ins){
  const f = {}, s = {};
  (dash && dash.filters || []).concat(ins.filters || []).forEach(x => { f[x.id] = dash ? insFVal(dash, x) : x.default; });
  (ins.switches || []).forEach(sw => { s[sw.id] = dash ? insSVal(dash, ins, sw) : sw.options[0]; });
  // A dashboard without a filter bar (My work) still has the period pill in its header: its value is the insights' period.
  if(dash && !(dash.filters || []).length) f.period = [insPeriod];
  return { f, s };
}
/* The view a card shows: built from the filter values when the insight has a `build`, otherwise its fixed `view`. */
const insViewOf = (ins, ctx) => ins.build ? ins.build(ctx || { f:{}, s:{} }) : ins.view;
/* The text of a chip's value: the one choice, or "All" / the pick / "2 selected" for a multi filter. */
function insFilterText(f, vals){
  if(!f.multi) return vals[0] || f.default[0];
  return vals.length === 0 ? 'All' : vals.length === 1 ? vals[0] : vals.length+' selected';
}
/* One filter chip = the same dropdown pill the Routines filters use ("Label: Value ▾"). Multi filters tick several
   options and keep the menu open; single ones (period, "Days of cover") close on pick. `removable` adds a last
   "Remove filter" row: only the owner, and never for Period. */
function insFilterPillHTML(dash, f, removable){
  const vals = insFVal(dash, f);
  let items = f.options.map(o => ddItem(o, vals.includes(o))).join('');
  if(f.multi) items = (items + (vals.length ? ddClearItem() : '')).replace(/menuitemradio/g, 'menuitemcheckbox');
  // No "Remove filter" row any more: the menu is the same as in Routines (options + Clear). The `removable` argument and
  // the '__remove__' handlers (insRemoveFilter, wireInsFilters, insPickPill) are left in place but nothing emits that row now;
  // removing a filter is for Mira ("Edit with Mira") until a place for it is decided.
  return ddPillHTML({ key:'flt:'+f.id, label:f.label+':', value:insFilterText(f, vals), itemsHTML:items, multi:f.multi });
}
const insSameVals = (a, b) => JSON.stringify(a.slice().sort()) === JSON.stringify(b.slice().sort());
/* The filter bar under the dashboard header. Owner: "+ Add filter" (opens Mira).
   Everyone, "Can only see results" included: change values and Clear all (no Reset / Save as default). */
function insFilterBarHTML(dash){
  const fs = dash.filters;
  if(!fs || !fs.length) return '';
  const owner = (dash.role || 'owner') === 'owner';
  const chip = f => insFilterPillHTML(dash, f, owner && f.type !== 'period');
  const rest = fs.slice(INS_FILTERS_MAX);
  const anyPicked = fs.some(f => f.type === 'dimension' && !insSameVals(insFVal(dash, f), f.default));
  const link = (attr, label) => '<button type="button" class="home-link" '+attr+'>'+label+'</button>';
  return '<div class="dc-filters" role="group" aria-label="Filters">'+
    fs.slice(0, INS_FILTERS_MAX).map(chip).join('')+
    // Expanded: the hidden chips come first and the toggle (now "Less filters") sits to the right of the last chip.
    (insFiltersMore ? rest.map(chip).join('') : '')+
    (rest.length ? link('data-flt-more aria-expanded="'+insFiltersMore+'"', insFiltersMore ? 'Less filters' : 'More filters ('+rest.length+')') : '')+
    '<span class="dc-filters__actions">'+
      (anyPicked ? link('data-flt-clear', 'Clear all') : '')+
      (owner ? link('data-flt-add', '+ Add filter') : '')+
    '</span></div>';
}
/* Every filter whose chip can be on the page: the dashboard's and the pinned insights' own. */
const insAllFilters = dash => (dash.filters || []).concat(...inPinned(dash).map(p => p.insight.filters || []));
function insRemoveFilter(dash, f){
  const ix = (dash.filters || []).indexOf(f);
  if(ix >= 0) dash.filters.splice(ix, 1);
  else inPinned(dash).forEach(p => { const j = (p.insight.filters || []).indexOf(f); if(j >= 0) p.insight.filters.splice(j, 1); });
  delete insFilterVals[dash.id+'::'+f.id];
  shareToast('Removed filter '+f.label);
}
/* Wires the filter bar + the card chips + the view switches of the open dashboard `c`. Single-choice pills
   (period, "Days of cover", switches) are wired by wireDropdownPills in renderContent, which calls insPickPill. */
function wireInsFilters(c, dash){
  const reopen = insKeepOpen; insKeepOpen = null;
  insAllFilters(dash).forEach(f => {
    if(!f.multi) return;
    wireMultiDropdown(c, 'flt:'+f.id, val => {
      if(val === '__remove__'){ insRemoveFilter(dash, f); render(); return; }
      const cur = val === '__clear__' ? [] : insFVal(dash, f).slice();
      if(val !== '__clear__'){ const i = cur.indexOf(val); i >= 0 ? cur.splice(i, 1) : cur.push(val); }
      insFilterVals[dash.id+'::'+f.id] = cur;
      insKeepOpen = 'flt:'+f.id; render();
    }, reopen === 'flt:'+f.id);
  });
  c.querySelector('[data-flt-more]') && c.querySelector('[data-flt-more]').addEventListener('click', () => { insFiltersMore = !insFiltersMore; render(); });
  const on = (sel, fn) => { const b = c.querySelector(sel); if(b) b.addEventListener('click', fn); };
  // Clear all = every dimension filter back to "All" (Period is never empty, so it stays).
  on('[data-flt-clear]', () => {

/* The mock conversation: every click echoes the choice as the user's bubble, then Mira answers. */
function insWireSummaryPanel(host, key, label){
  const reveal = host.querySelector('.rt-reveal');
  // [step, label, extra attributes, tool id]: a tool id puts that tool's logo in front of the label (same markup as the New routine chips)
  const chipBtns = list => '<div class="nr__chips" data-sum-step>'+list.map(([k, t, extra, tool]) =>
    '<button type="button" class="nr__chip" data-sum="'+k+'" '+(extra || '')+'>'+(tool ? '<span class="nr__chip-icon nr__chip-icon--multi">'+rtLogo(tool)+'</span>' : '')+t+'</button>').join('')+'</div>';
  const say = html => { reveal.insertAdjacentHTML('beforeend', html); const b = host.querySelector('.rt-panel__body'); b.scrollTop = b.scrollHeight; };
  // Mira proposes ready-made "who · where" pairs (with the channel's logo); "Someone else…" lets the user type the recipient.
  const CHANNELS = {
    '#leadership · Slack':      { where:'Slack · #leadership',  dest:'slack' },
    'Leadership team · Gmail':  { where:'Gmail · Leadership team', dest:'gmail' },
    'Just me · Telegram':       { where:'Telegram · @agata',    dest:'telegram', self:true },
  };
  let kind = 'full', channel = null, askingWho = false;
  const whereChips = () => chipBtns(Object.keys(CHANNELS).map(n => ['to', n, '', CHANNELS[n].dest]).concat([['who','Someone else…']]));
  // After the recipient is known (a pair, or typed text): the one-time note about whose numbers they see, then Send.
  const confirmTo = () => {
    const c = CHANNELS[channel];
    say('<div class="nr__bubble">I’ll send it to <b>'+rtEsc(channel)+'</b>.'+(c && c.self ? '' : ' Everyone there will see numbers from <b>your</b> connected sources.')+'</div>'+
        '<div class="nr__actions" data-sum-step><button type="button" class="nr__btn nr__btn--primary" data-sum="send">Send</button></div>');   // the chat's primary button, not a chip
  };
  const addRoutine = (when, ch) => {
    const dash = IN_DASHBOARDS.find(x => x.id === insNav) || {};
    const personal = dash.ws === 'personal';
    RT_ROWS.unshift(Object.assign({ cat:personal ? 'personal' : 'sales', where:(CHANNELS[ch] || { where:ch }).where, dest:(CHANNELS[ch] || {}).dest || '', uses:[],
      desc:'Sends a report of '+label+' to '+ch+', '+when.toLowerCase()+'.',
      trigger:{ title:'Schedule', icon:'clock', sub:'Schedule · '+when },
      workflow:{ title:label+' report', auto:true, status:'live', text:'Live · '+when.toLowerCase() } },
      personal ? { scope:'personal' } : { team:'Sales Team' }));
  };
  // The message box only does something after "Someone else…": what is typed becomes the recipient.
  const typed = host.querySelector('.composer__input');
  const sendTyped = () => {
    const v = typed.value.trim();
    if(!askingWho || !v) return;
    askingWho = false; typed.value = '';
    say('<div class="nr__user">'+rtEsc(v)+'</div>');
    channel = v;
    setTimeout(confirmTo, 350);
  };
  typed.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendTyped(); } });
  host.querySelector('.composer__send').addEventListener('click', sendTyped);
  host.addEventListener('click', e => {
    if(e.target.closest('[data-sum-routines]')){ insChat = null; setActive('routines'); return; }
    const b = e.target.closest('[data-sum]');
    if(!b || b.disabled) return;
    // a pick is "sent": the options disappear and their text becomes the user's own message
    b.closest('[data-sum-step]').remove();
    say('<div class="nr__user">'+b.textContent+'</div>');
    const k = b.dataset.sum;
    setTimeout(() => {
      if(k === 'draft'){            // an adjusted draft, with the same chips again
        kind = b.dataset.kind;
        say(insReportDraftHTML(label, kind, kind === 'short' ? 'Shorter:' : 'Only revenue:'));
      } else if(k === 'where'){
        say('<div class="nr__bubble">Where should I send it?</div>'+whereChips());
      } else if(k === 'to'){
        channel = b.textContent; confirmTo();
      } else if(k === 'who'){       // "Someone else…": the recipient is typed in the message box
        askingWho = true;
        say('<div class="nr__bubble">Who should get it? Type a name, a channel or an email address.</div>');
      } else if(k === 'send'){
        say('<div class="nr__bubble">Done! Should I send it regularly?</div>'+
            chipBtns([['every','Every week','data-when="Every Monday · 8:00"'],['every','Every month','data-when="First day of the month · 8:00"'],['every','No, thanks','data-when=""']]));
      } else if(k === 'every'){
        const when = b.dataset.when;
        if(!when){ say('<div class="nr__bubble">Okay, just this once.</div>'); return; }
        addRoutine(when, channel);
        say('<div class="nr__bubble">Done: <b>'+rtEsc(label)+' report</b> will go to '+rtEsc(channel)+' '+rtEsc(when.toLowerCase())+'. '+
            '<button type="button" class="home-link" data-sum-routines>View in Routines</button></div>');
      }
    }, 350);
  });
}

/* ---- New dashboard flow (mock) ----
   "+ New dashboard" opens a DRAFT dashboard in the current workspace: "Untitled dashboard", an empty state with
   starter chips, and nothing in the sidebar yet. A chip opens Mira's side panel (insChat = 'build'); Mira shows the

   says what she built, offers a tweak or two as chips and an "Add to dashboard" button. The first Add names the
   dashboard after the block, puts it in the sidebar and removes the highlight; then Mira asks what else to add.
   Closing the panel before the first Add discards the draft; afterwards it only closes the panel.
     insDraft = { dash (the dashboard object, in IN_DASHBOARDS once saved), name, saved, prevNav, pending, used, queue, naming }
     pending  = { label, insightId, left (tweaks not used yet) }  the block being previewed
   Mock data: every starter is an existing insight; only Daily sales has tweaks. */
const INS_ASK = 'Ask Mira…';
const INS_BUILD = {

                                 tweaks:[ { label:'Split by division', insight:'revenue-by-month' }, { label:'Weekly instead', insight:'weekly-sales' } ] },

  'Sales this month':          { insight:'key-numbers', line:'Here are the headline sales numbers for this month.' },
  'Top customers':             { insight:'top-customers', line:'Here are your top customers by revenue this year.' },
  'Open deals by owner':       { insight:'open-deals-by-owner', line:'This insight uses Notion data your account can’t open.' },
};
let insDraft = null;
const insDraftOf = dash => (insDraft && insDraft.dash === dash) ? insDraft : null;
const insOnUnsavedDraft = () => Boolean(insDraft && !insDraft.saved && insNav === insDraft.dash.id);
const insStarters = () => activeWorkspace === 'personal' ? INS_STARTERS.personal : INS_STARTERS.team;
function insOpenDraft(){
  insDraft = { dash:{ id:'new-'+(++insNewDashSeq), ws:activeWorkspace, role:'owner', mine:true, add:'', pins:[] },
    name:'Untitled dashboard', saved:false, pending:null, used:[], queue:null, naming:false,

const insChipBtn = (t, attr) => '<button type="button" class="nr__chip" '+attr+'="'+rtEsc(t)+'">'+rtEsc(t)+'</button>';
function insDraftEmptyHTML(){

    '<div class="nr__chips" style="justify-content:center">'+insStarters().concat(INS_ASK).map(t => insChipBtn(t, 'data-bld-chip')).join('')+'</div></div>';
}
function insBuildPanelHTML(){
  return (
    '<div class="rt-panel__head">'+
      '<span class="rt-panel__who"><img class="nr__avatar" src="'+MIRA_AVATAR+'" alt="Mira"><span class="rt-panel__title">New dashboard</span></span>'+
      rtPanelActionsHTML(false)+
    '</div>'+
    '<div class="rt-panel__body"><div class="rt-reveal" data-bld-thread></div></div>'+
    '<div class="rt-panel__foot">'+
      '<form class="composer" data-bld-form>'+
        '<input class="composer__input" type="text" placeholder="Message Mira…">'+

/* Thread helpers (the panel is built once; everything goes through these) */
const bldThread = () => document.querySelector('#rtPanel [data-bld-thread]');
function bldAdd(html){ const t = bldThread(); if(!t) return; t.insertAdjacentHTML('beforeend', html); t.parentNode.scrollTop = t.parentNode.scrollHeight; }
const bldUser = text => bldAdd('<div class="nr__user">'+rtEsc(text)+'</div>');
const bldSay = html => bldAdd('<div class="nr__bubble">'+html+'</div>');
/* Chips and buttons of the last question go away once it is answered. */
const bldClearLive = () => { const t = bldThread(); if(t) t.querySelectorAll('[data-bld-live]').forEach(x => x.remove()); };
/* Mira "types" for a moment, then `fn` adds her message (skipped if the draft was closed meanwhile). */
function bldReply(fn){
  const t = bldThread(), dr = insDraft;
  if(!t) return;
  bldAdd(MIRA_TYPING);
  setTimeout(() => {
    if(insDraft !== dr || !t.isConnected) return;
    const dots = t.querySelector(':scope > .mira-typing'); if(dots) dots.remove();
    fn();
  }, MIRA_TYPING_MS);
}
/* A chip on the page or in the chat was picked. The panel opens first when needed. */
function insBuildPick(label){
  const dr = insDraft;
  if(!dr || dr.pending) return;   // one block at a time
  const fresh = insChat !== 'build';
  dr.queue = label; insChat = 'build'; render();
  if(!fresh) insBuildRun();       // an open panel is not rebuilt, so run it here (a new one runs from wireInsBuildPanel)
}
function insBuildRun(){
  const dr = insDraft;
  if(!dr || !dr.queue) return;
  const label = dr.queue; dr.queue = null;
  bldUser(label);
  if(label === INS_ASK){
    bldReply(() => { bldSay('What would you like me to keep an eye on?'); const i = document.querySelector('#rtPanel .composer__input'); if(i) i.focus(); });
    return;
  }
  insBuildShow(label);
}
/* The block appears in the grid right away; Mira's reply follows. */
function insBuildShow(label){
  const dr = insDraft, spec = INS_BUILD[label];
  dr.pending = { label, insightId:spec.insight, left:(spec.tweaks || []).slice() };
  render();
  bldReply(() => bldOffer(spec.line+(spec.tweaks ? ' Want to change anything?' : '')));
}
/* Mira's message about the preview: at most one question as chips, then the action row. */
function bldOffer(text){
  const p = insDraft.pending;
  bldClearLive();
  const chips = p.left.length ? p.left.map(t => t.label).concat('Looks right') : [];
  bldAdd('<div class="nr__bubble">'+text+'</div>'+
    (chips.length ? '<div class="nr__chips" data-bld-live>'+chips.map(t => insChipBtn(t, 'data-bld-tweak')).join('')+'</div>' : '')+
    '<div class="nr__actions" data-bld-live><button type="button" class="nr__btn" data-bld-discard>Discard</button><button type="button" class="nr__btn nr__btn--primary" data-bld-add>Add to dashboard</button></div>');
}
function insBuildTweak(label){
  const dr = insDraft, p = dr && dr.pending;
  if(!p) return;
  bldClearLive(); bldUser(label);
  if(label === 'Looks right'){ insBuildAdd(); return; }
  const t = p.left.find(x => x.label === label);
  if(!t) return;
  p.insightId = t.insight; p.left = p.left.filter(x => x !== t);
  render();   // the preview changes in place
  bldReply(() => bldOffer('Done, I updated the preview.'));
}
/* "Discard": the preview goes away (an empty draft shows its starter chips again) and Mira offers the starters again. */
function insBuildDiscard(){
  const dr = insDraft;
  if(!dr || !dr.pending) return;
  bldClearLive(); bldUser('Discard');
  dr.pending = null; render();
  bldReply(() => { bldSay('Okay, I won’t keep it.'); bldReply(bldMore); });
}
/* "Add to dashboard". The first one makes the dashboard real (named after the block, in the sidebar). */
function insBuildAdd(){
  const dr = insDraft, p = dr && dr.pending;
  if(!p) return;
  bldClearLive();
  dr.dash.pins.push({ insightId:p.insightId, size:'S' });
  dr.used.push(p.label); dr.pending = null;
  const first = !dr.saved;
  if(first){
    dr.saved = true; dr.name = p.label;   // (no "Add something…" area: Mira's chat is where more blocks come from)
    IN_DASHBOARDS.push(dr.dash);
    INS_NAV_DASHBOARDS.push({ id:dr.dash.id, label:dr.name, ws:dr.dash.ws });
  }
  render();   // the block loses its highlight; the sidebar gets the new dashboard
  bldReply(() => {
    if(first){
      bldAdd('<div class="nr__bubble">I’ll call the dashboard <b>'+rtEsc(dr.name)+'</b>.</div><div class="nr__chips" data-bld-rn><button type="button" class="nr__chip" data-bld-rename>Rename</button></div>');
      bldReply(bldMore);
    } else { bldSay('Added to <b>'+rtEsc(dr.name)+'</b>.'); bldReply(bldMore); }
  });
}
function bldMore(){
  const dr = insDraft;
  bldClearLive();
  const more = insStarters().filter(l => !dr.used.includes(l)).concat(INS_ASK);
  // Nothing is saved yet (the first block was discarded): ask again from the start, no "That's all for now".
  bldAdd('<div class="nr__bubble">'+(dr.saved ? 'Anything else to keep an eye on?' : 'What should this dashboard keep an eye on?')+'</div><div class="nr__chips" data-bld-live>'+
    more.map(t => insChipBtn(t, 'data-bld-more')).join('')+(dr.saved ? '<button type="button" class="nr__chip" data-bld-done>That’s all for now</button>' : '')+'</div>');
}
/* Typed text: a new name, a request for a block (mapped to the closest starter), or a nudge to use the buttons. */
function insBuildText(text){
  const dr = insDraft;
  bldUser(text);
  if(dr.naming){
    dr.naming = false; dr.name = text;
    const n = INS_NAV_DASHBOARDS.find(x => x.id === dr.dash.id); if(n) n.label = text;
    render();
    bldReply(() => bldSay('Renamed to <b>'+rtEsc(text)+'</b>.'));
  } else if(dr.pending){
    bldReply(() => bldSay('Use the options above to change it, or add it as it is.'));
  } else {
    const words = text.toLowerCase().split(/\W+/).filter(w => w.length > 3);
    const all = insStarters(), unused = all.filter(l => !dr.used.includes(l));
    const label = all.find(l => words.some(w => l.toLowerCase().includes(w))) || unused[0] || all[0];
    bldClearLive(); insBuildShow(label);
  }
}
function wireInsBuildPanel(host, dr){
  host.addEventListener('click', e => {
    if(insDraft !== dr) return;   // #rtPanel is reused: handlers of earlier chats stay quiet
    const q = sel => e.target.closest(sel);
    if(q('[data-bld-add]')) insBuildAdd();
    else if(q('[data-bld-discard]')) insBuildDiscard();
    else if(q('[data-bld-tweak]')) insBuildTweak(q('[data-bld-tweak]').textContent);
    else if(q('[data-bld-more]')){ const l = q('[data-bld-more]').textContent; bldClearLive(); dr.queue = l; insBuildRun(); }
    else if(q('[data-bld-done]')){
      bldClearLive(); bldUser('That’s all for now');
      bldReply(() => bldSay('Okay. Everything is saved in <b>'+rtEsc(dr.name)+'</b>.'));
    } else if(q('[data-bld-rename]')){
      host.querySelectorAll('[data-bld-rn]').forEach(x => x.remove());
      bldUser('Rename'); dr.naming = true;
      bldReply(() => { bldSay('What should it be called?'); host.querySelector('.composer__input').focus(); });
    }
  });
  const form = host.querySelector('[data-bld-form]'), input = form.querySelector('input');
  form.addEventListener('submit', e => { e.preventDefault(); const t = input.value.trim(); input.value = ''; if(t) insBuildText(t); });
  insBuildRun();   // the chip that opened the panel
}

/* ---- Pin from the Ask Mira chat (mock) ----
   Sending a message in the Ask Mira hero starts a conversation (cvStart). Mira answers in one sentence with the
   insight card INSIDE the message (the same InsightCard as on a dashboard), no side panel.
   Rule "answer vs insight": a question about data that changes over time gets a card and a way to keep it; a one-off
   fact ("how many invoices on 3 March?") is only an answer, no Pin.
   Under an insight ONE row of chips: tweak chips (they change the card in the message) and a split chip with a pin icon,
   "Pin to <last used dashboard of this workspace>", whose caret opens the other dashboards, Home and New dashboard…. Pinning to a shared dashboard first shows a heads-up (the one
   moment private data becomes the team's). Pinning turns the pin chip into "✓ Pinned to … · Open" (no toast).
   A question that is already pinned says so, with Open, instead of offering Pin. The card lands at the end of the
   dashboard with a short "New" highlight (dash.newPin). A pin references the insight by id; nothing is copied.
     conv = { id, entries, naming }   entry = { role:'user', text } | { role:'mira', kind:'text', html, ui } | { role:'mira', kind:'answer', insight, done } */
const insLastDash = {};   // workspace id → last dashboard opened (or pinned to) there
let cvSeq = 0;
const CV_ANSWERS = {
  'sales-this-month':    'About 12% behind last month, mostly in Automation. At this pace you’ll end near SAR 1.62M.',
  'daily-sales':         'Here’s daily invoiced sales for the last 60 days.',
  'weekly-sales':        'Here’s the same thing per week.',
  'revenue-by-month':    'Here’s invoiced revenue by month, split by division.',
  'revenue-by-division': 'Here’s how revenue splits across divisions this year.',
  'top-customers':       'Your top five customers bring in 38.5% of revenue this year.',
  'quotes-waiting':      'Three quotes you sent have had no reply yet.',
  'my-open-items':       'You have 12 open items, 3 of them overdue.',
  'open-deals-by-owner': 'This insight uses Notion data your account can’t open.',
};
const CV_TWEAKS = {   // chips that swap the card in the message
  'sales-this-month': [ { label:'By division', insight:'revenue-by-division' }, { label:'Daily instead', insight:'daily-sales' } ],
  'daily-sales':      [ { label:'Weekly instead', insight:'weekly-sales' }, { label:'Split by division', insight:'revenue-by-month' } ],
};
const CV_DATE = /\b(?:\d{1,2}(?:st|nd|rd|th)?\s+(?:of\s+)?(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}(?:st|nd|rd|th)?|yesterday)\b/i;
function cvPickInsight(text){
  const t = text.toLowerCase();
  if(/daily|per day|chart/.test(t)) return 'daily-sales';
  if(/customer/.test(t)) return 'top-customers';
  if(/quote/.test(t)) return 'quotes-waiting';
  if(/overdue|task|open item/.test(t)) return 'my-open-items';
  if(/deal|owner/.test(t)) return 'open-deals-by-owner';

/* Where "Pin to …" goes by default: the dashboard last used in this workspace (one you can edit), else the first one. */
function cvDefaultDash(){
  const ok = d => d.ws === activeWorkspace && d.role !== 'viewOnly';
  return IN_DASHBOARDS.find(d => d.id === insLastDash[activeWorkspace] && ok(d)) || IN_DASHBOARDS.find(ok) || null;
}
const cvDuplicate = id => IN_DASHBOARDS.find(d => d.ws === activeWorkspace && d.pins.some(p => p.insightId === id));
/* Who else sees a dashboard: null for a private one, else the team's name ("Sales team"). */
function cvTeam(dash){
  if(dash.ws === 'personal') return null;
  const w = WORKSPACES.find(x => x.id === dash.ws) || {};
  return dash.sharedWith || (w.short || w.name || 'Team')+' team';

/* Pinning to a TEAM dashboard always asks first, and says who will see it and whose access it runs on (the pinner's).
   Personal needs no confirmation. Returns the sentence, or null for a private dashboard. `dash` only needs a `ws`. */
function insPinWho(insightId, dash){

function cvRowsHTML(ui){

function cvAnswerHTML(e){

  const others = IN_DASHBOARDS.filter(d => d.ws === activeWorkspace && d.role !== 'viewOnly').map(d => item(rtEsc(insDashLabel(d.id)), 'data-cv-act="pin2" data-cv-arg="'+d.id+'"')).join('');

const cvEntryInner = e => e.kind === 'answer' ? cvAnswerHTML(e) : '<div class="nr__bubble">'+e.html+'</div>'+cvRowsHTML(e.ui);
const cvWrap = (e, i) => e.role === 'user' ? '<div class="nr__user">'+rtEsc(e.text)+'</div>' : '<div class="cv-msg" data-cv-i="'+i+'">'+cvEntryInner(e)+'</div>';
function cvHTML(conv){

    '<div class="nr__scroll is-static" data-cv-scroll data-cv-conv="'+conv.id+'">'+
      '<div class="nr__from"><img class="nr__avatar" src="'+MIRA_AVATAR+'" alt=""><span class="nr__name">Mira</span></div>'+
