:root{
  /* ---- Font weights: three only. 400 = text you read (descriptions, metadata, table values, inactive nav,
     KPI labels); 500 = text you click or scan (buttons, active nav, card/row titles, field labels, column
     headers, group eyebrows, inline emphasis); 600 = text that organises the page (page/section titles, big
     KPI numbers, workspace switcher). No 700. Weight = importance, colour = secondary, size = placement. ---- */
  --fw-regular:400;
  --fw-medium:500;
  --fw-semibold:600;
  --font:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  /* ---- Grey palette: the only neutrals used in the app (taken from the Figma kit) ---- */
  --c-ink:#111111;            /* active nav, primary buttons */
  --c-text:#171717;           /* headings, values */
  --c-text-2:#262626;         /* profile name */
  --c-copy:#525252;           /* body copy / descriptions / metadata (weight 400 text) */
  --c-muted:#858585;          /* secondary text, inactive nav, icons */
  --c-border:#ececed;         /* card borders, dividers */
  --c-border-strong:#e4e4e4;  /* panel rules, off toggle, avatar bg */
  --c-bg:#fafafa;             /* canvas / sidebar */
  --c-surface:#ffffff;        /* cards, panels */
  --c-hover:rgba(17,17,17,.04);   /* row hover / active fill */
  --c-hover-2:rgba(17,17,17,.08); /* stronger hover / pressed */
  /* ---- Status colours ---- */
  --c-error:#CC3430;          /* error / failing / risk: labels, badges, destructive actions */
  /* ---- Brand colours ---- */
  --c-brand-turquoise:#00F4D7;
  --c-brand-purple:#8855D2;
  --c-brand-purple-light:#D0C0EC;   /* tint of the brand purple: active pills / chips */
  --c-brand-pink:#FF00AB;
  /* ---- Chart colours (Insights). Rules live in the CHART helpers in the
     script. Light theme only. Dark theme values for this group are not defined yet.
     Brand tokens are aliased, never changed. ---- */
  /* Categorical: distinct series, fixed order, never cycled or reordered. */
  --chart-cat-1:var(--c-brand-purple);   /* purple = brand purple (#8855D2) */
  --chart-cat-2:#007A6E;                 /* teal */
  --chart-cat-3:#D47A00;                 /* amber */
  --chart-cat-4:#D6338F;                 /* pink */
  --chart-cat-5:#1E4B8D;                 /* navy */
  --chart-cat-6:#885538;                 /* brown */
  --chart-other:#A3A3A3;                 /* "Other" (series 6+) */
  /* Sequential purple ramp: parts of one whole. 500 = brand purple. */
  --chart-seq-100:#F2EFFF;
  --chart-seq-200:#E3DCFD;
  --chart-seq-300:#CABEF7;
  --chart-seq-400:#AA95E8;
  --chart-seq-500:var(--c-brand-purple);
  --chart-seq-600:#6849AB;
  --chart-seq-700:#543A8B;
  --chart-seq-800:#402C6A;
  --chart-seq-900:#2C1F4B;
  /* Diverging (amber <-> neutral <-> purple): a deviation without a good/bad judgment. Purple side = seq 100/300/500/700. */
  --chart-amber-700:#925000;
  --chart-amber-500:#D47A00;
  --chart-amber-300:#EDBD86;
  --chart-amber-100:#FBECD9;
  --chart-mid:#E6E6E6;
  /* Semantic: status only, never a category. Always paired with a sign or icon (▲ ▼ + −). */
  --chart-positive:#009161;   /* negative = --c-error (one red for every error / bad-change state) */
  --chart-warning:#D47A00;
  /* Chrome */
  --chart-target:#4C4C4C;                /* target line, dashed */
  --chart-prior:#D9D9D9;                 /* prior period (and stale / old data) */
  --chart-grid:#ECECEC;                  /* gridlines */
  /* Legacy names kept as aliases so existing rules keep working */
  --ink:var(--c-ink);
  --name:var(--c-text-2);
  --slate:var(--c-muted);
  --slate-icon:var(--c-muted);
  --line:var(--c-border);
  --sidebar-w:240px;
  --sidebar-border:var(--c-border);  /* vertical rule on the side nav */
  --pill-border:var(--c-border-strong);      /* active nav item outline */
  --accent:var(--c-brand-purple);   /* content accent (tabs, radios, progress) = brand purple, unused in shell */
  --radius:12px;

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  /* Flat near-white canvas. The sidebar and secondary menu sit directly on this
     background with no container of their own; the main content and the chat
     panel float above it as white, outlined cards. */
  background:var(--c-bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}

/* ---------- App frame ---------- */
/* Fixed-height shell: the app fills the viewport and does not scroll itself —
   only .main scrolls internally, so the sidebar (and chat panel) stay put. */
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  /* Full viewport height and never scrolls — only .main scrolls (see .app /
     .main). The nav stays fixed in place. */
  height:100vh;
  /* 8px horizontal inset: the nav items sit 8px from the left screen edge, and
     the 8px right padding forms the visible gutter to the content card (which
     butts against the sidebar box edge with margin-left:0). Top/bottom unchanged. */
  padding:14px 8px 16px;
  display:flex;
  flex-direction:column;
  gap:4px;
  /* No divider: the nav sits directly on the flat canvas, "in the background". */
}
.sidebar__top{
  display:flex;align-items:center;justify-content:space-between;
  height:40px;padding:0 10px;margin-bottom:10px;
}
.brand{display:inline-flex;align-items:center;color:var(--name)}
.brand__logo{height:11px;width:auto;display:block}
/* ---------- Team switcher in place of the Binome logo (all layouts) ---------- */
.teamsw{position:relative;display:none;min-width:0}
body.nav-e .teamsw{display:block}
body.nav-e .brand{display:none}
.sidebar.is-collapsed .teamsw{display:none}
.teamsw__btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:7px 10px;margin-left:-10px;border:none;background:transparent;color:var(--name);font-size:15px;font-weight:var(--fw-semibold);cursor:pointer;transition:background .12s ease}
.teamsw__btn:hover,.teamsw__btn[aria-expanded="true"]{background:var(--c-hover)}
.teamsw__btn svg{color:var(--slate-icon);flex:0 0 16px}
.teamsw__menu{
  position:absolute;left:-8px;top:calc(100% + 6px);z-index:40;width:268px;
  background:#fff;border:1px solid var(--c-border);border-radius:12px;
  box-shadow:0 12px 32px rgba(136,85,210,.14);padding:6px;
}
/* In E the workspace switch lives at the top, so the account popover drops its Workspace block. */
body.nav-e .account-menu__ws,
body.nav-e .account-menu__label,
body.nav-e .account-menu__ws + .account-menu__sep{display:none}
.sidebar__top-actions{display:inline-flex;align-items:center;gap:2px;margin-right:-6px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;
  border:none;background:transparent;border-radius:8px;color:var(--slate-icon);
}
.icon-btn:hover{background:var(--c-hover);color:var(--slate)}
/* Top-row nav actions (notifications bell, collapse panel): 16px glyphs to match
   the nav link icons. CSS overrides the inline width/height="20" on the SVGs. */
.sidebar__top-actions .icon-btn svg{width:16px;height:16px}

/* ---------- Collapsed sidebar (icon rail) ----------
   The existing "Collapse sidebar" button toggles .is-collapsed on .sidebar. The sidebar shrinks
   to a 56px rail: only icons (labels, badges, group headers, Mira sub-list and the profile text
   are hidden) and the same button becomes the expand control. Labels show as native tooltips
   (title set on hover, see the sidebar collapse block in the script). */
.sidebar{transition:width .22s cubic-bezier(.4,0,.2,1),flex-basis .22s cubic-bezier(.4,0,.2,1)}
.sidebar.is-collapsed{--sidebar-w:56px}
.sidebar.is-collapsed .sidebar__top{justify-content:center;height:auto;padding:0}
.sidebar.is-collapsed .brand{display:none}
/* Bell stays visible: the two top actions stack vertically (expand button, then notifications). */
.sidebar.is-collapsed .sidebar__top-actions{flex-direction:column-reverse;gap:4px;margin-right:0}
.sidebar.is-collapsed [data-sidebar-toggle] svg{transform:scaleX(-1)}
.sidebar.is-collapsed .navlink,
.sidebar.is-collapsed .adv-back{justify-content:center;padding-left:0;padding-right:0;gap:0}
.sidebar.is-collapsed .navlink__label,
.sidebar.is-collapsed .navlink__badge,
.sidebar.is-collapsed .navlink__chev,
.sidebar.is-collapsed .adv-back > span:not(.adv-back__icon),
.sidebar.is-collapsed .adv-sectlabel,
.sidebar.is-collapsed .nav-group__header,
.sidebar.is-collapsed .nav-sub,
.sidebar.is-collapsed .navrow__action{display:none}
/* Ask Mira pill becomes a 40px round button. */
.sidebar.is-collapsed .navrow--mira{width:40px;height:40px;margin:0 auto}
.sidebar.is-collapsed .navrow__main{justify-content:center;padding:0;gap:0}
.sidebar.is-collapsed .navrow--mira .navrow__main{padding:0}
/* Profile: avatar only; the account popover keeps its full width, anchored to the rail's left edge. */
.sidebar.is-collapsed .profile{justify-content:center;padding:8px 0}
.sidebar.is-collapsed .profile__meta,
.sidebar.is-collapsed .profile__switch{display:none}
.sidebar.is-collapsed .account-menu{right:auto;width:268px}

/* nav */
.nav{display:flex;flex-direction:column;gap:2px}

/* ---------- Reusable link component ---------- */
.navlink{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:9px 12px;
  border:1px solid transparent;background:transparent;
  border-radius:10px;
  font-size:14px;font-weight:var(--fw-medium);
  color:var(--slate);
  text-align:left;text-decoration:none;
  transition:background .12s ease,color .12s ease;
}
.navlink:hover{background:var(--c-hover);color:var(--ink)}
.navlink:hover .navlink__icon{color:var(--slate)}
/* mock links (prototype only): look normal but are not interactive (same idea as the disabled .ws rows) */
.navlink:disabled{cursor:default}
.navlink:disabled:hover{background:transparent;color:var(--slate)}
.navlink__icon{flex:0 0 16px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-icon)}
.navlink__icon svg{width:16px;height:16px;display:block}
.navlink__avatar{width:16px;height:16px;border-radius:50%;display:block;object-fit:cover}
.navlink__label{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlink__badge{
  flex:0 0 auto;min-width:18px;height:18px;padding:0 5px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:var(--fw-semibold);line-height:1;
  color:#fff;background:var(--accent);border-radius:9px;
}
/* Selected state reads the same as hover: the subtle highlight wash, no white
   pill or outline. The transparent base border stays, so there's no size shift. */
.navlink.is-active{
  background:var(--c-hover);color:var(--ink);
}
.navlink.is-active .navlink__icon{color:var(--ink)}
/* floating highlight that slides between active nav links (see glideNavHighlight) */
.nav-glide{position:fixed;z-index:50;pointer-events:none;border-radius:10px;background:var(--c-hover)}
/* While the floating highlight travels, the target link's own fill must be gone at once: without
   transition:none the .12s background fade would leave a second, fading highlight under the glide. */
.navlink.is-gliding,.navlink.is-gliding.is-active{background:transparent;transition:none}

/* collapsible section (e.g. Apps) */
.nav-group{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.nav-group__header{
  display:flex;align-items:center;gap:6px;width:100%;
  padding:6px 12px;border:none;background:transparent;border-radius:8px;
  text-align:left;color:var(--slate);
  transition:background .12s ease;
}
.nav-group__header:hover{background:var(--c-hover)}
.nav-group__label{
  flex:1 1 auto;font-size:12px;font-weight:var(--fw-medium);
  color:var(--slate);
  /* Eyebrow style shared with Home section titles: IBM Plex Mono, all caps. */
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;
}
.nav-group__chev{flex:0 0 auto;display:inline-flex;color:var(--slate-icon);transition:transform .15s ease}
.nav-group__chev svg{width:13px;height:13px;display:block}
.nav-group__header:not(.is-open) .nav-group__chev{transform:rotate(-90deg)}
/* Chevron on the right of a nav link that expands a list under it (Insights): down = open, right = closed */
.navlink__chev{flex:0 0 auto;display:inline-flex;color:var(--slate-icon);transition:transform .15s ease}
.navlink__chev svg{width:13px;height:13px;display:block}
.navlink__chev:not(.is-open){transform:rotate(-90deg)}

/* spacer pushes the footer group to the bottom */
.nav__spacer{flex:1 1 auto}
/* spacing separating the Mira section from the work section */
.nav--work{margin-top:14px}
.nav-sep{height:14px}

/* Mira row with a compose (new chat) action */
.navrow{display:flex;align-items:center;width:100%;border:1px solid transparent;border-radius:10px;transition:background .12s ease}
.navrow:hover{background:var(--c-hover)}
.navrow.is-active{background:var(--c-hover)}
.navrow__main{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;
  padding:9px 2px 9px 12px;border:none;background:transparent;
  font-size:14px;font-weight:var(--fw-medium);color:var(--slate);text-align:left;
  transition:color .12s ease;
}
.navrow:hover .navrow__main,.navrow.is-active .navrow__main{color:var(--ink)}
.navrow__main .navlink__icon{color:var(--slate-icon)}
.navrow.is-active .navrow__main .navlink__icon{color:var(--ink)}
.navrow__action{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;margin-right:6px;
  border:none;background:transparent;border-radius:8px;color:var(--slate-icon);
  transition:background .12s ease,color .12s ease;
}
.navrow__action:hover{background:var(--c-hover-2);color:var(--slate)}
.navrow__ico{display:inline-flex}
.navrow__ico svg{width:16px;height:16px;display:block}

/* Ask Mira row (Figma): a 38px full-pill with the pale blue→purple gradient,
   white label, 16px round avatar and a white new-chat icon. */
.navrow--mira,.navrow--mira:hover,.navrow--mira.is-active{position:relative;overflow:hidden;border-radius:999px;height:38px;background:var(--mira-flow) center/cover no-repeat,#c9a8e0}
.navrow--mira::after,.ask-mira::after{   /* hover overlay: slightly darkens the artwork */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:var(--c-hover-2);opacity:0;transition:opacity .15s ease;
}
.navrow--mira:hover::after,.navrow--mira.is-active::after,.ask-mira:hover::after{opacity:1}
.navrow--mira .navrow__main,.navrow--mira:hover .navrow__main,.navrow--mira.is-active .navrow__main{
  position:relative;z-index:1;color:#fff;padding:0 2px 0 12px;align-self:stretch;
}
.navrow--mira .navrow__main .navlink__icon,.navrow--mira.is-active .navrow__main .navlink__icon{color:#fff;width:16px;height:16px;flex:0 0 16px}
.navrow--mira .navlink__avatar{width:16px;height:16px;border-radius:8px;display:block}
.navrow--mira .navrow__action{position:relative;z-index:1;color:#fff;margin-right:8px}
.navrow--mira .navrow__action:hover{background:rgba(255,255,255,.2);color:#fff}

/* conversation list under Mira — animates open/closed via grid-template-rows */
.nav-sub{
  display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1), opacity .18s ease;
}
.nav-sub.is-open{grid-template-rows:1fr;opacity:1}
.nav-sub__inner{
  position:relative;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;gap:1px;padding:3px 0;
}
.nav-sub__inner::before{content:"";position:absolute;left:21px;top:6px;bottom:34px;width:1.5px;background:var(--sidebar-border);border-radius:1px}
.nav-sub__item{
  position:relative;width:100%;padding:7px 12px 7px 40px;
  border:1px solid transparent;background:transparent;border-radius:9px;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--slate);
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .12s ease,color .12s ease;
}
/* Hover/active fill is painted over the sidebar colour (and lifted above the vertical guide
   line), so the line doesn't show through the highlighted item — it just continues around it. */
.nav-sub__item:hover,.nav-sub__item.is-active{
  background:linear-gradient(var(--c-hover),var(--c-hover)),var(--c-bg);color:var(--ink);z-index:1;
}
.nav-sub__item--add{color:var(--slate-icon)}
.nav-sub__item--add:hover{color:var(--ink)}
.nav-sub__viewall{
  width:100%;padding:6px 12px 6px 40px;border:none;background:transparent;border-radius:9px;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--slate-icon);text-align:left;
  transition:color .12s ease;
}
.nav-sub__viewall:hover{color:var(--slate)}

/* ---------- Sidebar footer ---------- */
.sidebar__footer{display:flex;flex-direction:column;gap:6px}
.profile{
  display:flex;align-items:center;gap:11px;
  width:100%;padding:8px 10px;margin-top:4px;
  border:none;background:transparent;border-radius:12px;
  text-align:left;transition:background .12s ease;
}
.profile:hover{background:var(--c-hover)}
.avatar{
  flex:0 0 32px;width:32px;height:32px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:#ece4f8;color:#5b34a0;font-size:13px;font-weight:var(--fw-semibold); /* light purple + dark purple, same as the Sales tag on Home */
}
.profile__meta{flex:1 1 auto;min-width:0;line-height:1.25;display:flex;flex-direction:column}
.profile__name,.profile__sub{display:block}
.profile__name{font-size:14px;font-weight:var(--fw-medium);color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile__sub{font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile__switch{flex:0 0 auto;color:var(--slate-icon)}
.profile__switch svg{width:16px;height:16px;display:block}

/* ---------- Account switch popover ---------- */
.account{position:relative}
.profile[aria-expanded="true"]{background:var(--c-hover-2)}
/* popover floats above the profile button, left-aligned to the sidebar */
.account-menu{
  position:absolute;left:0;right:auto;width:268px;bottom:calc(100% + 8px);z-index:40;   /* wider than the sidebar so team names stay on one line */
  background:#fff;border:1px solid var(--c-border);border-radius:12px;
  box-shadow:0 12px 32px rgba(136,85,210,.14);padding:6px;
}
.account-menu__id{padding:10px 10px 8px}
.account-menu__name{display:block;font-size:14px;font-weight:var(--fw-semibold);color:var(--ink)}
.account-menu__email{display:block;font-size:12px;color:var(--slate);margin-top:1px}
.account-menu__sep{height:1px;background:var(--c-border);margin:5px 0}
.account-menu__label{padding:6px 10px 4px;font-size:11px;font-weight:var(--fw-medium);letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
/* a workspace row: icon · name · role · checkmark (checkmark only when active) */
.ws{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border:none;background:transparent;border-radius:9px;
  text-align:left;cursor:pointer;transition:background .12s ease;
}
.ws:hover{background:var(--c-hover)}
/* mock rows (prototype only): look normal but are not interactive */
.ws:disabled{cursor:default}
.ws:disabled:hover{background:transparent}
.ws__icon{flex:0 0 18px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-icon)}
.ws__icon svg{width:18px;height:18px;display:block}
.ws__name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
.ws__name{white-space:nowrap;display:flex;align-items:center;gap:8px}
/* Needs-you count: the inverse of the "High" badge (solid dark red, white number) */
.ws__count{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--c-error);color:#fff;font-size:11px;font-weight:var(--fw-medium);line-height:1}
.ws__role{flex:0 0 44px;width:44px;text-align:left;font-size:12px;color:var(--slate)}  /* fixed width so Admin / Team start at the same left edge */
.ws__check{flex:0 0 16px;width:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ws__check svg{width:16px;height:16px;display:block}
.ws:not(.is-active) .ws__check{visibility:hidden}
/* Settings / Log out rows */
.account-menu__item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px;border:none;background:transparent;border-radius:9px;
  font-size:14px;font-weight:var(--fw-medium);color:var(--ink);text-align:left;cursor:pointer;
  transition:background .12s ease;
}
.account-menu__item:hover{background:var(--c-hover)}
.account-menu__item .mi{flex:0 0 18px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-icon)}
.account-menu__item .mi svg{width:18px;height:18px;display:block}

/* ---------- Secondary menu panel (e.g. Chat) ---------- */
.submenu-panel{
  flex:0 0 240px;width:240px;height:100vh;
  padding:68px 12px 16px;        /* top aligns the first row with the primary nav */
  display:flex;flex-direction:column;
  /* No divider: stays in the background, consistent with the primary nav. */
}
.submenu__top{display:flex;flex-direction:column;gap:2px}
.subitem{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 12px;border:none;background:transparent;border-radius:10px;
  font-size:14px;font-weight:var(--fw-medium);color:var(--slate);text-align:left;
  transition:background .12s ease,color .12s ease;
}
.subitem:hover{background:var(--c-hover);color:var(--ink)}
.subitem__icon{flex:0 0 18px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-icon)}
.subitem__icon svg{width:18px;height:18px;display:block}
/* New chat = primary action, slightly emphasised */
.subitem--action{color:var(--ink)}
.subitem--action .subitem__icon{color:var(--ink)}

.search{
  display:flex;align-items:center;gap:9px;
  margin:12px 0 0;padding:9px 12px;   /* New chat → Search = Insights → Apps (14px) */
  background:var(--c-bg);border:1px solid transparent;border-radius:10px;color:var(--slate-icon);
  transition:border-color .12s ease,background .12s ease;
}
.search:focus-within{background:#fff;border-color:var(--pill-border)}
.search__icon{flex:0 0 16px;width:16px;height:16px;display:inline-flex}
.search__icon svg{width:16px;height:16px;display:block}
.search__input{
  flex:1 1 auto;min-width:0;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:14px;color:var(--ink);
}
.search__input::placeholder{color:var(--slate-icon)}

/* chat history list */
.chatlist{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:2px}
.chatgroup__label{   /* same font as the "Apps" label in the primary nav */
  padding:12px 12px 5px;font-size:12px;font-weight:var(--fw-medium);color:var(--slate);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;
}
.chatgroup__label:first-child{padding-top:14px}
.chatitem{
  width:100%;padding:8px 12px;border:1px solid transparent;background:transparent;border-radius:9px;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--slate);
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .12s ease,color .12s ease;
}
.chatitem:hover{background:var(--c-hover);color:var(--ink)}
.chatitem.is-active{background:var(--c-hover);color:var(--ink)}

/* ---------- Main ---------- */
/* The main content is a white card floating on the flat canvas. It stretches to
   the shell height minus its top/bottom margins (via the shell's default
   align-items:stretch) and scrolls its content internally, leaving the sidebar
   fixed. Margins: 8px top/right/bottom, and 0 on the left — the 8px visible
   gutter to the nav comes from the sidebar's 8px right padding. When the chat
   panel is open, the card's 8px right margin becomes the gutter to that panel. */
.main{
  flex:1 1 auto;min-width:0;
  /* Card with 8px margins: 8px top/right/bottom. The left is 0 because the
     sidebar's 8px right padding supplies the 8px gutter, matching the nav's 8px
     inset from the left screen edge. */
  margin:8px 8px 8px 0;
  background:#fff;
  border:1px solid var(--c-border);
  border-radius:10px;
  overflow-y:auto;
  display:flex;flex-direction:column;position:relative;
}

/* right pane */
.content{flex:1 1 auto;min-width:0;padding:28px 40px 40px}
.content--chat{display:flex;justify-content:center;padding:0 40px}

/* chat empty state */
.chat-hero{width:100%;max-width:880px;margin-top:17vh;display:flex;flex-direction:column;align-items:center;gap:26px}
.chat-hero__title{
  margin:0;text-align:center;
  font-size:clamp(30px,3.6vw,46px);font-weight:var(--fw-semibold);letter-spacing:-.01em;color:var(--ink);
}
.mira{
  background:linear-gradient(95deg,#8752be 0%,#b440af 40%,#7d88bc 66%,#5cc9d2 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.composer{
  width:100%;display:flex;align-items:center;gap:6px;
  padding:9px 10px 9px 14px;
  background:#fff;border:1px solid var(--c-border-strong);border-radius:12px;
  box-shadow:0 10px 30px rgba(136,85,210,.06),0 1px 2px rgba(136,85,210,.04);
}
.composer__btn{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border:none;background:transparent;border-radius:10px;color:var(--slate);
}
.composer__btn:hover{background:var(--c-hover)}
.composer__btn svg{width:20px;height:20px;display:block}
.composer__input{
  flex:1 1 auto;min-width:0;height:42px;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:16px;color:var(--ink);
}
.composer__input::placeholder{color:var(--slate-icon)}
.composer__send{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border:none;border-radius:11px;background:var(--c-border);color:var(--slate-icon);
  transition:background .12s ease,color .12s ease;
}
.composer__send:hover{background:var(--c-border-strong);color:var(--slate)}
.composer__send svg{width:19px;height:19px;display:block}

/* Ask Mira empty state: a short greeting,
   then one wide fully-rounded input. Sits a bit above vertical centre. Scoped
   with --hero modifiers so the side-panel and New-routine composers keep theirs. */
.chat-hero--ask{max-width:768px;margin-top:30vh;gap:30px}
.chat-hero--ask .chat-hero__title{font-size:26px;font-weight:var(--fw-medium);letter-spacing:-.01em;line-height:1.25}
.composer--hero{
  gap:4px;padding:8px 8px 8px 12px;min-height:54px;
  border-radius:999px;border:1px solid var(--c-border);background:var(--c-surface);
  /* soft, wide glow rather than a drop shadow */
  box-shadow:0 0 0 1px rgba(136,85,210,.01),0 8px 40px rgba(136,85,210,.06),0 1px 2px rgba(136,85,210,.04);
}
.composer--hero .composer__btn{width:36px;height:36px;border-radius:50%;color:var(--c-ink)}
.composer--hero .composer__btn svg{width:20px;height:20px}
.composer--hero .composer__input{height:36px;font-size:16px;padding:0 4px}
.composer--hero .composer__send{width:36px;height:36px;border-radius:50%;background:var(--c-ink);color:#fff}
.composer--hero .composer__send:hover{background:var(--c-text-2);color:#fff}

/* Suggestion pills under the input — empty state only. Clicking one drops its
   text into the input (see the 'mira' branch of render()). */
.chat-sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:-6px}
.chat-sugg__pill{
  padding:6px 12px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--c-text);cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.chat-sugg__pill:hover{background:var(--c-hover);border-color:var(--c-border-strong)}

/* ---------- Tasks ---------- */
.wl{max-width:1320px}
.wl__head{margin-bottom:22px}
.wl__title{margin:0 0 6px;font-size:28px;font-weight:var(--fw-semibold);letter-spacing:-.01em;color:var(--c-text)}
.wl__subtitle{margin:0;max-width:960px;font-size:14px;line-height:1.5;color:var(--c-copy)}

/* tabs row */
.wl-tabsrow{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--c-border);margin-bottom:18px}
.wl-tabs{display:flex;gap:4px}
.wl-tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 6px 12px;margin-bottom:-1px;
  border:none;background:transparent;border-bottom:2px solid transparent;
  font-size:14px;font-weight:var(--fw-medium);color:var(--slate);
  transition:color .12s ease;
}
.wl-tab:hover{color:var(--ink)}
.wl-tab__icon{display:inline-flex}.wl-tab__icon svg{width:17px;height:17px;display:block}
.wl-tab.is-active{color:var(--c-brand-purple);border-bottom-color:var(--c-brand-purple)}
.wl-tab.is-active .wl-tab__icon{color:var(--c-brand-purple)}

/* List / Board toggle */
.wl-view{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--c-border);border-radius:9px;margin-bottom:6px}
.wl-view__item{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 12px;border:none;background:transparent;border-radius:7px;
  font-size:13px;font-weight:var(--fw-medium);color:var(--slate);
  transition:background .12s ease,color .12s ease;
}
.wl-view__item:hover{color:var(--ink)}
.wl-view__icon{display:inline-flex}.wl-view__icon svg{width:16px;height:16px;display:block}
.wl-view__item.is-active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(136,85,210,.08)}

/* toolbar */
.wl-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.wl-toolbar__left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* right cluster: collapsible search sits next to the New action button */
.wl-toolbar__right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Collapsible search. Collapsed = a ghost 38px square (no background, no border)
   showing just the magnifier. Opening (.is-open, toggled by wireCollapsibleSearch)
   animates the width out AND fades in the white field + border; overflow:hidden
   clips the input while collapsed so it slides in. */
.wl-search{
  display:inline-flex;align-items:center;height:38px;overflow:hidden;
  background:transparent;border:1px solid transparent;border-radius:999px;
  width:38px;transition:width .18s ease,background .12s ease,border-color .12s ease;
}
.wl-search:not(.is-open) .wl-search__btn:hover{background:var(--c-hover);border-radius:999px}
.wl-search.is-open{width:240px;background:#fff;border-color:var(--c-border)}
.wl-search__btn{
  flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--slate-icon);cursor:pointer;
}
.wl-search__btn svg{width:16px;height:16px;display:block}
.wl-search__input{flex:1 1 auto;min-width:0;padding-right:12px;border:none;background:transparent;outline:none;font-family:inherit;font-size:13px;color:var(--ink)}
.wl-search__input::placeholder{color:var(--slate-icon)}
/* Clear (×) button at the right end of the open field; hidden until there is text. */
.wl-search__clear{display:none;flex:none;width:24px;height:24px;margin-right:6px;align-items:center;justify-content:center;
  border:none;border-radius:50%;background:transparent;color:var(--slate-icon);cursor:pointer;transition:background .12s ease}
.wl-search__clear svg{width:14px;height:14px;display:block}
.wl-search__clear:hover{background:var(--c-hover)}
.wl-search.is-open.has-value .wl-search__clear{display:inline-flex}
/* Standalone toggle filter pills (Needs you, Unassigned, Show canceled).
   is-active = engaged, revealing a trailing X. Rounded 999px pills shared by
   the Tasks and Routines toolbars so the two read as one system. */
.wl-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--c-border);background:#fff;border-radius:999px;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--slate);
  cursor:pointer;transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.wl-pill:hover{background:var(--c-bg);color:var(--ink)}
.wl-pill.is-active{background:var(--c-brand-purple-light);border-color:var(--c-brand-purple-light);color:var(--ink)}
/* Trailing X on a toggle pill — hidden until the pill is applied (is-active),
   then shown on the right in the current text colour (inherit). display:none
   means it adds no gap when off; the pill's 6px gap spaces it when shown. */
.wl-pill__x{display:none;color:inherit}
.wl-pill.is-active .wl-pill__x{display:inline-flex}
.wl-pill__x svg{width:14px;height:14px;display:block}
/* Count badge — a small circle on the right, inside the pill. */
.wl-pill__count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;margin-left:1px;
  background:var(--c-border);border-radius:999px;
  font-size:11px;font-weight:var(--fw-semibold);line-height:1;color:var(--slate);
}
.wl-pill.is-active .wl-pill__count{background:#fff;color:var(--ink)}
/* Pill clusters (the scope dropdowns, and the filter pills) — tight 4px gap. */
.wl-pillgroup{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}

/* Dropdown pills (Show:, Projects) — a pill that opens a single-choice menu.
   Reuses the rounded-pill look; the chevron flips when the menu is open. */
.wl-dd{position:relative;display:inline-flex}
.wl-ddpill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--c-border);background:#fff;border-radius:999px;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--ink);
  cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.wl-ddpill:hover{background:var(--c-bg)}
.wl-dd.is-open .wl-ddpill{background:var(--c-border);border-color:var(--c-border-strong)}
/* Bare variant: no outline or fill, just text + chevron. Used when the pill sits inside an input (Share modal permission) or in a list row. */
.wl-ddpill--bare{border-color:transparent;background:transparent;padding:4px 8px;border-radius:8px}
.wl-ddpill--bare:hover,.wl-dd.is-open .wl-ddpill--bare{background:var(--c-hover);border-color:transparent}
.wl-ddpill__label{color:var(--ink);font-weight:var(--fw-medium)}
.wl-ddpill__value{font-weight:var(--fw-medium)}
.wl-ddpill__chev{display:inline-flex;color:var(--slate-icon);transition:transform .12s ease}
.wl-ddpill__chev svg{width:14px;height:14px;display:block}
.wl-dd.is-open .wl-ddpill__chev{transform:rotate(180deg)}
/* the menu, floating below its pill */
.wl-ddmenu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:172px;
  background:#fff;border:1px solid var(--c-border);border-radius:12px;
  box-shadow:0 10px 28px rgba(136,85,210,.12);padding:5px;
}
.wl-ddmenu__item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:none;background:transparent;border-radius:8px;
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--ink);text-align:left;cursor:pointer;
  transition:background .12s ease;
}
.wl-ddmenu__item:hover{background:var(--c-hover)}
/* "Clear" row: separated from the options, indented to line up with their labels. */
.wl-ddmenu__sep{height:1px;margin:4px -5px;background:var(--c-border)}   /* full-width rule between menu groups */
.wl-ddmenu__clear{position:relative;margin-top:7px;padding-left:33px;color:var(--slate)}
.wl-ddmenu__clear::before{content:'';position:absolute;left:-5px;right:-5px;top:-4px;height:1px;background:var(--c-border)} /* full-width rule above Clear */
.wl-ddmenu__clear:hover{color:var(--ink)}
.wl-ddmenu__check{flex:0 0 15px;width:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-icon)}
.wl-ddmenu__check svg{width:15px;height:15px;display:block}
.wl-ddmenu__item:not(.is-active) .wl-ddmenu__check{visibility:hidden}

/* vertical divider between the scope dropdowns and the filter pills */
.wl-divider{flex:none;width:1px;height:22px;background:var(--c-border);margin:0 2px}

.wl-newtask{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;background:var(--c-ink);border:none;border-radius:10px;
  font-size:14px;font-weight:var(--fw-medium);color:#fff;
  transition:background .12s ease;
}
.wl-newtask:hover{background:var(--c-ink)}
.wl-newtask--secondary{background:#fff;color:var(--ink);border:1px solid var(--c-border);padding:8px 16px}
.wl-newtask--secondary:hover{background:var(--c-hover)}
.wl-newtask__icon{display:inline-flex}.wl-newtask__icon svg{width:17px;height:17px;display:block}

/* board columns */
.wl-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.wl-col{min-width:0}
.wl-col__head{display:flex;align-items:center;gap:8px;padding:0 2px 12px;border-bottom:1px solid var(--c-border)}
.wl-col__title{font-size:16px;font-weight:var(--fw-semibold);color:var(--c-text-2)}
.wl-col__count{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}
.wl-col__body{padding:16px 2px}
.wl-col__empty{margin:0;font-size:13px;color:var(--c-copy)}

@media (max-width:1040px){
  .wl-board{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
}

/* ---------- Routines ---------- */
/* The Routines toolbar now reuses the Tasks classes (.wl-toolbar, .wl-search,
   .wl-dd*, .wl-newtask) so both toolbars share identical sizes — the old
   .rt-toolbar / .rt-search / .rt-filters / .rt-pill / .rt-connect rules were
   removed. (Recoverable from git history.) */
.rt{max-width:1320px}
/* Empty state shown when a filter matches no rows (see rtPairsHTML). */
/* Empty state: centred icon, title, hint and a "Clear search" button. */
.rt-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:56px 16px;color:var(--slate);font-size:14px}
.rt-empty__title{font-size:15px;font-weight:var(--fw-medium);color:var(--ink)}
.rt-empty__text{margin:0;max-width:440px;font-size:13px;line-height:1.5;color:var(--c-copy)}
.rt-empty__actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
/* Ask Mira: outline button sized like the dark "New routine" button next to it. */
.rt-empty__btn{padding:9px 16px;border:1px solid var(--c-border);border-radius:10px;background:#fff;font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--ink);cursor:pointer;transition:background .12s ease}
.rt-empty__btn:hover{background:var(--c-hover)}
/* Search hit: soft violet highlight on the matched fragment. */
.rt-hit{background:rgba(136,85,210,.2);color:inherit;border-radius:3px;padding:0 1px}

/* Routine cards — each routine renders as a self-contained card (see
   rtPairsHTML). This replaces the old "trigger → arrow → workflow" row plus the
   helper-text aside. The layout follows the "routine cards" wireframe: a header
   with the routine name on the left and a status label + toggle on the right, a
   divider, then two labelled rows ("When" and "Where it goes"). */
.rt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* When the chat panel is open the content area is narrower (the panel takes its
   own shell column), so the cards drop to a single column for readability. */
.rt--panel .rt-grid{grid-template-columns:1fr}
/* Active card (its panel is open) reads as selected: a crisp ink outline (a 2px
   ring via border + box-shadow) plus a soft lift. Doubled class so it outranks the
   base .rt-card / .rt-card:hover rules defined later in the file. */
.rt-card.rt-card--active,
.rt-card.rt-card--active:hover{border-color:rgba(136,85,210,.28);box-shadow:0 2px 12px rgba(136,85,210,.22);transform:none} /* same violet glow as the Home cards' hover */

/* Chat side panel — a shell column (sibling of .main) styled as the same floating white
   card as the content on the left: 1px border, 10px radius, 8px margins. Stays put while the list scrolls.
   Shown/filled by updateRtPanel(); empty body for now (chat UI lands later). */
.rt-panel{
  /* Closed state: zero width, no border, transparent. .is-open (set by updateRtPanel) grows it to
     400px, so the content card on the left eases narrower as the panel eases in (and back on close).
     Margins: 8px top/bottom/right like .main; the gap to the content card is .main's 8px right margin. */
  flex:0 0 0;width:0;margin:8px 0;
  display:flex;flex-direction:column;
  background:#fff;
  border:0 solid var(--c-border);
  border-radius:10px;           /* same container look as .main */
  overflow:hidden;              /* clip the head/body/foot to the rounded corners */
  opacity:0;
  transition:flex-basis .4s cubic-bezier(.22,.61,.36,1),width .4s cubic-bezier(.22,.61,.36,1),
             margin .4s cubic-bezier(.22,.61,.36,1),border-width .4s cubic-bezier(.22,.61,.36,1),
             opacity .3s ease;
}
.rt-panel.is-open{flex-basis:400px;width:400px;margin:8px 8px 8px 0;border-width:1px;opacity:1}
/* Inner blocks keep the full open width while the panel is still growing/shrinking, so the
   text doesn't reflow (the panel just reveals/clips them). */
.rt-panel > *{width:398px;flex-shrink:0}
@media (prefers-reduced-motion:reduce){ .rt-panel{transition:none} }
.rt-panel__head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-sizing:border-box;height:56px;padding:6px 10px 10px 24px;border-bottom:1px solid var(--sidebar-border);   /* 40px row + 10px below; the 6px on top lines the row up with the workspace name in the sidebar */
}
/* Routine side panel: the Mira avatar sits in the header, before the routine name — that is the
   single marker that this is a chat with Mira (no avatar/name row inside the thread). */
.rt-panel__who{display:flex;align-items:center;gap:10px;min-width:0}
.rt-panel__who .nr__avatar{flex:0 0 22px}
.rt-panel__title{font-size:15px;font-weight:var(--fw-semibold);color:var(--name);   /* same type as the workspace name (.teamsw__btn) */
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Header buttons: expand (opens this routine's chat in the Ask Mira tab) + close. */
.rt-panel__actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.rt-panel__close{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;border-radius:8px;   /* = .icon-btn */
  background:transparent;color:var(--slate-icon);cursor:pointer;transition:background .12s ease,color .12s ease;
}
.rt-panel__close:hover{background:var(--c-hover);color:var(--c-text)}
.rt-panel__close svg{width:16px;height:16px;display:block}   /* = the bell and collapse icons */
.rt-panel__body{flex:1 1 auto;min-height:0;padding:22px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
/* Routine name inside Mira's messages: medium weight (500) instead of the default bold. */
.rt-name{font-weight:var(--fw-medium)}
/* New routine panel: the user's own bubble matches the panel's 14px text. */
.rt-panel .nr__user{font-size:14px}
/* Draft card: dashed outline, muted placeholders. Not clickable (it is the thing being built). */
.rt-card--draft{cursor:default;border-style:dashed}
/* Empty placeholders: the same muted grey as the rest of the card's secondary text, no italics
   (the title keeps its normal weight, the values their usual 500). */
.rt-card__title--empty,.rt-card__desc--empty,.rt-card__value--empty{color:var(--c-muted)}
/* Entrance of a new draft card (also when copying a routine): it drops in from just above with a
   soft fade, then a violet ring pulses once around it, so it is obvious a new card appeared. */
.rt-card--enter{animation:rtDraftIn .55s cubic-bezier(.22,.61,.36,1) both,rtDraftPulse 1.5s ease-out .35s 1 both}
@keyframes rtDraftIn{from{opacity:0;transform:translateY(-14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rtDraftPulse{
  0%{box-shadow:0 0 0 0 rgba(136,85,210,.45),0 2px 12px rgba(136,85,210,.22)}
  100%{box-shadow:0 0 0 12px rgba(136,85,210,0),0 2px 12px rgba(136,85,210,.22)}
}
@media (prefers-reduced-motion:reduce){ .rt-card--enter{animation:none} }
/* A fillable spot on the draft card (see rtPatchDraft); flex so the title keeps its ellipsis. */
.rt-draft__slot{display:flex;min-width:0}
/* Answer chips: primary variant for the save button; chips can carry several tool logos. */
/* Chat buttons (save…): clearly buttons, not badges — 10px radius like "New routine", taller, 14px.
   Primary = ink ("Save and turn on"); the others are white with a border. */
.nr__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
/* Lead-in line between the decision buttons and the suggestion pills. */
.nr__or{margin:6px 0 -2px;font-size:13px;line-height:1.4;color:var(--c-copy)}
.nr__btn{
  height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--c-border-strong);background:#fff;
  font-family:inherit;font-size:14px;font-weight:var(--fw-medium);color:var(--c-text);cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
  animation:nrRise .48s ease both;animation-delay:.4s;
}
.nr__btn:hover{background:var(--c-hover)}
.nr__btn--primary{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.nr__btn--primary:hover{background:#000;border-color:#000}
@media (prefers-reduced-motion:reduce){ .nr__btn{animation:none} }
.nr__chip-icon--multi{flex:0 0 auto;gap:3px;align-items:center}
.nr__chip-icon--multi .rt-logo{width:16px;height:16px;flex-basis:16px}
.nr__chip-icon--multi .rt-logo svg{width:16px;height:16px}
/* "Browse all routines": a quiet text link under the chips. */
.nr__link{align-self:flex-start;padding:0;border:0;background:none;font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--slate);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.nr__link:hover{color:var(--ink)}
/* Panel message bubble is a touch smaller than the full Mira chat (14px). */
.rt-panel .nr__bubble{font-size:14px}
/* Panel badges flow and wrap onto multiple rows instead of stacking in a column
   (the New routine chat keeps its column layout). */
.rt-panel .nr__chips{flex-direction:row;flex-wrap:wrap;gap:8px}
/* Composer pinned to the bottom of the panel. */
.rt-panel__foot{flex:0 0 auto;padding:14px 24px 22px}
.rt-panel__foot .composer__input{font-size:14px;height:38px}

/* On small screens the side nav is already hidden; hide this panel too so the
   list keeps the full width. */
@media (max-width:900px){
  .rt-panel{display:none}
}

/* The whole card is clickable (it opens the chat side panel — not wired yet),
   so it carries a pointer cursor and a hover lift to signal that affordance.
   Inner controls (toggle, Play) keep their own hover and will stop propagation. */
/* .card-shell = the frame every "header + content" card shares (routine cards, insight cards): white surface,
   border, 10px radius, soft shadow, 16px padding. Built by cardShell() in the script. */
.card-shell,.rt-card{
  display:flex;flex-direction:column;
  padding:16px;background:#fff;border:1px solid var(--c-border);border-radius:10px;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));
}
.rt-card{
  cursor:pointer;
  transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;
}
.rt-card:hover{border-color:rgba(136,85,210,.28);box-shadow:0 2px 12px rgba(136,85,210,.22);transform:none} /* same glow as .home-card--needs:hover */
/* Header: routine name on the left, status label + toggle pushed to the right. */
.rt-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rt-card__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Title + optional team badge: the title keeps its ellipsis, the badge never shrinks. */
.rt-card__titlewrap{display:flex;align-items:center;gap:8px;min-width:0}
.rt-card__titlewrap .home-badge{flex:0 0 auto}
.rt-card__status{flex:0 0 auto;display:flex;align-items:center;gap:10px}
/* Label is slate by default; the --on modifier (active routine) turns it green. */
.rt-card__status-label{transition:color .32s ease;font-size:12px;font-weight:var(--fw-medium);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--slate,var(--c-muted))}
.rt-card__status--on .rt-card__status-label{color:var(--c-brand-purple)}
/* Failing: the label turns red (same red as the other risk badges); the toggle stays on. */
.rt-card__status--fail .rt-card__status-label{color:var(--c-error)}
/* Warning icon sits right before the label (6px gap inside .rt-card__state). */
.rt-card__state{position:relative;display:inline-flex;align-items:center;gap:6px}
.rt-card__status-icon{display:none;color:var(--c-error)}
.rt-card__status-icon svg{width:14px;height:14px;display:block}
.rt-card__status--fail .rt-card__status-icon{display:inline-flex}
/* Affordance: the failing state looks interactive (dotted underline on the label, pointer) and
   on hover shows a small dark tooltip below it, right-aligned to the card edge so it never
   spills out. The card is lifted while the tooltip shows so it paints over the card below. */
.rt-card__status--fail .rt-card__state{cursor:pointer}
.rt-card__status--fail .rt-card__state .rt-card__status-label{text-decoration:underline dotted;text-underline-offset:3px}
.rt-card__status--fail .rt-card__state::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;z-index:40;text-align:left;
  padding:7px 10px;border-radius:8px;background:var(--c-ink);color:#fff;
  font-family:inherit;font-size:12px;font-weight:var(--fw-medium);line-height:1.3;letter-spacing:0;text-transform:none;white-space:nowrap;
  box-shadow:0 6px 18px rgba(17,17,17,.18);
  opacity:0;transform:translateY(-3px);pointer-events:none;
  transition:opacity .14s ease,transform .14s ease;
}
.rt-card__status--fail .rt-card__state:hover::after{opacity:1;transform:none;transition-delay:.15s}
.rt-card:has(.rt-card__state:hover){position:relative;z-index:6}

/* Toggle switch — a pill track with a sliding knob. It's a real button: clicking
   flips the routine's active/paused state and re-renders (wired in the 'routines'
   branch of renderContent). The --on modifier drives both colour and knob slide.
   Track 32×20, knob 16 inset 2px → on-slide = 32 − 16 − 2 − 2 = 12px. */
.rt-toggle{
  flex:0 0 auto;position:relative;width:32px;height:20px;padding:0;border:0;border-radius:999px;
  background:var(--c-border-strong);cursor:pointer;transition:background .32s cubic-bezier(.4,0,.2,1);   /* soft on/off: slow colour cross-fade */
}
.rt-toggle__knob{
  position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(136,85,210,.25);transition:transform .32s cubic-bezier(.22,1,.36,1);   /* knob glides and settles softly */
}
.rt-card__status--on .rt-toggle{background:var(--c-brand-purple)}
.rt-card__status--on .rt-toggle__knob{transform:translateX(12px)}

/* "…" more-actions button at the far right of the card header, with a small
   dropdown (Edit with Mira / Make a copy / Delete). Reuses the .wl-ddmenu look; the menu is anchored
   to the button's right edge so it never spills outside the card. The card that
   owns an open menu is lifted (z-index) so the menu paints above the next row. */
.rt-more{position:relative;flex:0 0 auto;display:inline-flex}
.rt-more__btn{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-4px -6px -4px 0;
  padding:0;border:0;border-radius:8px;background:transparent;color:var(--slate-icon);cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.rt-more__btn svg{width:18px;height:18px;display:block;stroke-width:2.4}
.rt-more__btn:hover,.rt-more.is-open .rt-more__btn{background:var(--c-hover);color:var(--ink)}
.rt-more .wl-ddmenu{left:auto;right:-6px;min-width:150px}
.rt-more .wl-ddmenu__item svg{width:15px;height:15px;display:block;color:var(--slate-icon)}
.rt-more .wl-ddmenu__item--danger{color:var(--c-error)}   /* red label */
.rt-more .wl-ddmenu__item--danger svg{color:color-mix(in srgb,var(--c-error) 55%,#fff)}   /* icon: a lighter red, matching the softer weight of the other icons */
.rt-card:has(.rt-more.is-open){position:relative;z-index:5}

/* Connect row inside a routine's chat panel (shown when the routine is failing because a tool
   isn't connected). Same pattern as the last onboarding step: tool logo + name on the left,
   a ghost "Connect" button on the right that turns into a green "Connected" tick. */
.rt-conn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--c-border);border-radius:10px;transition:background .2s ease,border-color .2s ease}
.rt-conn .rt-logo{width:22px;height:22px;flex-basis:22px}
.rt-conn .rt-logo svg{width:22px;height:22px}
.rt-conn__name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.rt-conn__btn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--c-border-strong);background:#fff;color:var(--c-text);cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:var(--fw-medium);letter-spacing:.07em;text-transform:uppercase;
  transition:background .12s ease;
}
.rt-conn__btn svg{width:15px;height:15px;display:block}
.rt-conn__btn:hover{background:var(--c-hover)}
.rt-conn__done{flex:0 0 auto;display:none;align-items:center;gap:6px;color:#16a34a;font-size:11px;font-weight:var(--fw-medium);letter-spacing:.1em;text-transform:uppercase}
.rt-conn__done svg{width:14px;height:14px;display:block}
.rt-conn.is-on{background:#f0fdf4;border-color:#bbf7d0}
.rt-conn.is-on .rt-conn__btn{display:none}
.rt-conn.is-on .rt-conn__done{display:inline-flex}
.rt-conn-after[hidden]{display:none}
/* ---- Routine library (see rtlOpen) ---- */
.rt-view--enter{animation:rtViewIn .38s cubic-bezier(.22,.61,.36,1) both}
@keyframes rtViewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .rt-view--enter{animation:none} }
.rtl .ind-crumb{margin-bottom:10px;color:var(--c-copy)}
/* The clickable crumb uses the Link component (home-link: underline, ink on hover), at breadcrumb size. */
.rtl .ind-crumb .home-link{font-size:13px;color:var(--c-copy)}
.rtl .ind-crumb .home-link:hover{color:var(--c-text)}
.rtl .wl__subtitle,.rtl .ind-crumb span{color:var(--c-copy)}
.rtl .wl-pill:not(.is-active){color:var(--c-copy)}   /* category chips */
.rtl .ind-crumb span:last-child{font-weight:var(--fw-medium)}   /* current page: "Library" */
/* Bundle meta ("Tasks · 4 routines") = the "Apps" label of the side nav (.nav-group__label): Plex Mono 12px, medium, caps. */
.rtl .home-box__meta{font-size:12px;font-weight:var(--fw-medium);color:var(--slate,var(--c-muted));text-transform:uppercase;letter-spacing:.06em}
.rtl .wl-search.is-open{width:340px}   /* room for the longer placeholder */
.rtl-label{margin:0 0 12px;font-size:12px;font-weight:var(--fw-medium);color:var(--slate);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}   /* = the "Apps" label of the side nav */
.rtl-label--gap{margin-top:28px}
.rtl-label--list{margin-bottom:10px;font-family:var(--font);font-size:16px;font-weight:var(--fw-semibold);color:var(--c-text);text-transform:none;letter-spacing:normal}   /* headings above the routines list keep the section-title look */
.rtl-label--list.rtl-label--gap{margin-top:24px}
.rtl-sub{margin:0;font-size:13px;line-height:1.5;color:var(--c-copy)}
/* Bundle: one of Home's grey containers holding its routines. */
.rtl-bundle{display:flex;flex-direction:column;gap:16px;margin:0 -16px 12px;   /* 12px = Home's 8px container gap + 4px more air */
  background:#FAFAFA;border-radius:12px;padding:16px}   /* the grey container bleeds 16px outward (= its padding), so the title and cards stay aligned with the rest of the page, like on Home */
.rtl-bundle:last-of-type{margin-bottom:0}
.rtl-bundle__title{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.rtl-bundle__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rtl-bundle__txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.rtl-bundle .home-box__meta{margin:0}
.rtl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}   /* 4 across; 2×2 on a narrower window */
@media (max-width:1180px){ .rtl-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.rtl-grid--flat{margin-bottom:4px}
.rtl-bundle__acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rtl-count{font-size:13px;color:var(--c-copy)}
.rtl-card{gap:6px}
.rtl-card .rt-card__title{font-size:14px;white-space:normal}
.rtl-card .rt-card__desc{margin:0}
.rtl-card.is-clickable{cursor:pointer}   /* the whole card opens the draft with Mira */
.rtl-card:not(.is-clickable){cursor:default}
.rtl-card:not(.is-clickable):hover{border-color:var(--c-border);box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04))}
.rtl-card__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.rtl-card__foot .rtl-meta{min-width:0;font-size:13px}
.rtl-card__foot .rtl-use{font-size:13px}   /* beats .home-link's 14px (defined later) */
.rtl-from,.rtl-meta{font-size:12px;line-height:1.4;color:var(--c-copy)}
.rtl-from{margin-bottom:4px}
.rtl-meta{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.rtl-meta__apps{display:inline-flex;align-items:center}
.rtl-icon{color:var(--slate-icon)}
/* "Not finding it?" */
.rtl-build{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding:16px;border:1px dashed var(--c-border-strong);border-radius:12px}
.rtl-build__txt{display:flex;flex-direction:column;gap:2px}
.rtl-build__title{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
/* Mira's panel for a bundle: checklist of what will be added. */
.rt-panel__titles{display:flex;flex-direction:column;min-width:0}
.rt-panel__sub{font-size:12px;color:var(--c-copy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtl-body{display:flex;flex-direction:column;gap:14px}
.rtl-body .nr__btn{animation:none}
.rtl-pick{margin:0;padding:0;border:0;min-width:0}
.rtl-pick legend{padding:0;margin-bottom:2px;font-size:13px;color:var(--c-copy)}
.rtl-pick__row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--c-border)}
.rtl-pick__row:last-child{border-bottom:0}
.rtl-pick__row input{margin:3px 0 0;accent-color:var(--c-ink);flex:0 0 auto}
.rtl-pick__row label{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0;cursor:pointer}
.rtl-pick__name{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.rtl-pick__row .rt-conn__btn{padding:6px 12px;font-size:11px}
.nr__btn:disabled{opacity:.45;cursor:default}


/* One-line routine description, sitting under the header (title + status) and
   above the divider. Muted so the title stays the anchor. */
/* margin-bottom:0 so the gap to the divider is just the divider's own 16px top
   margin — matching the divider→"When" gap below it (no stray paragraph margin). */
.rt-card__desc{margin:2px 0 0;font-size:13px;font-weight:var(--fw-regular);line-height:1.5;color:var(--c-copy)}

/* Full-bleed divider: negative horizontal margin equal to the card's 16px
   padding pulls it out to both borders, so it spans edge to edge. */
.rt-card__divider{height:1px;margin:16px -16px;background:var(--c-border)}

/* Body: the two labelled info rows, each an icon followed by a label over its value. */
.rt-card__body{display:flex;flex-direction:column;gap:14px}
.rt-card__row{display:flex;align-items:flex-start;gap:12px;min-width:0}
.rt-card__icon{flex:0 0 18px;margin-top:2px;color:var(--slate-icon)}
.rt-card__icon svg{width:18px;height:18px;display:block}
/* Tool logos: the destination logo fills the 18px icon slot; "Uses" shows a strip of
   18px logos (all of them, wrapping if needed). */
.rt-logo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 18px}
.rt-logo svg{width:18px;height:18px;display:block}
/* Red dot on the top-right of a logo whose tool isn't connected (failing routine card). */
.rt-logo--alert{position:relative}
.rt-logo--alert::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-error);box-shadow:0 0 0 2px #fff}
.wl-ddmenu__item .rt-logo{margin-right:8px}
.wl-dd[data-dd="tool"] .wl-ddmenu__item{white-space:nowrap} /* keep "Google Calendar" on one line */
.rt-card__value--dest{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.rt-logos{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;min-height:20px}
.rt-card__field{min-width:0;display:flex;flex-direction:column;gap:2px}
/* "When" / "Where it goes" labels: same eyebrow font as the "Apps" label in the side nav. */
.rt-card__label{font-size:12px;font-weight:var(--fw-medium);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--slate,var(--c-muted))}
.rt-card__value{font-size:13px;font-weight:var(--fw-regular);color:var(--c-copy)}

/* Small outline "Play" button — shown only on manual routines (no trigger),
   pushed to the right of the "When" row via margin-left:auto. */
.rt-play{
  flex:0 0 auto;margin-left:auto;align-self:center;
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  border:1px solid var(--c-border);border-radius:8px;background:#fff;
  font-size:13px;font-weight:var(--fw-medium);color:var(--c-text);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;
}
.rt-play:hover{border-color:var(--c-border-strong);background:var(--c-hover)}
.rt-play svg{width:14px;height:14px;display:block}
/* Run states (wired in the 'routines' branch): Play → Running… → Done.
   Running shows a spinning refresh icon; Done turns green with a check. */
.rt-play--running{color:var(--slate,var(--c-muted));cursor:default}
.rt-play--running:hover{background:#fff;border-color:var(--c-border)}
.rt-play--running svg{animation:rt-spin .8s linear infinite}
.rt-play--done{color:#16a34a;border-color:#bbe6c8;cursor:default}
.rt-play--done:hover{background:#fff}
@keyframes rt-spin{to{transform:rotate(360deg)}}

/* Stack into a single column once the cards get too narrow to sit side by side. */
@media (max-width:760px){
  .rt-grid{grid-template-columns:1fr}
}

/* ---------- New routine (chat) ---------- */
.content--nr{padding:0;display:flex;align-items:stretch}
.nr{flex:1 1 auto;min-width:0;display:flex;align-items:stretch}

/* entrance: page fades in, then Mira's message + chips reveal in sequence */
@keyframes nrFade{from{opacity:0}to{opacity:1}}
@keyframes nrRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.content--nr{animation:nrFade .3s ease both}
.nr__from{animation:nrRise .42s ease both;animation-delay:.08s}
.nr__bubble{animation:nrRise .48s ease both;animation-delay:.22s}
.nr__chips .nr__chip{animation:nrRise .48s ease both}
.nr__chips .nr__chip:nth-child(1){animation-delay:.4s}
.nr__chips .nr__chip:nth-child(2){animation-delay:.54s}
.nr__chips .nr__chip:nth-child(3){animation-delay:.68s}
.nr__chips .nr__chip:nth-child(4){animation-delay:.82s}
@media (prefers-reduced-motion:reduce){
  .content--nr,.nr__from,.nr__bubble,.nr__chips .nr__chip{animation:none}
}

/* Typing state: three dots shown while Mira "writes". A smooth left-to-right wave — each dot swells
   a little and settles back, one after the other. Brand is only a hint: the dots rest in a light
   neutral grey and, at the peak of their swell, take a soft tint of the brand purple (no glow). */
.mira-typing{
  --rest:#d9d9dd;
  --peak:color-mix(in srgb,var(--c-brand-purple) 55%,#fff);
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 2px;
  animation:nrRise .3s ease both;
}
.mira-typing i{
  width:6px;height:6px;border-radius:50%;background:var(--rest);
  animation:miraWave 1.4s cubic-bezier(.45,.05,.35,1) infinite;
  animation-delay:calc(var(--n) * .18s);
}
.mira-typing i:nth-child(1){--n:0}
.mira-typing i:nth-child(2){--n:1}
.mira-typing i:nth-child(3){--n:2}
@keyframes miraWave{
  0%,55%,100%{transform:scale(1);background:var(--rest)}
  28%{transform:scale(1.4);background:var(--peak)}
}
@media (prefers-reduced-motion:reduce){ .mira-typing i{animation:none} }
/* Routine side panel: the real message content is revealed once the typing dots are done. */
.rt-reveal{display:flex;flex-direction:column;gap:14px}

/* left: chat column */
.nr__chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding:32px 36px 28px}
.nr__scroll{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px;width:100%;max-width:660px;margin-inline:auto;overflow-y:auto;padding-bottom:12px}
/* The user's own message: right-aligned, softly tinted. */
.nr__user{align-self:flex-end;max-width:520px;padding:12px 16px;border-radius:12px;background:#f1ecfa;font-size:15px;line-height:1.5;color:var(--ink);animation:nrRise .3s ease both}
.nr__chips .nr__chip:nth-child(n+5){animation-delay:.9s}
/* One compact "you're talking to Mira" marker at the top of the chat (not one per message). */
.nr__from{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.nr__avatar{width:22px;height:22px;border-radius:50%;display:block}
.nr__name{font-size:14px;font-weight:var(--fw-medium);color:var(--ink)}
/* Mira's messages are plain text on the page (like Claude) — no bubble, border or fill; only the
   user's own messages (.nr__user) sit in a tinted bubble. The class name stays .nr__bubble
   because nrSync() counts these elements to know which thread entries are already on screen. */
.nr__bubble{
  align-self:flex-start;max-width:600px;padding:0;
  font-size:16px;line-height:1.6;color:var(--ink);
}
.nr__quote{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--c-bg);font-size:14px;line-height:1.55}   /* quoted text (the report draft) on the side nav's grey */
.nr__chips{display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px;margin-top:4px}   /* 8px = the gap between the header buttons (Share, Send report) */
.nr__chips:has(.nr__btn){align-items:center}   /* a primary button (36px) in a chip row (32px): centred on the same line */
.nr__chips .nr__btn--gap{margin-left:8px}   /* the main action sits a little apart from the options (16px in total) */
/* Chat suggestion badge — shared by the Mira "New routine" chat and the routine
   side panel. Rounded pill, 36px tall, 13px text. */
.nr__chip{
  display:inline-flex;align-items:center;gap:8px;max-width:100%;height:32px;padding:0 12px;
  border:1px solid var(--c-border);border-radius:999px;background:#fff;text-align:left;
  box-shadow:var(--card-shadow,0 1px 2px rgba(136,85,210,.04));
  font-family:inherit;font-size:13px;font-weight:var(--fw-medium);color:var(--ink);cursor:pointer;
  transition:border-color .12s ease,box-shadow .12s ease,background .12s ease;
}
.nr__chip:hover{border-color:var(--c-border-strong);box-shadow:0 2px 8px rgba(136,85,210,.06)}
.nr__chip-icon{flex:0 0 16px;display:inline-flex;color:var(--slate)}
.nr__chip-icon svg{width:16px;height:16px;display:block}
.nr__composer{margin:auto auto 0;max-width:660px;width:100%}

/* right: draft panel */
.nr__panel{
  flex:0 0 380px;max-width:380px;display:flex;flex-direction:column;
  padding:28px 30px 26px;background:var(--c-bg);border-left:1px solid var(--sidebar-border);
}
.nr__panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:28px}
.nr__panel-title{font-size:19px;font-weight:var(--fw-semibold);color:var(--ink)}
.nr__draft{
  flex:0 0 auto;padding:4px 11px;border:1px solid var(--c-border);border-radius:999px;
  font-size:12px;font-weight:var(--fw-medium);color:var(--slate);background:#fff;
}
.nr__fields{display:flex;flex-direction:column;gap:22px}
.nr__field-label{font-size:15px;font-weight:var(--fw-medium);color:var(--c-text-2);margin-bottom:4px}
.nr__field-value{font-size:15px;font-style:italic;color:var(--slate-icon)}
.nr__field-value.is-set{font-style:normal;color:var(--ink)}
.nr__save{
  margin-top:auto;width:100%;padding:15px 18px;border:none;border-radius:12px;
  background:var(--c-border-strong);color:#fff;font-family:inherit;font-size:15px;font-weight:var(--fw-medium);
  cursor:not-allowed;transition:background .15s ease;
}
/* Complete draft: the button turns dark and clickable (same ink as "New routine"). */
.nr__save:not(:disabled){background:var(--c-ink);cursor:pointer}
.nr__save:not(:disabled):hover{background:#000}
.nr__hint{margin:14px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--c-copy)}

@media (max-width:860px){
  .nr{flex-direction:column}
  .nr__chat{padding:18px 20px 24px}
  .nr__panel{flex:1 1 auto;max-width:none;border-left:none;border-top:1px solid var(--sidebar-border)}
  .nr__save{margin-top:24px}
}

/* ---------- Home ---------- */
/* Mira's daily surface (built from the Home wireframe). A greeting row on
   top, then two columns of containers: "Needs you" (wide, left) and the stacked
   "Keep an eye on" / "Mira handled today" / "Business snapshot" (narrow, right).
   Sections have no container box; the item cards (white, 12px, --c-border hairline) sit directly on the page. Everything uses the --c-*
   tokens, so no new greys are introduced. */
.home{display:flex;flex-direction:column;gap:24px}
.home-fade{animation:nrFade .28s ease both}

/* Greeting row: title + workspace chip on the left, status + date + settings right. */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-top__l,.home-top__r{display:flex;align-items:center;gap:8px;min-width:0}
.home-top__title{margin:0;font-size:28px;font-weight:var(--fw-semibold);letter-spacing:-.01em;color:var(--c-text)}
.home-top__checked{font-size:13px;color:var(--c-copy)}
.home-pill{
  display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;
  border:1px solid var(--c-border);background:#fff;font-size:13px;font-weight:var(--fw-medium);color:var(--c-text);white-space:nowrap;
}
.home-iconbtn{
  width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--c-border);border-radius:999px;background:#fff;color:var(--c-muted);
  transition:background .12s ease,color .12s ease;
}
.home-iconbtn:hover{background:var(--c-hover);color:var(--c-text)}
.home-iconbtn svg{width:16px;height:16px}
/* Dark tooltip under an icon button (right-aligned so it never spills off the page). Used by the dashboard gear. */
.has-tip{position:relative}
.has-tip::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;z-index:40;text-align:left;
  padding:7px 10px;border-radius:8px;background:var(--c-ink);color:#fff;
  font-size:12px;font-weight:var(--fw-medium);line-height:1.3;white-space:nowrap;
  opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .14s ease,transform .14s ease;
}
.has-tip:hover::after{opacity:1;transform:none;transition-delay:.15s}
/* dashboard header: the date pill's menu opens right-aligned, and the Share button's icon sits left of its label */
.home-top__r .wl-ddmenu{left:auto;right:0}
/* date range menu: muted date hint after the label; custom-range calendar popover under the pill */
.wl-dd[data-dd="rtlcat"] .wl-ddmenu__item:has(.share-perm__txt){align-items:flex-start;gap:10px}   /* audience rows: title + muted line */
.wl-dd[data-dd="rtlcat"] .wl-ddmenu{min-width:300px}
.wl-ddmenu__hint{color:var(--c-copy);font-weight:var(--fw-regular,400);white-space:nowrap}
.home-top__r .wl-ddmenu{min-width:180px}
.ins-cal{
  position:absolute;top:calc(100% + 6px);right:0;z-index:31;width:300px;padding:14px;
  background:#fff;border:1px solid var(--c-border);border-radius:12px;box-shadow:0 10px 28px rgba(136,85,210,.12);
}
.ins-cal__title{font-size:13px;font-weight:var(--fw-semibold);color:var(--c-text);margin-bottom:10px}
.ins-cal__fields{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ins-cal__dash{color:var(--c-muted)}
.ins-cal__field{flex:1;display:flex;flex-direction:column;gap:1px;padding:6px 10px;border:1px solid var(--c-border);border-radius:8px}
.ins-cal__field span{font-size:11px;color:var(--c-muted)}
.ins-cal__field b{font-size:13px;font-weight:var(--fw-medium);color:var(--c-text)}
.ins-cal__field.is-next{border-color:var(--c-ink)}
.ins-cal__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ins-cal__month{font-size:13px;font-weight:var(--fw-semibold);color:var(--c-text)}
.ins-cal__nav{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:8px;color:var(--slate-icon);transform:rotate(90deg)}
.ins-cal__nav--next{transform:rotate(-90deg)}
.ins-cal__nav:hover{background:var(--c-hover);color:var(--c-text)}
.ins-cal__nav svg{width:14px;height:14px}
.ins-cal__grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.ins-cal__wd{text-align:center;font-size:11px;color:var(--c-muted);padding:4px 0}
.ins-cal__day{height:32px;border:none;background:transparent;border-radius:8px;font-family:inherit;font-size:13px;color:var(--c-text);cursor:pointer}
.ins-cal__day:hover{background:var(--c-hover)}
.ins-cal__day.is-in{background:var(--c-hover);border-radius:0}
.ins-cal__day.is-edge{background:var(--c-ink);color:#fff}
.ins-cal__foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--c-border)}
.ins-cal__range{flex:1;font-size:12px;color:var(--c-muted)}

.home-top__r .wl-newtask{display:inline-flex;align-items:center;gap:6px}
.home-top__r .wl-newtask svg{width:15px;height:15px}
.home-top__r .wl-ddpill,.home-top__r .wl-newtask{height:32px;padding-top:0;padding-bottom:0}   /* same 32px height as the gear */

/* Edit-mode banner: shown above the two columns after the gear is clicked. Message on the
   left, secondary "Reset to default" + primary "Done" on the right. Toggled via [hidden]. */
.home-editbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px 16px;border-radius:12px;border:1px solid var(--c-border);background:#fff;
}
.home-editbar__text{font-size:14px;font-weight:var(--fw-medium);color:var(--c-text)}
.home-editbar__actions{display:flex;align-items:center;gap:8px}
/* While editing, "Needs you" (first section of the left column; in layout C the whole left column) is disabled: dimmed and not clickable. */
.home.is-editing:not(.home--c) .home-cols > :first-child,
.home--c.is-editing .home-cols > .home-col:first-child{opacity:.4;pointer-events:none;user-select:none}
/* Edit mode, layout C: the right column (the editable one) gets a pale lavender background (#FBFAFE).
   The dashed #A3CBFB outline that used to go with it is hidden for now
   (it was: outline:1px dashed #A3CBFB; outline-offset:-1px). */
.home--c.is-editing .home-cols > .home-col + .home-col{background:#FBFAFE}
/* Drag handle left of a right-column section title. Only visible while editing (it will start
   the reorder drag; the drag itself isn't wired yet). The icon stroke is thick so the dots read. */
.home-drag{
  display:none;width:24px;height:24px;flex:0 0 24px;align-items:center;justify-content:center;
  margin-right:4px;border:0;border-radius:6px;background:transparent;color:#5B34A0;cursor:grab; /* dark purple (same as the Sales tag text) */
}
.home-drag:hover{background:#F4F1FB;color:#5B34A0} /* banner colour */
.home-drag:active{cursor:grabbing}
.home-drag{padding:0}
.home-drag svg{width:16px;height:16px;flex:0 0 16px} /* same size as the "+" in the Add widgets container */
/* Grip proportions follow Inputs/Other/drag&drop proporcja.png, relative to the 16px section title:
   dots ~0.2em (3.2px), 7px apart across, 6px down (grip ~10x15px, about one title font-size tall),
   and ~9px of air between the grip and the title text. The svg is 24px, so 1 unit = 1px. */
.home.is-editing .home-drag{display:inline-flex}
/* C/D: the handle hangs in the padding (zero layout width), so it can simply fade in and out. */
.home--c .home-drag{display:inline-flex;opacity:0;pointer-events:none;transition:opacity .3s ease}
/* Only the right (purple, editable) column can be reordered, so the left column never shows handles. */
.home--c.is-editing .home-col + .home-col .home-drag{opacity:1;pointer-events:auto}
.home-box__titlewrap{display:flex;align-items:center;min-width:0}
/* Collapse chevron right of a section title: points down when open, right when the section is collapsed. */
.home-box__collapse{margin-left:4px;width:24px;height:24px}
.home-box__collapse svg{transition:transform .2s ease}
.home-box.is-collapsed .home-box__collapse svg{transform:rotate(-90deg)}
/* Collapsed: only the header row stays. */
.home-box.is-collapsed > :not(.home-box__head){display:none}
/* Gear shows a pressed state while editing. */
.home-iconbtn.is-active{background:var(--c-hover);color:var(--c-text)}

/* Two columns. */
/* Layouts (switcher at the bottom of Home):
   A  two columns 3:2 — Needs you | the rest; keeps the original centred 1200px width.
   B  three columns 3:3:2 — Needs you | Keep an eye on + Mira handled | Business snapshot (tiles stacked).
   C  two columns 3:2 — Needs you + Keep an eye on + Mira handled in one stack | Business snapshot;
      compact card rows (see .home-card__row). */
.home-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.home--a{max-width:1200px;margin:0 auto}
.home--b .home-cols{grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,2fr)}
.home--b .home-tiles{grid-template-columns:1fr}
/* Layout switcher: floating segmented control, bottom-centre, only rendered on Home. */
.home-switch{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;
  display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#fff;
  border:1px solid var(--c-border-strong);box-shadow:0 8px 24px rgba(136,85,210,.16);
}
.home-switch button{height:28px;padding:0 12px;border:0;background:transparent;font-size:12px;font-weight:var(--fw-medium);color:var(--c-muted);white-space:nowrap}
.home-switch button:hover{color:var(--c-text)}
.home-switch button.is-on{background:var(--c-ink);color:#fff}
.home-col{display:flex;flex-direction:column;gap:32px;min-width:0}
/* Layout C dividers (#ECECED). The page padding moves off .content and onto the pieces, so the
   horizontal line under the greeting bar runs edge to edge of the white card, and the vertical
   line between the columns starts at it and runs down to the card's bottom edge. */
.content:has(> .home--c){padding:0;display:flex}
.home--c{flex:1 1 auto;gap:0;min-width:0}
.home--c .home-top{padding:28px 40px 20px;border-bottom:1px solid #ECECED}
/* Edit banner at the very top of the right column (layout C), styled after Inputs/Other/background setup.png:
   pale lavender bar, purple text and buttons. Negative margins cancel the column's padding (16 top,
   24 left, 32 right) so it runs edge to edge and sits flush under the horizontal divider.
   The ::after strip repeats the column background with rounded top corners, so the content below
   looks like it overlaps the banner and the corners show lavender behind them. Padding-bottom
